<script>
  // ─── i18n ─────────────────────────────────────────────────────────────────
  const I18N = {
    fr: {
      nav_home:'Accueil', nav_rabbis:'Rabbins ▾', nav_last_classes:'Derniers cours', nav_daf_hayomi:'Daf Hayomi', nav_parasha:'Paracha', nav_themes:'Thème', nav_all_rabbis:'Tous les rabbins →',
      lang_toggle:'עברית',
      subtitle:'Cours de Torah — disponibles sur vos plateformes favorites',
      search_ph:'Rechercher un épisode ou un rav…',
      recents:'Derniers épisodes',
      listen:'Écouter', playing:'En cours…', loading:'Chargement…',
      no_results:'Aucun épisode trouvé.', no_episodes:'Aucun épisode disponible.', no_channels:'Aucune chaîne disponible.',
      copied:'Lien copié !',
    },
    he: {
      nav_home:'ראשי', nav_rabbis:'הרבנים ▾', nav_last_classes:'שיעורים אחרונים', nav_daf_hayomi:'דף היומי', nav_parasha:'פרשה', nav_themes:'נושא', nav_all_rabbis:'כל הרבנים →',
      lang_toggle:'Français',
      subtitle:'שיעורי תורה — זמינים בפלטפורמות האהובות עליכם',
      search_ph:'חיפוש פרק או רב…',
      recents:'פרקים אחרונים',
      listen:'האזן', playing:'מתנגן…', loading:'טוען…',
      no_results:'לא נמצאו פרקים.', no_episodes:'אין פרקים זמינים.', no_channels:'אין ערוצים זמינים.',
      copied:'הקישור הועתק!',
    },
  };
  let lang = localStorage.getItem('lang') || 'fr';
  function t(k) { return (I18N[lang]||{})[k] || I18N.fr[k] || k; }
  function applyLang() {
    document.documentElement.lang = lang === 'he' ? 'he' : 'fr';
    document.documentElement.dir  = lang === 'he' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.dataset.i18n;
      if (k.startsWith('|')) el.placeholder = t(k.slice(1));
      else el.textContent = t(k);
    });
  }
  function toggleLang() { localStorage.setItem('lang', lang === 'fr' ? 'he' : 'fr'); location.reload(); }
  function renderStats(nCh, nEp) {
    const el = document.getElementById('header-stats');
    if (!el) return;
    const approxH = Math.round(nEp * 0.75);
    el.textContent = lang === 'he'
      ? `${nCh} ערוצים · ${nEp} שיעורים · ~${approxH} שעות`
      : `${nCh} chaînes · ${nEp} cours · ~${approxH}h de Torah`;
  }
  applyLang();

  document.addEventListener('click', e => {
    if (e.target.closest('.nav-submenu')) return;
    const caret = e.target.closest('.nav-dd-caret');
    document.querySelectorAll('.nav-dropdown.open').forEach(el => {
      if (!caret || el !== caret.closest('.nav-dropdown')) el.classList.remove('open');
    });
    if (caret) caret.closest('.nav-dropdown').classList.toggle('open');
  });

  // ─── Player ───────────────────────────────────────────────────────────────
  const PREVIEW_COUNT = 3;
  const RECENTS_COUNT = 10;

  let allData = [];
  let activeBtn = null, currentEpId = null;
  let currentSpeed = parseFloat(localStorage.getItem('playbackSpeed') || '1');

  const playerEl    = document.getElementById('player');
  const playerAudio = document.getElementById('player-audio');
  const playerTitle = document.getElementById('player-title');
  const playerCh    = document.getElementById('player-channel');
  const playerArt   = document.getElementById('player-art');

  const SPEEDS = [1, 1.25, 1.5, 2];
  const speedCycleBtn = document.getElementById('speed-cycle-btn');
  function updateSpeedBtn() {
    speedCycleBtn.textContent = currentSpeed + '×';
    speedCycleBtn.classList.toggle('active', currentSpeed !== 1);
  }
  updateSpeedBtn();
  speedCycleBtn.addEventListener('click', () => {
    const idx = SPEEDS.indexOf(currentSpeed);
    currentSpeed = SPEEDS[idx === -1 ? 1 : (idx + 1) % SPEEDS.length];
    localStorage.setItem('playbackSpeed', currentSpeed);
    if (playerAudio) playerAudio.playbackRate = currentSpeed;
    updateSpeedBtn();
  });

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.remove('show'), 2000);
  }
  document.addEventListener('click', e => {
    const btn = e.target.closest('.share-btn[data-epfile]');
    if (!btn) return;
    const url = `https://thetorahpodcast.net/${btn.dataset.epfile}`;
    if (navigator.share) navigator.share({ title: btn.dataset.title, url });
    else navigator.clipboard.writeText(url).then(() => showToast(t('copied')));
  });

  function playIcon() {
    return `<svg viewBox="0 0 10 10" fill="currentColor"><polygon points="2,1 9,5 2,9"/></svg>`;
  }
  function pauseIcon() {
    return `<svg viewBox="0 0 10 10" fill="currentColor"><rect x="1.5" y="1" width="2.5" height="8"/><rect x="6" y="1" width="2.5" height="8"/></svg>`;
  }

  function loadInPlayer(ep, chName, slug) {
    currentEpId = ep.video_id;
    playerTitle.textContent = ep.title;
    playerCh.textContent    = chName;
    playerArt.src           = ep.thumbnail || `artwork/${slug}.png`;
    playerAudio.src         = ep.audio_url;
    playerAudio.playbackRate = currentSpeed;
    const saved = parseInt(localStorage.getItem('resume_' + ep.video_id) || '0');
    if (saved > 5) {
      playerAudio.addEventListener('loadedmetadata', () => { playerAudio.currentTime = saved; }, { once: true });
    }
    playerAudio.play();
    playerEl.classList.remove('hidden');
  }

  playerAudio.addEventListener('timeupdate', () => {
    if (currentEpId && playerAudio.currentTime > 5)
      localStorage.setItem('resume_' + currentEpId, Math.floor(playerAudio.currentTime));
  });

  document.addEventListener('click', e => {
    const btn = e.target.closest('.play-btn[data-slug]');
    if (btn) {
      if (btn === activeBtn) {
        if (playerAudio.paused) {
          playerAudio.play();
          btn.classList.add('playing');
          btn.innerHTML = pauseIcon() + ' ' + t('playing');
        } else {
          playerAudio.pause();
          btn.classList.remove('playing');
          btn.innerHTML = playIcon() + ' ' + t('listen');
        }
        return;
      }
      const slug = btn.dataset.slug;
      const idx  = +btn.dataset.idx;
      const d    = allData.find(x => x.ch.slug === slug);
      if (!d) return;
      if (activeBtn && activeBtn !== btn) {
        activeBtn.classList.remove('playing');
        activeBtn.innerHTML = playIcon() + ' Écouter';
      }
      activeBtn = btn;
      btn.classList.add('playing');
      btn.innerHTML = pauseIcon() + ' En cours…';
      loadInPlayer(d.entries[idx], d.ch.name, slug);
    }

    const card = e.target.closest('.recent-card[data-slug]');
    if (card) {
      const slug = card.dataset.slug;
      const idx  = +card.dataset.idx;
      const d    = allData.find(x => x.ch.slug === slug);
      if (d) loadInPlayer(d.entries[idx], d.ch.name, slug);
    }
  });

  document.getElementById('player-close').addEventListener('click', () => {
    playerAudio.pause();
    playerEl.classList.add('hidden');
    currentEpId = null;
    if (activeBtn) {
      activeBtn.classList.remove('playing');
      activeBtn.innerHTML = playIcon() + ' ' + t('listen');
      activeBtn = null;
    }
  });

  playerAudio.addEventListener('ended', () => {
    if (currentEpId) localStorage.removeItem('resume_' + currentEpId);
    currentEpId = null;
    if (activeBtn) {
      activeBtn.classList.remove('playing');
      activeBtn.innerHTML = playIcon() + ' ' + t('listen');
      activeBtn = null;
    }
  });

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function slugify(title, maxLen = 70) {
    return title.toLowerCase().normalize('NFD')
      .replace(/\p{Mn}/gu, '')
      .replace(/[^a-z0-9א-תװ-׻]+/gu, '-')
      .replace(/^-+|-+$/g, '').replace(/-+/g, '-')
      .slice(0, maxLen).replace(/-+$/, '');
  }
  function epUrl(ep, chSlug) {
    var s = slugify(ep.title || '');
    var prefix = chSlug + '-';
    if (s.startsWith(prefix)) s = s.slice(prefix.length) || (ep.video_id || 'episode');
    return `${chSlug}/${s}-${(ep.published || '').slice(0, 10)}.html`;
  }

  function formatDate(iso) {
    const locale = lang === 'he' ? 'he-IL' : 'fr-FR';
    return new Date(iso).toLocaleDateString(locale, { day:'numeric', month:'long', year:'numeric' });
  }

  function shareIcon() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="11" height="11"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>`;
  }
  function renderEpisode(ep, slug, idx) {
    const thumb = ep.thumbnail
      ? `<img class="episode-thumb" src="${escapeHtml(ep.thumbnail)}" alt="" loading="lazy">`
      : `<div class="episode-thumb-ph"></div>`;
    const desc = ep.description
      ? `<p class="episode-desc">${escapeHtml(ep.description)}</p>`
      : '';
    const playBtn = ep.audio_url
      ? `<button class="play-btn" data-slug="${escapeHtml(slug)}" data-idx="${idx}">${playIcon()} ${t('listen')}</button>`
      : '';
    const shareBtn = ep.title && ep.published
      ? `<button class="share-btn" data-epfile="${epUrl(ep, slug)}" data-title="${escapeHtml(ep.title)}">${shareIcon()} Partager</button>`
      : '';
    return `
      <li class="episode" data-title="${escapeHtml((ep.title + ' ' + (ep.tags || []).join(' ')).toLowerCase())}">
        ${thumb}
        <div class="episode-body">
          <a class="episode-title" href="${epUrl(ep, slug)}">${escapeHtml(ep.title)}</a>
          <div class="episode-date">${formatDate(ep.published)}</div>
          ${desc}
          <div class="ep-btn-row">${playBtn}${shareBtn}</div>
        </div>
      </li>`;
  }

  function buildRecents() {
    const flat = [];
    for (const { ch, entries } of allData) {
      entries.forEach((ep, idx) => flat.push({ ep, ch, idx }));
    }
    flat.sort((a, b) => new Date(b.ep.published) - new Date(a.ep.published));

    const cards = flat.slice(0, RECENTS_COUNT).map(({ ep, ch, idx }) => `
      <div class="recent-card" data-slug="${escapeHtml(ch.slug)}" data-idx="${idx}">
        <img src="${escapeHtml(ep.thumbnail || `artwork/${ch.slug}.png`)}" alt=""
             loading="lazy" onerror="this.src='artwork/${escapeHtml(ch.slug)}.png'">
        <div class="recent-card-body">
          <div class="recent-card-ch">${escapeHtml(ch.name)}</div>
          <div class="recent-card-title">${escapeHtml(ep.title)}</div>
          <div class="recent-card-date">${formatDate(ep.published)}</div>
        </div>
      </div>`).join('');

    const wrap = document.createElement('div');
    wrap.id = 'recents-section';
    wrap.innerHTML = `<div class="section-label">${t('recents')}</div><div class="recents-row">${cards}</div>`;
    return wrap;
  }

  const PLAT_SVG = {
    spotify: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>`,
    apple:   `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm0 4.3a7.7 7.7 0 0 1 5.44 13.14c-.37.37-.79.69-1.25.94-.1-.76-.28-1.63-.58-2.35.52-.48.87-1.15.87-1.9 0-1.43-1.16-2.59-2.59-2.59s-2.59 1.16-2.59 2.59c0 .75.32 1.42.83 1.9-.3.72-.48 1.59-.58 2.35a7.68 7.68 0 0 1-1.25-.94A7.7 7.7 0 0 1 12 4.3zm0 2.1a5.6 5.6 0 0 0-3.96 9.56c.18-.83.46-1.74.9-2.45a4.15 4.15 0 0 1-.54-2.03A3.6 3.6 0 0 1 12 7.9a3.6 3.6 0 0 1 3.6 3.58 4.15 4.15 0 0 1-.54 2.03c.44.71.72 1.62.9 2.45A5.6 5.6 0 0 0 12 6.4zm0 3.1a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm0 5.6c1.05 0 1.82.28 2.3.55-.26 1.18-.38 2.28-.32 3.03a7.65 7.65 0 0 1-1.98.26 7.65 7.65 0 0 1-1.98-.26c.06-.75-.06-1.85-.32-3.03.48-.27 1.25-.55 2.3-.55z"/></svg>`,
    deezer:  `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.944 17.369h4.512v1.601h-4.512zm0-3.075h4.512v1.6h-4.512zm0-3.074h4.512v1.601h-4.512zm-5.944 6.15h4.512v1.6H13zm0-3.075h4.512v1.6H13zm0-3.074h4.512v1.601H13zm-5.944 6.149h4.512v1.6H7.056zm0-3.075h4.512v1.6H7.056zM1.112 17.37h4.512v1.6H1.112z"/></svg>`,
  };

  function buildChannel(ch, entries) {
    const section = document.createElement('section');
    section.className = 'channel';
    section.id = ch.slug;
    section.dataset.name = ch.name.toLowerCase();
    const platHtml = Object.entries(ch.platforms || {})
      .filter(([k, url]) => url && PLAT_SVG[k])
      .map(([k, url]) => `<a class="ch-plat-btn ch-plat-${k}" href="${escapeHtml(url)}" target="_blank" rel="noopener" title="${k.charAt(0).toUpperCase()+k.slice(1)}">${PLAT_SVG[k]}</a>`)
      .join('');

    section.innerHTML = `
      <div class="channel-header">
        <div class="channel-header-left">
          <img class="channel-art" src="artwork/${escapeHtml(ch.slug)}.png" alt=""
               onerror="this.style.display='none'">
          <h2><a href="${escapeHtml(ch.slug)}.html" style="color:inherit;text-decoration:none">${escapeHtml(ch.name)}</a></h2>
        </div>
        <div class="channel-platforms">
          ${platHtml}
          <a class="rss-link" href="feeds/${escapeHtml(ch.slug)}.xml" target="_blank">RSS</a>
        </div>
      </div>`;

    if (!entries.length) {
      section.insertAdjacentHTML('beforeend', `<div class="state">${t('no_episodes')}</div>`);
      return section;
    }

    const ul = document.createElement('ul');
    ul.className = 'episode-list';
    ul.innerHTML = entries.map((ep, i) => renderEpisode(ep, ch.slug, i)).join('');
    section.appendChild(ul);

    const items = ul.querySelectorAll('.episode');
    items.forEach((el, i) => { if (i >= PREVIEW_COUNT) el.hidden = true; });

    if (entries.length > PREVIEW_COUNT) {
      const bar = document.createElement('div');
      bar.className = 'show-more-bar';
      const btn = document.createElement('button');
      btn.className = 'show-more-btn';
      const n = entries.length - PREVIEW_COUNT;
      btn.textContent = lang === 'he' ? `עוד ${n} פרקים` : `Voir les ${n} épisodes suivants`;
      btn.addEventListener('click', () => { items.forEach(el => el.hidden = false); bar.remove(); });
      bar.appendChild(btn);
      section.appendChild(bar);
    }
    return section;
  }

  function setupSearch() {
    const input    = document.getElementById('search');
    const recents  = document.getElementById('recents-section');
    const noRes    = document.getElementById('no-results');

    input.addEventListener('input', () => {
      const q = input.value.toLowerCase().trim();
      recents.hidden = q.length > 0;

      let anyVisible = false;
      document.querySelectorAll('.channel').forEach(ch => {
        const eps = ch.querySelectorAll('.episode');
        const chMatch = ch.dataset.name && ch.dataset.name.includes(q);
        let chVisible = false;
        eps.forEach((ep, i) => {
          const match = !q || chMatch || ep.dataset.title.includes(q);
          ep.hidden = q ? !match : i >= PREVIEW_COUNT;
          if (match) chVisible = true;
        });
        if (!q) {
          const bar = ch.querySelector('.show-more-bar');
          if (bar) bar.style.display = '';
          ch.hidden = false;
        } else {
          const bar = ch.querySelector('.show-more-bar');
          if (bar) bar.style.display = 'none';
          ch.hidden = !chVisible;
          if (chVisible) anyVisible = true;
        }
      });

      noRes.hidden = !q || anyVisible;
    });
  }

  (async () => {
    const app = document.getElementById('app');
    let channels = [];
    try {
      const res = await fetch('channels.json');
      if (res.ok) {
        channels = (await res.json())
          .filter(ch => ch.enabled)
          .map(ch => ({ slug: ch.slug, name: ch.podcast_author, platforms: ch.platforms || {} }));
      }
    } catch (_) {}

    if (!channels.length) {
      app.innerHTML = `<p class="state">${t('no_channels')}</p>`;
      return;
    }

    allData = await Promise.all(channels.map(async ch => {
      try {
        const r = await fetch(`feeds/${ch.slug}.entries.json`);
        const entries = r.ok ? await r.json() : [];
        entries.sort((a, b) => new Date(b.published) - new Date(a.published));
        return { ch, entries };
      } catch (_) { return { ch, entries: [] }; }
    }));

    const totalEp = allData.reduce((s, {entries}) => s + entries.length, 0);
    renderStats(allData.length, totalEp);

    const sub = document.getElementById('nav-rabbis-submenu');
    if (sub) sub.innerHTML = channels.map(ch =>
      `<a href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.name)}</a>`
    ).join('');

    app.innerHTML = '';
    app.appendChild(buildRecents());

    const noRes = document.createElement('div');
    noRes.id = 'no-results';
    noRes.className = 'no-results';
    noRes.hidden = true;
    noRes.textContent = t('no_results');
    app.appendChild(noRes);

    for (const { ch, entries } of allData) {
      app.appendChild(buildChannel(ch, entries));
    }

    setupSearch();

    if (location.hash) {
      const el = document.querySelector(location.hash);
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }
  })();
</script>

<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
