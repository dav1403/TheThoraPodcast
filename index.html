<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcast RSS Feeds</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #222; }
    h1 { font-size: 1.4rem; }
    .feed { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .feed h2 { margin: 0 0 6px; font-size: 1rem; }
    .feed a { font-size: 0.85rem; word-break: break-all; color: #1a73e8; }
    .label { font-size: 0.75rem; color: #666; text-transform: uppercase; margin-bottom: 2px; }
  </style>
</head>
<body>
  <h1>Podcast RSS Feeds</h1>
  <p>These feeds are auto-generated from YouTube channels and can be submitted to Spotify for Podcasters.</p>

  <!-- Add a .feed block for each channel you add to channels.json -->

  <div class="feed">
    <h2>The Thora Podcast</h2>
    <div class="label">RSS Feed URL</div>
    <a href="feeds/the-thora-podcast.xml">feeds/the-thora-podcast.xml</a>
  </div>

  <!-- Template for additional channels:
  <div class="feed">
    <h2>CHANNEL NAME HERE</h2>
    <div class="label">RSS Feed URL</div>
    <a href="feeds/SLUG-HERE.xml">feeds/SLUG-HERE.xml</a>
  </div>
  -->

</body>
</html>
