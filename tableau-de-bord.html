    }

      color-scheme: dark;

      --shadow-card-soft: rgba(0,0,0,.3);

      --color-border-cream: #3a3452;

      --color-surface-muted-hover: #303056;

      --color-mark-bg: rgba(232,119,34,.22);
      --color-mark-text: #ffc79a;
      --color-primary: #3d3d6e;
      --color-primary-hover: #4c4c82;
      --color-border-card: #34345a;
      --color-border-warm: #34345a;
      --color-border-sand: #3a3452;
      --color-divider-soft: #26264a;
      --color-divider-warm: #26264a;
      --color-divider-alt: #2c2c4e;
      --color-surface-warm-hover: #252545;
      --color-surface-cool-hover: #252545;
      --color-surface-cool-hover-alt: #252545;
      --color-surface-accent-soft: #2e2236;
      --color-primary-tint: rgba(255,255,255,.06);
      --color-primary-tint-strong: rgba(255,255,255,.12);
      --color-text-gold: #dcbc7c;
      --color-text-sand: #e6dcc6;
      --color-text-pale: #8c8caa;
    }
    :root { --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #77756f; --grid: #e6e5e0;
            --s1: #3a6ea5; --s2: #c98b2b; --good: #1f7a4d; --warn: #a86a00; --bad: #b42318; }
    [data-theme="dark"] { --surface: #1a1a2e; --ink: #f6f6fa; --ink-2: #c8c8da; --muted: #b4b4cc; --grid: #34345a;
            --s1: #6f9fd6; --s2: #e0a84a; --good: #4cc38a; --warn: #e0a040; --bad: #f07a6e; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--color-bg); color: var(--ink); line-height: 1.5; padding-bottom: 60px; }
    header { background: var(--color-inverse-bg); color: var(--color-on-inverse); padding: 22px 20px 18px; }
    header .in { max-width: 1180px; margin: 0 auto; }
    header h1 { font-size: 1.5rem; }
    header p { color: var(--color-inverse-heading); font-size: .9rem; }
    header a { color: var(--color-inverse-heading); }
    main { max-width: 1180px; margin: 0 auto; padding: 18px 16px; }
    .card { background: var(--surface); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; box-shadow: 0 1px 3px var(--shadow-card-soft); }
    .card h2 { font-size: 1.05rem; margin-bottom: 10px; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; }
    .grid2 > .card { margin-bottom: 0; }
    .grid2 + .card, .card + .grid2 { margin-top: 16px; }
    .muted { color: var(--muted); font-size: .85rem; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
    .tile { background: var(--surface); border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 3px var(--shadow-card-soft); }
    .tile .l { font-size: .85rem; font-weight: 600; color: var(--ink-2); }
    .tile .v { font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tile .s { font-size: .8rem; color: var(--muted); }
    .tile.off .v { color: var(--color-text-disabled); font-size: 1.05rem; font-weight: 600; padding: 8px 0; }
    .up { color: var(--good); } .down { color: var(--bad); }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th, td { text-align: start; padding: 6px 6px; border-bottom: 1px solid var(--color-surface-alt); vertical-align: top; }
    th { font-size: .78rem; color: var(--ink-2); font-weight: 600; }
    th[data-k] { cursor: pointer; user-select: none; }
    th[data-k]:hover { color: var(--ink); }
    td.n, th.n { text-align: end; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .tag { display: inline-block; font-size: .7rem; border: 1px solid var(--color-border-strong); border-radius: 8px; padding: 0 6px; color: var(--ink-2); margin-inline-start: 6px; vertical-align: 1px; }
    .st { white-space: nowrap; font-weight: 600; }
    .st.ok { color: var(--good); } .st.ko { color: var(--bad); } .st.wn { color: var(--warn); } .st.na { color: var(--muted); }
    .chart-wrap { position: relative; }
    svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
    .legend { display: flex; gap: 16px; font-size: .82rem; margin-top: 6px; flex-wrap: wrap; color: var(--ink-2); }
    .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-inline-end: 6px; vertical-align: 3px; }
    .tip { position: absolute; pointer-events: none; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; padding: 6px 9px; font-size: .8rem; box-shadow: 0 2px 8px rgba(0,0,0,.12); white-space: nowrap; display: none; z-index: 2; }
    .tip b { font-variant-numeric: tabular-nums; }
    .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 5px; }
    details summary { cursor: pointer; font-size: .82rem; color: var(--ink-2); margin-top: 8px; }
    details table { margin-top: 6px; }
    .scroll { max-height: 520px; overflow: auto; }
    .msg { text-align: center; padding: 40px 20px; }

<body>
<header><div class="in">
  <h1>Tableau de bord — The Torah Podcast</h1>
  <p id="h-sub">Audience et santé du pipeline — privé — <a href="/">thetorahpodcast.net</a></p>
</div></header>
<main id="app"><div class="card msg">Chargement…</div></main>
<script>
(function () {
  'use strict';
  var NS = 'ttp-espace-rav/v1/';
  var MSG = {
    nokey: 'Lien incomplet : utilisez le lien privé du tableau de bord (python scripts/stats_update.py dashboard-link).',
    notfound: "Aucun tableau de bord pour ce lien (lien erroné, clé changée, ou pas encore déployé).",
    broken: "Le tableau de bord n'a pas pu être ouvert. Vérifiez que le lien est complet.",
    unsupported: 'Navigateur trop ancien pour ouvrir ce rapport chiffré.'
  };
  var C = {site: 'var(--s1)', direct: 'var(--s2)'};
  var LBL = {site: 'Écoutes site', direct: 'Téléchargements audio'};

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
    });
  }
  function fmt(n) { return Number(n || 0).toLocaleString('fr-FR'); }
  function fdate(iso, opt) {
    if (!iso) return '—';
    var d = new Date(iso.length <= 10 ? iso + 'T12:00:00Z' : iso);
    return d.toLocaleDateString('fr-FR', opt || {day: 'numeric', month: 'short', year: 'numeric'});
  }
  function fdt(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('fr-FR', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
  }
  function ago(iso) {
    if (!iso) return '';
    var h = (Date.now() - new Date(iso).getTime()) / 3.6e6;
    if (h < 1) return 'il y a ' + Math.max(1, Math.round(h * 60)) + ' min';
    if (h < 48) return 'il y a ' + Math.round(h) + ' h';
    return 'il y a ' + Math.round(h / 24) + ' j';
  }
  function daysSince(iso) {
    return iso ? Math.floor((Date.now() - new Date(iso + 'T12:00:00Z').getTime()) / 864e5) : null;
  }
  function tokenFromHash() {
    var m = /(?:^#|&)k=([A-Za-z0-9_-]{16,64})/.exec(location.hash || '');
    return m ? m[1] : null;
  }
  function hex(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }
  function sha256(str) { return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); }

  // Mirrors stats_core.blob_id / blob_key / encrypt (nonce(12) || ciphertext+tag).
  function openReport(token, bytes) {
    return sha256(NS + 'key/' + token).then(function (raw) {
      return crypto.subtle.importKey('raw', raw, {name: 'AES-GCM'}, false, ['decrypt']);
    }).then(function (key) {
      var b = new Uint8Array(bytes);
      return crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(0, 12)}, key, b.slice(12));
    }).then(function (plain) { return JSON.parse(new TextDecoder().decode(plain)); });
  }
  window.TTPDashboard = {openReport: openReport, blobId: function (token) {
    return sha256(NS + 'id/' + token).then(function (h) { return hex(h).slice(0, 32); });
  }};

  // ------------------------------------------------------------------ parts

  function delta(cur, prev) {
    if (!prev) return '';
    var p = Math.round((cur - prev) / prev * 100);
    var cls = p > 0 ? 'up' : p < 0 ? 'down' : '';
    return ' · <span class="' + cls + '">' + (p > 0 ? '▲ +' : p < 0 ? '▼ ' : '') + p + ' %</span> vs 30 j préc.';
  }
  function tile(label, value, sub, on, offText, hint) {
    return '<div class="tile' + (on === false ? ' off' : '') + '"' + (hint ? ' title="' + esc(hint) + '"' : '') + '><div class="l">' + esc(label) + '</div>' +
      '<div class="v">' + (on === false ? esc(offText || 'source inactive') : fmt(value)) + '</div><div class="s">' + (sub || '') + '</div></div>';
  }
  // Courses still to integrate: same figure as scripts/ci_ingest_watchdog.py (scripts/backlog.py).
  var BACKLOG_HINT = 'Par chaîne : vidéos YouTube (vidéos + lives + shorts, au dernier scan) moins les cours du flux, ' +
    '+ file d’attente du rattrapage. Même calcul que l’alerte « Ingestion à zéro ». Majorant : une vidéo en file est aussi dans l’écart, donc comptée deux fois.';
  function backlogTile(b, ravs) {
    if (!b || !b.available) return tile('Cours restant à intégrer', 0, 'état du rattrapage illisible', false, 'indisponible', BACKLOG_HINT);
    var sub = 'aucune chaîne en retard';
    if (b.channels) {
      var top = b.top && (ravs || []).filter(function (x) { return x.slug === b.top.slug; })[0];
      sub = fmt(b.channels) + (b.channels > 1 ? ' chaînes' : ' chaîne') +
        (b.top ? ' · surtout ' + esc(top ? top.name : b.top.slug) + ' (' + fmt(b.top.n) + ')' : '');
    }
    return tile('Cours restant à intégrer', b.total, sub, true, '', BACKLOG_HINT);
  }

  // Daily lines (one axis: both measures are plays) + crosshair tooltip.
  function lineChart(id, series) {
    var W = 1100, H = 260, L = 44, R = 8, T = 10, B = 26, n = series.length;
    var max = 1;
    series.forEach(function (d) { max = Math.max(max, d.site, d.direct); });
    var step = Math.pow(10, Math.floor(Math.log10(max)));
    var nice = Math.ceil(max / step) * step; if (nice / step > 6) step *= 2;
    var x = function (i) { return L + (W - L - R) * (n <= 1 ? 0 : i / (n - 1)); };
    var y = function (v) { return T + (H - T - B) * (1 - v / nice); };
    var g = '';
    for (var v = 0; v <= nice; v += step) {
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" stroke="var(--grid)" stroke-width="1"/>' +
        '<text x="' + (L - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" font-size="11" fill="var(--muted)" text-anchor="end">' + fmt(v) + '</text>';
    }
    series.forEach(function (d, i) {
      if (d.day.slice(8) === '01') g += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" font-size="11" fill="var(--muted)" text-anchor="middle">' + esc(fdate(d.day, {month: 'short'})) + '</text>';
    });
    ['direct', 'site'].forEach(function (k) {
      var p = series.map(function (d, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(d[k]).toFixed(1); }).join('');
      g += '<path d="' + p + '" fill="none" stroke="' + C[k] + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    });
    g += '<line class="xh" y1="' + T + '" y2="' + (H - B) + '" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>' +
      '<circle class="dot-site" r="4" fill="' + C.site + '" stroke="var(--color-surface)" stroke-width="2" style="display:none"/>' +
      '<circle class="dot-direct" r="4" fill="' + C.direct + '" stroke="var(--color-surface)" stroke-width="2" style="display:none"/>' +
      '<rect class="hit" x="' + L + '" y="0" width="' + (W - L - R) + '" height="' + (H - B) + '" fill="transparent"/>';
    var html = '<div class="chart-wrap" id="' + id + '"><svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Écoutes par jour">' + g + '</svg><div class="tip"></div></div>' +
      '<div class="legend"><span><i style="background:' + C.site + '"></i>' + LBL.site + '</span><span><i style="background:' + C.direct + '"></i>' + LBL.direct + '</span></div>';
    return {html: html, bind: function () {
      var wrap = document.getElementById(id); if (!wrap) return;
      var svg = wrap.querySelector('svg'), tip = wrap.querySelector('.tip');
      var xh = svg.querySelector('.xh'), ds = svg.querySelector('.dot-site'), dd = svg.querySelector('.dot-direct');
      function hide() { tip.style.display = xh.style.display = ds.style.display = dd.style.display = 'none'; }
      svg.querySelector('.hit').addEventListener('mousemove', function (ev) {
        var r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) * W / r.width;
        var i = Math.max(0, Math.min(n - 1, Math.round((sx - L) / ((W - L - R) / Math.max(1, n - 1)))));
        var d = series[i], px = x(i);
        xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.style.display = '';
        ds.setAttribute('cx', px); ds.setAttribute('cy', y(d.site)); ds.style.display = '';
        dd.setAttribute('cx', px); dd.setAttribute('cy', y(d.direct)); dd.style.display = '';
        tip.innerHTML = '<div>' + esc(fdate(d.day, {weekday: 'short', day: 'numeric', month: 'short'})) + '</div>' +
          '<div><i style="background:' + C.site + '"></i>' + LBL.site + ' <b>' + fmt(d.site) + '</b> <span class="muted">(' + fmt(d.complete) + ' jusqu’au bout)</span></div>' +
          '<div><i style="background:' + C.direct + '"></i>' + LBL.direct + ' <b>' + fmt(d.direct) + '</b></div>';
        tip.style.display = 'block';
        var left = px * r.width / W + 12;
        if (left + tip.offsetWidth > r.width) left = px * r.width / W - tip.offsetWidth - 12;
        tip.style.left = left + 'px'; tip.style.top = '8px';
      });
      svg.querySelector('.hit').addEventListener('mouseleave', hide);
    }};
  }

  function barChart(rows) {
    var W = 520, H = 180, L = 30, B = 22, T = 14, n = rows.length || 1, max = 1;
    rows.forEach(function (r) { max = Math.max(max, r.n); });
    var slot = (W - L) / n, bw = Math.max(4, slot - 4), g = '';
    g += '<line x1="' + L + '" x2="' + W + '" y1="' + (H - B) + '" y2="' + (H - B) + '" stroke="var(--grid)"/>';
    rows.forEach(function (r, i) {
      var h = (H - T - B) * r.n / max, x0 = L + i * slot + 2, y0 = H - B - h;
      g += '<g><title>Semaine du ' + esc(fdate(r.start)) + ' : ' + fmt(r.n) + ' cours</title>' +
        '<path d="M' + x0 + ' ' + (H - B) + 'V' + (y0 + Math.min(4, h)) + 'q0 -' + Math.min(4, h) + ' ' + Math.min(4, h) + ' -' + Math.min(4, h) + 'H' + (x0 + bw - Math.min(4, h)) + 'q' + Math.min(4, h) + ' 0 ' + Math.min(4, h) + ' ' + Math.min(4, h) + 'V' + (H - B) + 'Z" fill="' + C.site + '"/>' +
        '<rect x="' + x0 + '" y="' + T + '" width="' + bw + '" height="' + (H - B - T) + '" fill="transparent"/></g>';
      if (i === n - 1 || i === 0) g += '<text x="' + (x0 + bw / 2) + '" y="' + (y0 - 4) + '" font-size="11" fill="var(--ink-2)" text-anchor="middle">' + fmt(r.n) + '</text>';
      if (i % 3 === 0) g += '<text x="' + x0 + '" y="' + (H - 6) + '" font-size="10" fill="var(--muted)">' + esc(fdate(r.start, {day: 'numeric', month: 'short'})) + '</text>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Nouveaux cours par semaine">' + g + '</svg>';
  }

  function status(wf) {
    var l = wf.last;
    if (!l) return '<span class="st na">— aucun run</span>';
    if (l.status !== 'completed') return '<span class="st wn">⟳ en cours</span>';
    if (l.conclusion === 'success') return '<span class="st ok">✓ succès</span>';
    if (l.conclusion === 'skipped' || l.conclusion === 'cancelled') return '<span class="st na">○ ' + esc(l.conclusion === 'skipped' ? 'ignoré' : 'annulé') + '</span>';
    return '<span class="st ko">✗ échec</span>';
  }

  function healthCard(h, live) {
    var html = '<div class="card"><h2>Santé du pipeline</h2>';
    var dep = live || (h && h.deploy) || null;
    if (dep && dep.built_at) {
      var age = (Date.now() - new Date(dep.built_at).getTime()) / 3.6e6;
      var cls = age < 12 ? 'ok' : age < 36 ? 'wn' : 'ko';
      html += '<p style="margin-bottom:10px">Site en ligne construit le <b>' + esc(fdt(dep.built_at)) + '</b> <span class="st ' + cls + '">' +
        (cls === 'ok' ? '✓' : cls === 'wn' ? '⚠' : '✗') + ' ' + esc(ago(dep.built_at)) + '</span>' +
        (dep.files ? ' · ' + fmt(dep.files) + ' fichiers' : '') + (dep.state_generation ? ' · génération d’état ' + fmt(dep.state_generation) : '') +
        (live ? ' <span class="muted">(lu en direct)</span>' : '') + '</p>';
    }
    if (!h || !h.available) return html + '<p class="muted">Instantané des workflows indisponible (GITHUB_TOKEN absent au dernier calcul).</p></div>';
    html += '<table><thead><tr><th>Workflow</th><th>Dernier run</th><th></th><th>Dernier succès</th><th class="n">Runs ' + h.days + ' j</th><th class="n">Échecs</th><th class="n">Plus grand trou (planifiés)</th></tr></thead><tbody>';
    h.workflows.forEach(function (w) {
      var gap = w.max_gap_h == null ? '—' : fmt(w.max_gap_h) + ' h';
      html += '<tr><td>' + esc(w.label) + '</td><td>' + (w.last && w.last.url ? '<a href="' + esc(w.last.url) + '" target="_blank" rel="noopener">' + esc(fdt(w.last.at)) + '</a>' : '—') + '</td><td>' + status(w) + '</td>' +
        '<td>' + esc(w.last_success ? ago(w.last_success) : '—') + '</td><td class="n">' + fmt(w.runs) + '</td>' +
        '<td class="n">' + (w.failure ? '<span class="st ko">' + fmt(w.failure) + '</span>' : '0') + '</td><td class="n">' + gap + '</td></tr>';
    });
    return html + '</tbody></table><p class="muted" style="margin-top:6px">Instantané des workflows : ' + esc(fdt(h.at)) + ' (' + esc(ago(h.at)) + '), rafraîchi 4×/jour, visible au déploiement suivant.</p></div>';
  }

  var ravSort = {k: 'd30', dir: -1};
  function ravRows(ravs) {
    var val = {
      name: function (r) { return r.name.toLowerCase(); }, episodes: function (r) { return r.episodes; },
      last: function (r) { return r.last || ''; }, d30: function (r) { return r.d30.site + r.d30.direct; },
      site: function (r) { return r.d30.site; }, direct: function (r) { return r.d30.direct; },
      all: function (r) { return r.all.site + r.all.direct; }
    }[ravSort.k];
    return ravs.slice().sort(function (a, b) {
      var x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * ravSort.dir;
    }).map(function (r) {
      var ds = daysSince(r.last);
      return '<tr><td>' + esc(r.name) + (r.kind === 'guest' ? '<span class="tag">invité</span>' : '') + '<span class="tag">' + esc(r.lang.toUpperCase()) + '</span></td>' +
        '<td class="n">' + fmt(r.episodes) + '</td><td class="n">' + esc(fdate(r.last)) + (ds != null ? '<div class="muted">' + ds + ' j</div>' : '') + '</td>' +
        '<td class="n">' + fmt(r.d30.site) + '</td><td class="n">' + fmt(r.d30.direct) + '</td><td class="n"><b>' + fmt(r.d30.site + r.d30.direct) + '</b></td>' +
        '<td class="n">' + fmt(r.all.site + r.all.direct) + '</td></tr>';
    }).join('');
  }

  function render(r, live) {
    var t = r.totals, s = r.sources, c = r.catalogue;
    var siteOn = s.site_page.active, dirOn = s.direct.active;
    var html = '<p class="muted" style="margin-bottom:12px">Audience jusqu’au <b>' + esc(fdate(r.until)) + '</b> (dernier jour complet) · calculé le ' + esc(fdate(r.generated)) + '</p>';

    html += '<div class="tiles" style="margin-bottom:16px">' +
      tile('Écoutes site — 30 j', t.d30.site, fmt(t.d30.complete) + ' jusqu’au bout' + delta(t.d30.site, t.prev30.site), siteOn) +
      tile('Téléchargements — 30 j', t.d30.direct, 'apps de podcast + lecteur' + delta(t.d30.direct, t.prev30.direct), dirOn) +
      tile('7 derniers jours', t.d7.site + t.d7.direct, fmt(t.d7.site) + ' site · ' + fmt(t.d7.direct) + ' téléch.', siteOn || dirOn) +
      tile('Cours au catalogue', c.episodes, '+' + fmt(c.new_d7) + ' en 7 j · +' + fmt(c.new_d30) + ' en 30 j') +
      backlogTile(r.backlog, r.ravs) +
      tile('Rabbanim', c.channels + c.guests, fmt(c.channels) + ' chaînes · ' + fmt(c.guests) + ' invités') +
      tile('Spotify / Deezer / Apple', r.platforms.plays, r.platforms.rows ? fmt(r.platforms.rows) + ' relevé(s) manuel(s)' : 'aucun relevé saisi', r.platforms.rows > 0) +
      '</div>';

    var lc = lineChart('daily', r.series || []);
    html += '<div class="card"><h2>Écoutes par jour — ' + (r.series || []).length + ' derniers jours</h2>' + lc.html +
      '<details><summary>Voir en tableau</summary><div class="scroll"><table><thead><tr><th>Jour</th><th class="n">' + LBL.site + '</th><th class="n">Jusqu’au bout</th><th class="n">' + LBL.direct + '</th></tr></thead><tbody>' +
      (r.series || []).slice().reverse().map(function (d) { return '<tr><td>' + esc(fdate(d.day)) + '</td><td class="n">' + fmt(d.site) + '</td><td class="n">' + fmt(d.complete) + '</td><td class="n">' + fmt(d.direct) + '</td></tr>'; }).join('') +
      '</tbody></table></div></details>' +
      '<p class="muted" style="margin-top:8px">Les téléchargements incluent le lecteur du site : ne pas additionner les deux courbes pour compter des auditeurs. Spotify et Deezer hébergent leur copie de l’audio et n’apparaissent que dans les relevés manuels.' +
      (r.direct_unmatched ? ' ' + fmt(r.direct_unmatched) + ' téléchargements portent sur des fichiers absents du catalogue actuel.' : '') + '</p></div>';

    html += healthCard(r.health, live);

    html += '<div class="grid2"><div class="card"><h2>Nouveaux cours par semaine</h2>' + barChart(c.new_weekly || []) +
      '<p class="muted">Date de publication YouTube, 12 dernières semaines.</p></div>';
    var langs = Object.keys(r.by_lang || {});
    html += '<div class="card"><h2>Par langue — 30 j</h2><table><thead><tr><th>Langue</th><th class="n">Chaînes</th><th class="n">Cours</th><th class="n">Site</th><th class="n">Téléch.</th></tr></thead><tbody>' +
      langs.map(function (k) { var b = r.by_lang[k]; return '<tr><td>' + esc(k.toUpperCase()) + '</td><td class="n">' + fmt(b.ravs) + '</td><td class="n">' + fmt(b.episodes) + '</td><td class="n">' + fmt(b.site) + '</td><td class="n">' + fmt(b.direct) + '</td></tr>'; }).join('') +
      '</tbody></table>';
    if ((c.quiet || []).length) {
      html += '<h2 style="margin-top:16px">Chaînes sans nouveau cours depuis 30 j</h2><table><tbody>' +
        c.quiet.map(function (q) { return '<tr><td>' + esc(q.name) + '</td><td class="n">' + esc(fdate(q.last)) + ' <span class="muted">(' + daysSince(q.last) + ' j)</span></td></tr>'; }).join('') + '</tbody></table>';
    }
    html += '<h2 style="margin-top:16px">Sources</h2><div class="src">' +
      [['site_page', 'GA4 (site)'], ['site_ep', 'GA4 par cours'], ['direct', 'Cloudflare R2']].map(function (p) {
        var m = s[p[0]]; return '<span>' + (m.active ? '<span class="st ok">✓</span> ' : '<span class="st na">○</span> ') + esc(p[1]) + (m.active ? ' <span class="muted">' + esc(fdate(m.since)) + ' → ' + esc(fdate(m.last)) + '</span>' : ' <span class="muted">inactive</span>') + '</span>';
      }).join('') + '</div></div></div>';

    html += '<div class="card" style="margin-top:16px"><h2>Par rav</h2><div class="scroll"><table id="ravs"><thead><tr>' +
      [['name', 'Rav', ''], ['episodes', 'Cours', 'n'], ['last', 'Dernier cours', 'n'], ['site', 'Site 30 j', 'n'], ['direct', 'Téléch. 30 j', 'n'], ['d30', 'Total 30 j', 'n'], ['all', 'Depuis le début', 'n']].map(function (h) {
        return '<th data-k="' + h[0] + '" class="' + h[2] + '">' + h[1] + (ravSort.k === h[0] ? (ravSort.dir < 0 ? ' ▾' : ' ▴') : '') + '</th>';
      }).join('') + '</tr></thead><tbody>' + ravRows(r.ravs || []) + '</tbody></table></div>' +
      '<p class="muted" style="margin-top:6px">Un cours d’invité compte aussi pour la chaîne qui l’héberge : la colonne n’est pas additionnable.</p></div>';

    if ((r.courses || []).length) {
      html += '<div class="card"><h2>Cours les plus écoutés — depuis le début de la mesure</h2><div class="scroll"><table><thead><tr><th>Cours</th><th>Rav</th><th class="n">Site</th><th class="n">Jusqu’au bout</th><th class="n">Téléch.</th></tr></thead><tbody>' +
        r.courses.map(function (x) {
          return '<tr><td>' + esc(x.title) + '<div class="muted">' + esc(fdate(x.published)) + '</div></td><td>' + esc(x.rav) + '</td><td class="n">' + fmt(x.site) + '</td><td class="n">' + fmt(x.complete) + '</td><td class="n">' + fmt(x.direct) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }

    var app = document.getElementById('app');
    app.innerHTML = html;
    lc.bind();
    Array.prototype.forEach.call(app.querySelectorAll('#ravs th[data-k]'), function (th) {
      th.addEventListener('click', function () {
        var k = th.getAttribute('data-k');
        ravSort = {k: k, dir: ravSort.k === k ? -ravSort.dir : (k === 'name' ? 1 : -1)};
        render(r, live);
      });
    });
  }

  function fail(key) { document.getElementById('app').innerHTML = '<div class="card msg">' + esc(MSG[key]) + '</div>'; }

  function start() {
    var token = tokenFromHash();
    if (!token) return fail('nokey');
    if (!window.crypto || !crypto.subtle || !window.TextEncoder) return fail('unsupported');
    var live = fetch('/_deploy.json', {cache: 'no-cache'}).then(function (res) { return res.ok ? res.json() : null; }).catch(function () { return null; });
    window.TTPDashboard.blobId(token).then(function (id) {
      return fetch('/espace-rav/d/' + id + '.bin', {cache: 'no-cache'});
    }).then(function (res) {
      if (res.status === 404) throw new Error('notfound');
      if (!res.ok) throw new Error('broken');
      return res.arrayBuffer();
    }).then(function (buf) { return openReport(token, buf); }).then(function (r) {
      if (r.kind !== 'dashboard') throw new Error('broken');
      return live.then(function (dep) { render(r, dep); });
    }).catch(function (e) { fail(e && e.message === 'notfound' ? 'notfound' : 'broken'); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
</body>
</html>
