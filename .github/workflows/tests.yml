name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test deps
        # The generator suite is stdlib-only; yt-dlp is the single runtime import
        # the pre-existing test_youtube_discovery.py needs (its other deps are
        # stubbed inside the test). Keeps CI fast — no Pillow/boto3/anthropic.
        run: |
          python -m pip install --upgrade pip
          pip install pytest "yt-dlp>=2025.1.0"

      - name: Run tests
        run: python -m pytest tests/ -q
