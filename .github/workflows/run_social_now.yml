name: Run Social Post Now (temp)
on:
  workflow_dispatch:
env:
  PYTHONIOENCODING: utf-8
permissions:
  contents: write
  issues: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run social post rabbi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_ID:        ${{ secrets.META_PAGE_ID }}
          FB_ACCESS_TOKEN:   ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          IG_USER_ID:        ${{ secrets.META_IG_ACCOUNT_ID }}
          MAKE_WEBHOOK_URL:  ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python scripts/social_post.py --type rabbi
      - name: Alert if Anthropic credits exhausted (social copy)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/anthropic_credit_error ]; then
            echo "No Anthropic credit/quota error detected."
            exit 0
          fi
          ERROR=$(cat /tmp/anthropic_credit_error)
          echo "::warning::Anthropic API credits/quota exhausted - social copy fell back to canned text"
          EXISTING=$(gh issue list --state open --search 'Anthropic credits exhausted in:title' \
            --json number --jq '.[0].number // empty') || EXISTING=""
          if [ -n "$EXISTING" ]; then
            echo "Credit-error issue already open (#$EXISTING) — not creating a duplicate."
            exit 0
          fi
          BODY=$(printf 'CI (run social now) could not generate post copy with AI: the Anthropic API rejected the request for billing reasons (credits/quota exhausted). The post went out with fallback text. Top up at https://console.anthropic.com/settings/billing\n\nError:\n%s\n\nRun: %s/%s/actions/runs/%s' \
            "$ERROR" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          if ! gh issue create \
                --title "Anthropic credits exhausted - social copy skipped" \
                --body "$BODY" \
                --label "bug"; then
            echo "::error::Anthropic credits exhausted AND the alert issue could not be created."
            exit 1
          fi
          echo "Opened a new GitHub issue for the Anthropic credit error."
      - name: Commit updated social state
        run: |
          git config --global user.name  "Podcast Bot"
          git config --global user.email "action@github.com"
          git add social_state.json
          git diff --staged --quiet || git commit -m "chore: update social post state [skip ci]"
          git pull --rebase origin main
          git push
