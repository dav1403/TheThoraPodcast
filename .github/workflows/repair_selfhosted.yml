name: Update Podcast Feeds (self-hosted)

# Second ingestion lane, running on David's own PC (residential IP) to
# complement the GitHub-hosted lane (repair_missing_audio.yml). Staggered by
# 30 min (this cron is :30, the hosted cron is :00) and uses a DIFFERENT cookie
# from the pool (COOKIE_ROTATION_OFFSET=1) so the two lanes never hit YouTube
# with the same account at the same time. Higher budget (60) because a
# residential IP is far less likely to be throttled than GitHub's datacenter IPs.
#
# INERT until a self-hosted runner labelled `ttp` is registered on David's PC —
# see docs/SCALING-INGESTION.md for the runner install steps. Prerequisites on
# that machine: git, Python 3.11+, ffmpeg, and Deno (yt-dlp n-challenge solver).
# yt-dlp and the other Python deps are installed by this workflow into a venv.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'manual'
      process_budget:
        description: 'Budget for new-episode processing (manual/burst runs). Dispatch this lane at 100-150 to drain a new-channel backlog.'
        required: false
        default: '60'
      backfill_budget_override:
        description: 'Override historical backfill budget; blank = use remaining budget from process step'
        required: false
        default: ''
  schedule:
    # Offset 30 min from the hosted lane's ':00' cron to avoid overlap.
    - cron: '30 * * * *'

concurrency:
  # Distinct from the hosted lane's `podcast-pipeline` group so the two lanes are
  # not serialized against each other; the 30-min stagger keeps them from racing.
  group: podcast-pipeline-selfhosted
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Higher than the hosted lane's 30: a residential IP tolerates a heavier run,
  # and the 30-min stagger gives this lane more headroom before the next cron.
  # Override per-run via the workflow_dispatch "process_budget" input (use
  # 100-150 for a backlog-draining burst).
  PROCESS_BUDGET_DEFAULT: '60'

jobs:
  update:
    # Requires a runner registered with BOTH labels. Inert until David registers one.
    runs-on: [self-hosted, ttp]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # Full history: the commit step rebases onto main to survive a race with
          # the hourly pipeline, and rebasing on a depth-1 shallow clone is unsafe.
          # BUT the repo carries ~28 Go of regenerated artefacts in its history, so
          # a plain fetch-depth: 0 fills the runner disk and hangs forever.
          # filter: blob:none = blobless partial clone: all commits/trees, zero
          # historical blobs. Git hydrates the few blobs it actually needs on
          # demand (checkout of HEAD, pull --rebase), so the rebase-retry below
          # keeps working.
          fetch-depth: 0
          filter: blob:none
          # Check out main as it stands at execution time (see hosted workflow).
          ref: main

      - name: Verify system prerequisites (Python, ffmpeg, Deno)
        # This lane relies on tools pre-installed on David's PC rather than
        # setup-python/setup-deno/apt (which target GitHub's Ubuntu images).
        run: |
          missing=0
          if command -v python3 >/dev/null 2>&1; then python3 --version; else echo "::error::python3 not found"; missing=1; fi
          if command -v ffmpeg  >/dev/null 2>&1; then ffmpeg -version | head -1; else echo "::error::ffmpeg not found"; missing=1; fi
          if command -v deno    >/dev/null 2>&1; then deno --version | head -1; else echo "::warning::deno not found — yt-dlp n-challenge solving may fail on some videos"; fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Install the missing prerequisites (see docs/SCALING-INGESTION.md), then re-run."
            exit 1
          fi

      - name: Install Python dependencies (persistent venv)
        # Reuse a venv under $HOME so we don't repeatedly touch the system Python
        # and so installs are fast after the first run. Export its bin dir on PATH
        # for all later steps, so `python` resolves to the venv interpreter.
        run: |
          python3 -m venv "$HOME/.ttp-venv"
          . "$HOME/.ttp-venv/bin/activate"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "$HOME/.ttp-venv/bin" >> $GITHUB_PATH

      - name: Validate channels.json (fail fast on broken JSON)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if err=$(python -c "import json; json.load(open('channels.json', encoding='utf-8-sig'))" 2>&1); then
            echo "channels.json is valid JSON"
          else
            echo "::error::channels.json is invalid JSON — halting pipeline before deploy"
            echo "$err"
            TITLE="🔴 channels.json invalid — pipeline halted"
            BODY=$(printf 'channels.json failed JSON validation. Pipeline stopped before touching feeds/site.\n\n```\n%s\n```\n\nFix the JSON, push, next run recovers.\nRun: %s/%s/actions/runs/%s' "$err" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
            EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null)
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY" 2>/dev/null || true
            else
              gh issue create --title "$TITLE" --body "$BODY" --label bug 2>/dev/null || true
            fi
            exit 1
          fi

      - name: Ensure feeds/ directory exists
        run: mkdir -p feeds

      - name: Save pre-run feed counts
        run: python scripts/ci_pre_run_counts.py

      - name: Write YouTube cookies (rotating pool, single-cookie fallback)
        # Same pool logic as the hosted lane but OFFSET=1, so at any given time
        # slot this lane uses a different cookie than the hosted lane. See
        # docs/SCALING-INGESTION.md for the pool format.
        env:
          YOUTUBE_COOKIES_POOL: ${{ secrets.YOUTUBE_COOKIES_POOL }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          COOKIE_ROTATION_INDEX: ${{ github.run_number }}
          COOKIE_ROTATION_OFFSET: '1'
        run: |
          python scripts/select_cookie_from_pool.py --output /tmp/yt_cookies.txt
          if [ -s /tmp/yt_cookies.txt ]; then
            echo "YOUTUBE_COOKIES_FILE=/tmp/yt_cookies.txt" >> $GITHUB_ENV
          fi

      - name: Generate channel artwork (3000x3000 PNG for Apple Podcasts)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          mkdir -p artwork
          python scripts/generate_artwork.py

      - name: Sync external RSS channels
        run: python scripts/sync_rss_channels.py

      - name: Bootstrap new channels (backfill last 10 episodes if feed missing)
        env:
          YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:          ${{ github.repository }}
          R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}
        run: |
          touch processed.json
          python scripts/ci_bootstrap_all.py

      - name: Run podcast update (new episodes)
        env:
          YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:          ${{ github.repository }}
          R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}
        run: |
          PROCESS_BUDGET='${{ github.event.inputs.process_budget }}'
          if [ -z "$PROCESS_BUDGET" ]; then
            PROCESS_BUDGET="${PROCESS_BUDGET_DEFAULT:-15}"
          fi
          echo "Process budget: $PROCESS_BUDGET"
          python scripts/process_podcasts.py --budget "$PROCESS_BUDGET"

      - name: Run backfill (historical episodes with remaining budget)
        env:
          YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:          ${{ github.repository }}
          R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}
        run: |
          BUDGET='${{ github.event.inputs.backfill_budget_override }}'
          if [ -z "$BUDGET" ]; then
            BUDGET=$(cat /tmp/backfill_budget 2>/dev/null || echo 0)
          fi
          echo "Backfill budget: $BUDGET"
          python scripts/backfill_podcasts.py --budget "$BUDGET"

      - name: Tag untagged episodes with AI themes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/tag_episodes.py || echo "WARNING: tagging failed (API credits?), continuing"

      - name: Fetch episode transcripts (auto-captions from YouTube)
        env:
          YOUTUBE_COOKIES_FILE: ${{ env.YOUTUBE_COOKIES_FILE }}
        run: python scripts/fetch_transcripts.py --budget 50

      - name: Generate per-channel HTML pages and update sitemap
        run: python scripts/generate_channel_pages.py

      - name: Commit and push updated feeds
        id: commit
        run: |
          git config --global user.name  "Podcast Bot"
          git config --global user.email "action@github.com"
          git add feeds/ processed.json backfill_state.json artwork/ sitemap.xml *.html
          # Stage every channel's episode-page directory, derived from channels.json slugs.
          python -c "import json;[print(c['slug']) for c in json.load(open('channels.json', encoding='utf-8-sig'))]" \
            | while IFS= read -r s; do
                [ -n "$s" ] && [ -d "$s" ] && git add -- "$s/"
              done
          if git diff --staged --quiet; then
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update podcast feeds (self-hosted) [skip ci]"
            echo "committed=true" >> $GITHUB_OUTPUT
          fi
          # Rebase-then-push with retry: the hosted lane also pushes to feeds/.
          # Staggered by 30 min, but a long run can overlap — retry rather than fail.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push; then
              echo "Pushed on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::git push failed after 5 rebase attempts."
              exit 1
            fi
            echo "Push rejected (attempt $attempt) — the other lane pushed first; rebasing and retrying."
            sleep $((attempt * 5))
          done

      - name: Submit new episode pages to IndexNow
        if: steps.commit.outputs.committed == 'true'
        run: |
          NEW_URLS=$(git diff --name-only HEAD~1 HEAD -- '*.html' | \
            grep -E '^(rav-|rabbin-|beth-)[^/]+/.+\.html$' | head -100 | \
            sed 's|^|https://thetorahpodcast.net/|' | \
            jq -Rsc '[split("\n")[] | select(length > 0)]')
          COUNT=$(echo "$NEW_URLS" | jq 'length')
          if [ "$COUNT" -gt 0 ]; then
            curl -s -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "{\"host\":\"thetorahpodcast.net\",\"key\":\"b9e2d8f1c3a74065b8e2d8f1c3a74065\",\"keyLocation\":\"https://thetorahpodcast.net/b9e2d8f1c3a74065b8e2d8f1c3a74065.txt\",\"urlList\":${NEW_URLS}}"
            echo "IndexNow: submitted $COUNT new episode URL(s)"
          else
            echo "IndexNow: no new episode pages to submit"
          fi

      - name: Alert if YouTube auth error detected
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/auth_error ]; then
            echo "No YouTube auth error detected."
            OPEN=$(gh issue list --state open --search 'YouTube auth error in:title' \
              --json number --jq '.[0].number // empty' 2>/dev/null) || OPEN=""
            if [ -n "$OPEN" ]; then
              COMMENT=$(printf 'Auto-résolu : cookies YouTube de nouveau OK au run %s (self-hosted)\n\n%s/%s/actions/runs/%s' \
                "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
              if gh issue close "$OPEN" --comment "$COMMENT" 2>/dev/null; then
                echo "Closed stale auth-error issue #$OPEN (cookies recovered)."
              else
                echo "Could not auto-close issue #$OPEN (best-effort) — leaving it open."
              fi
            fi
            exit 0
          fi

          ERROR=$(cat /tmp/auth_error)
          echo "::warning::YouTube auth error detected - cookies may be expired"

          EXISTING=$(gh issue list --state open --search 'YouTube auth error in:title' \
            --json number --jq '.[0].number // empty') || EXISTING=""
          if [ -n "$EXISTING" ]; then
            echo "Auth-error issue already open (#$EXISTING) — not creating a duplicate."
            exit 0
          fi

          BODY=$(printf 'CI (self-hosted lane) detected a YouTube auth error. A cookie in the pool may need refreshing.\n\nError:\n%s\n\nRun: %s/%s/actions/runs/%s' \
            "$ERROR" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")

          if ! gh issue create \
                --title "YouTube auth error - cookies may be expired" \
                --body "$BODY" \
                --label "bug"; then
            echo "::error::YouTube cookies are expired AND the alert issue could not be created (check issues:write permission and the 'bug' label)."
            exit 1
          fi
          echo "Opened a new GitHub issue for the YouTube auth error."

      - name: Alert if Anthropic credits exhausted (theme tagging)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/anthropic_credit_error ]; then
            echo "No Anthropic credit/quota error detected."
            exit 0
          fi

          ERROR=$(cat /tmp/anthropic_credit_error)
          echo "::warning::Anthropic API credits/quota exhausted - theme tagging skipped"

          EXISTING=$(gh issue list --state open --search 'Anthropic credits exhausted in:title' \
            --json number --jq '.[0].number // empty') || EXISTING=""
          if [ -n "$EXISTING" ]; then
            echo "Credit-error issue already open (#$EXISTING) — not creating a duplicate."
            exit 0
          fi

          BODY=$(printf 'CI (self-hosted lane) could not tag episodes with AI themes: the Anthropic API rejected the request for billing reasons (credits/quota exhausted). Top up at https://console.anthropic.com/settings/billing\n\nError:\n%s\n\nRun: %s/%s/actions/runs/%s' \
            "$ERROR" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")

          if ! gh issue create \
                --title "Anthropic credits exhausted - theme tagging skipped" \
                --body "$BODY" \
                --label "bug"; then
            echo "::error::Anthropic credits exhausted AND the alert issue could not be created (check issues:write permission and the 'bug' label)."
            exit 1
          fi
          echo "Opened a new GitHub issue for the Anthropic credit error."

      - name: Generate run summary
        if: always()
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/generate_summary.py >> $GITHUB_STEP_SUMMARY
