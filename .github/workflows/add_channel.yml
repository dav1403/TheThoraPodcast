name: Add Channel

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug (e.g. rav-david-cohen) — used for file names and URLs'
        required: true
      author:
        description: 'Author display name (e.g. Rav David Cohen)'
        required: true
      language:
        description: 'Language'
        required: true
        default: 'fr'
        type: choice
        options: ['fr', 'he', 'en']
      source:
        description: 'Source type'
        required: true
        default: 'youtube'
        type: choice
        options: ['youtube', 'rss']
      youtube_url:
        description: 'Any YouTube URL: channel page, @handle, or playlist link'
        required: false
      rss_url:
        description: 'RSS feed URL — only for RSS source'
        required: false
      spotify_url:
        description: 'Spotify show URL (optional)'
        required: false
      apple_url:
        description: 'Apple Podcasts show URL (optional)'
        required: false
      deezer_url:
        description: 'Deezer show URL (optional)'
        required: false

permissions:
  contents: write
  # Needed by the final step, which dispatches "Update Podcast Feeds" so the new
  # channel is ingested immediately instead of waiting for the hourly cron.
  actions: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # Full history: the commit step rebases onto main to survive a race with
          # the hourly pipeline, and rebasing on a depth-1 shallow clone is unsafe.
          # BUT the repo carries ~28 Go of regenerated artefacts in its history, so
          # a plain fetch-depth: 0 fills the runner disk and hangs forever.
          # filter: blob:none = blobless partial clone: all commits/trees, zero
          # historical blobs. Git hydrates the few blobs it actually needs on
          # demand (checkout of HEAD, pull --rebase), so the rebase-retry below
          # keeps working.
          fetch-depth: 0
          filter: blob:none
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Resolve YouTube channel ID and add to channels.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PYEOF'
          import json, re, sys, urllib.request, urllib.parse
          from pathlib import Path

          slug        = "${{ github.event.inputs.slug }}".strip().lower()
          if not re.fullmatch(r"[a-z0-9-]+", slug):
              print("ERROR: slug invalide, uniquement [a-z0-9-] (minuscules) - recu:", slug); sys.exit(1)
          author      = "${{ github.event.inputs.author }}".strip()
          language    = "${{ github.event.inputs.language }}".strip()
          source      = "${{ github.event.inputs.source }}".strip()
          yt_url      = "${{ github.event.inputs.youtube_url }}".strip()
          rss_url     = "${{ github.event.inputs.rss_url }}".strip()
          spotify_url = "${{ github.event.inputs.spotify_url }}".strip()
          apple_url   = "${{ github.event.inputs.apple_url }}".strip()
          deezer_url  = "${{ github.event.inputs.deezer_url }}".strip()
          api_key     = "${{ env.YOUTUBE_API_KEY }}".strip()

          # ── validation ────────────────────────────────────────────────────
          if not slug or not author:
              print("ERROR: slug and author are required"); sys.exit(1)
          if source == "youtube" and not yt_url:
              print("ERROR: youtube_url is required for YouTube source"); sys.exit(1)
          if source == "rss" and not rss_url:
              print("ERROR: rss_url is required for RSS source"); sys.exit(1)

          # ── resolve YouTube URL → channel ID ──────────────────────────────
          def api_get(endpoint, params):
              params["key"] = api_key
              url = f"https://www.googleapis.com/youtube/v3/{endpoint}?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=15) as r:
                  return json.loads(r.read())

          def resolve_channel_id(url):
              # uploads playlist: list=UUxxxxxxx → UCxxxxxxx
              m = re.search(r'[?&]list=(UU[A-Za-z0-9_-]+)', url)
              if m:
                  return "UC" + m.group(1)[2:]

              # direct channel ID in URL
              m = re.search(r'/channel/(UC[A-Za-z0-9_-]+)', url)
              if m:
                  return m.group(1)

              # @handle in URL
              m = re.search(r'/@([A-Za-z0-9_.-]+)', url)
              if m:
                  handle = m.group(1)
                  data = api_get("channels", {"part": "id", "forHandle": handle})
                  items = data.get("items", [])
                  if not items:
                      print(f"ERROR: could not find YouTube channel for @{handle}")
                      sys.exit(1)
                  return items[0]["id"]

              # /c/name or /user/name — resolve via search
              m = re.search(r'youtube\.com/(?:c/|user/)([^/?&]+)', url)
              if m:
                  name = m.group(1)
                  data = api_get("channels", {"part": "id", "forUsername": name})
                  items = data.get("items", [])
                  if not items:
                      print(f"ERROR: could not resolve YouTube username '{name}'")
                      sys.exit(1)
                  return items[0]["id"]

              print(f"ERROR: unrecognised YouTube URL: {url}")
              sys.exit(1)

          yt_id = None
          if source == "youtube":
              yt_id = resolve_channel_id(yt_url)
              print(f"Resolved channel ID: {yt_id}")

          # ── load and validate channels.json ───────────────────────────────
          channels_path = Path("channels.json")
          channels = json.loads(channels_path.read_text(encoding="utf-8-sig"))

          if any(ch["slug"] == slug for ch in channels):
              print(f"ERROR: slug '{slug}' already exists"); sys.exit(1)

          if yt_id and any(ch.get("youtube_channel_id") == yt_id for ch in channels):
              print(f"ERROR: channel ID '{yt_id}' already exists"); sys.exit(1)

          # ── build and append entry ────────────────────────────────────────
          # Always write spotify/apple/deezer placeholders (empty if not provided)
          # so links can just be pasted into channels.json afterwards. The site
          # skips empty platform values, so blanks never render as broken buttons.
          platforms = {
              "spotify": spotify_url,
              "apple": apple_url,
              "deezer": deezer_url,
              "rss": f"https://thetorahpodcast.net/feeds/{slug}.xml",
          }

          entry = {
              "slug": slug,
              "podcast_author": author,
              "podcast_email": "thetorahpodcast@gmail.com",
              "podcast_language": language,
              "podcast_category": "Religion & Spirituality",
              "enabled": True,
              "platforms": platforms,
          }

          if source == "youtube":
              entry["youtube_channel_id"] = yt_id
          else:
              entry["source"] = "rss"
              entry["rss_url"] = rss_url

          channels.append(entry)
          channels_path.write_text(
              json.dumps(channels, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(f"\nAdded channel '{slug}':")
          print(json.dumps(entry, ensure_ascii=False, indent=2))
          PYEOF

      - name: Commit and push
        run: |
          git config --global user.name  "Podcast Bot"
          git config --global user.email "action@github.com"
          git add channels.json
          git commit -m "feat: add channel ${{ github.event.inputs.slug }} [skip ci]"
          # Rebase-then-push with retry: the hourly "Update Podcast Feeds" pipeline
          # pushes to main constantly, so a naive push here loses the race and the
          # new channel is silently never added. Same pattern as
          # repair_missing_audio.yml's commit step.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push; then
              echo "Pushed on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::git push failed after 5 rebase attempts."
              exit 1
            fi
            echo "Push rejected (attempt $attempt) — someone pushed first; rebasing and retrying."
            sleep $((attempt * 5))
          done

      # ── Fast path: bootstrap THIS channel here, in this run ────────────────
      #
      # Everything from here to the commit step exists for one reason: the RSS
      # feed must be online in a few minutes, not in eighteen. Measured on the
      # 2026-09-18 onboarding: this workflow 2m20, then the dispatched "Update
      # Podcast Feeds" 11m33 (2m09 checkout, 51s of actual bootstrap for the new
      # channel, 3m44 regenerating the HTML pages of ALL ~25 channels, 3m35 for
      # the resulting giant commit+push), then 4m of GitHub Pages build. Out of
      # those ~18 minutes, under one was spent on the channel being added — the
      # rest is the roster-wide work the hourly pipeline does anyway.
      #
      # So we no longer wait for it. The steps below redo, for the new slug
      # ONLY, the minimum needed for a submittable feed: Python + ffmpeg + Deno
      # + rotating YouTube cookies (copied verbatim from repair_missing_audio.yml
      # so there is one shape to keep in sync, not two), then
      # bootstrap_channel.py, then artwork, then a commit restricted by pathspec
      # to this channel's files. That is the whole cost: no page generation, no
      # search index, no ~25-channel diff.
      #
      # Yes, this duplicates the R2/YouTube secret block. The earlier comment
      # here argued that duplication was the reason to delegate everything; the
      # trade was wrong at 18 minutes of latency on the one operation David runs
      # by hand before going to Spotify/Apple/Deezer. The secrets are referenced,
      # never printed, and the names are the same strings as in
      # repair_missing_audio.yml.
      #
      # The fast path is best-effort by construction: every step below is
      # continue-on-error, so a YouTube 403, an R2 hiccup or a lost push race
      # degrades this back to exactly the previous behaviour — the dispatch at
      # the end still runs and "Update Podcast Feeds" still onboards the channel
      # as it always did. Losing ingestion is not an acceptable price for speed.
      - name: Cache pip dependencies
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Deno (for yt-dlp EJS n-challenge solver)
        continue-on-error: true
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install ffmpeg
        continue-on-error: true
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write YouTube cookies (rotating pool, single-cookie fallback)
        # Same picker as the hourly pipeline: one cookie out of
        # YOUTUBE_COOKIES_POOL (accounts concatenated, separated by a line
        # "-----COOKIE-----"), rotated by run number, falling back to the single
        # YOUTUBE_COOKIES secret. Without it yt-dlp gets silent 403s and the
        # bootstrap below downloads nothing.
        continue-on-error: true
        env:
          YOUTUBE_COOKIES_POOL: ${{ secrets.YOUTUBE_COOKIES_POOL }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          COOKIE_ROTATION_INDEX: ${{ github.run_number }}
          COOKIE_ROTATION_OFFSET: '0'
        run: |
          python scripts/select_cookie_from_pool.py --output /tmp/yt_cookies.txt
          if [ -s /tmp/yt_cookies.txt ]; then
            echo "YOUTUBE_COOKIES_FILE=/tmp/yt_cookies.txt" >> $GITHUB_ENV
          fi

      # --max 3 is deliberate and is the whole point of the fast path: Spotify,
      # Apple and Deezer only need a feed with a handful of valid enclosures to
      # accept a submission, and 3 episodes cost ~1 min of download instead of
      # ~5 for 10. The rest of the history is backfilled by the hourly cron (and
      # by the dispatch at the end of this workflow), so nothing is lost —
      # episodes simply keep arriving in the feed after it is already live.
      #
      # Skipped for RSS-sourced channels: bootstrap_channel.py reads
      # youtube_channel_id, and an external feed is mirrored by
      # sync_rss_channels.py inside the hourly pipeline instead.
      - name: Bootstrap the new channel (first 3 episodes, enough to submit)
        if: github.event.inputs.source == 'youtube'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:          ${{ github.repository }}
          R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}
        run: |
          mkdir -p feeds
          touch processed.json
          python scripts/bootstrap_channel.py --slug "${{ github.event.inputs.slug }}" --max 3

      # generate_artwork.py skips any channel that already has its PNG, so the
      # ~25 existing ones cost nothing: in practice this only renders the new
      # slug. Apple rejects a feed whose <itunes:image> 404s, hence doing it now
      # rather than leaving it to the hourly run.
      - name: Generate channel artwork (3000x3000 PNG for Apple Podcasts)
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          mkdir -p artwork
          python scripts/generate_artwork.py

      # Pathspec-restricted on purpose. The hourly pipeline's commit stages
      # feeds/ artwork/ *.html search-fts/ mobile/ … — several hundred MB of
      # regenerated artefacts, and most of the 3m35 measured above. Here we
      # commit the five paths that belong to this channel and nothing else, with
      # an explicit `git commit -- <paths>` rather than a bare `git commit`, so a
      # concurrent hourly run cannot see its own half-written files swept into
      # our commit (the git index is shared by whatever touches the worktree).
      # Any of these paths may legitimately be missing — artwork if the render
      # failed, the feed if the bootstrap was skipped for an RSS channel — so we
      # keep only the ones that exist and no-op when the list is empty.
      - name: Commit the new channel's feed and artwork (pathspec-restricted)
        continue-on-error: true
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          git config --global user.name  "Podcast Bot"
          git config --global user.email "action@github.com"

          PATHS=()
          for p in "channels.json" \
                   "feeds/$SLUG.xml" \
                   "feeds/$SLUG.entries.json" \
                   "artwork/$SLUG.png" \
                   "processed.json"; do
            # if/then, not `[ -e ] && ...`: the runner's shell is `bash -e`, and a
            # trailing false test on the last iteration would abort the step.
            if [ -e "$p" ]; then PATHS+=("$p"); fi
          done
          if [ ${#PATHS[@]} -eq 0 ]; then
            echo "Nothing produced by the fast path — leaving it to the dispatch below."
            exit 0
          fi
          echo "Committing: ${PATHS[*]}"

          git add -- "${PATHS[@]}"
          if git diff --staged --quiet -- "${PATHS[@]}"; then
            echo "No change in those paths (already committed upstream?) — nothing to do."
          else
            # [skip ci] matches the convention of every feeds commit in this repo
            # and stops the hourly workflow from being triggered by our push.
            # GitHub Pages is NOT a workflow trigger here — it builds from the
            # branch — so the site still redeploys and the feed goes live.
            git commit -m "feat: bootstrap feed for $SLUG [skip ci]" -- "${PATHS[@]}"
          fi

          # Same rebase-then-push retry as repair_missing_audio.yml: the hourly
          # pipeline pushes to main constantly and would otherwise win the race
          # and drop this commit on the floor.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push; then
              echo "Pushed on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::warning::git push failed after 5 rebase attempts — the dispatch below will redo this work."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — someone pushed first; rebasing and retrying."
            sleep $((attempt * 5))
          done

          echo "Feed should be live within ~1 min of the Pages build:"
          echo "  https://thetorahpodcast.net/feeds/$SLUG.xml"

      # The dispatch below is no longer what makes the feed exist — the fast
      # path above already did that — but it stays, for two distinct jobs.
      #
      # 1. It is the safety net. Every fast-path step is continue-on-error, so
      #    if the bootstrap failed (expired cookies, R2 down, lost push race)
      #    "Update Podcast Feeds" still runs `ci_bootstrap_all.py`, which
      #    backfills any channel whose feed is missing — i.e. exactly this one.
      #    Behaviour then degrades to what it was before the fast path existed:
      #    slower, never broken.
      # 2. It owns everything the fast path deliberately skips: the per-channel
      #    HTML pages of the site, sitemap.xml, home.json, the search index and
      #    the transcript full-text index — plus the backfill of the episodes
      #    after the first three.
      #
      # Both budgets stay pinned to 0: `ci_bootstrap_all.py` runs *before* the
      # budgeted steps and ignores them, so the safety net still works while the
      # run skips processing new episodes and backfilling history for the ~24
      # other channels — which is what makes an hourly run long. The regular
      # cron picks that work back up at the next hour.
      #
      # The commits above carry [skip ci], so this explicit dispatch is the only
      # thing that starts the run.
      #
      # Caveat worth knowing: the pipeline declares
      # `concurrency: podcast-pipeline` with `cancel-in-progress: false`, so if
      # an hourly run is already going, this one queues behind it rather than
      # starting at once. Still strictly better than waiting for the next cron.
      - name: Ingest the new channel now (don't wait for the hourly cron)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run repair_missing_audio.yml --ref main \
            -f reason="onboarding ${{ github.event.inputs.slug }}" \
            -f process_budget=0 \
            -f backfill_budget_override=0
          echo "Dispatched 'Update Podcast Feeds' (bootstrap only): site pages, sitemap,"
          echo "search index, and the episodes after the first three."
          echo "The RSS for '${{ github.event.inputs.slug }}' (published by the fast path above,"
          echo "or by that run if the fast path failed):"
          echo "  https://thetorahpodcast.net/feeds/${{ github.event.inputs.slug }}.xml"
          echo "Follow the run: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/repair_missing_audio.yml"
