name: Regenerate on manual edit

# A human can edit channels.json / speakers.json directly on GitHub (the
# generator's source files — see scripts/generate_channel_pages.py). Those
# files are intentionally excluded from deploy-site.yml's push trigger paths
# (the deploy guard compares the built site to what's committed on main, and
# the built pages/home.json/sitemap/search-index are only regenerated by the
# "Update Podcast Feeds" pipeline) — so an edit that isn't followed by a
# pipeline run leaves main's generated artefacts stale and ALL deployments
# fail the comparison guard until the pipeline happens to run again.
# Real incident: commit 10b440a831 (01/10/2026, channels.json edited on
# GitHub, Spotify links added) sat un-regenerated and broke every deploy
# (65 diffs on rav-benayahu-shmueli) until a manual repair_missing_audio run.
#
# Fix: a push to main touching these files dispatches the pipeline itself in
# regen-only mode (process_budget=0, backfill_budget_override=0 — same flags
# add_channel.yml uses for its own "ingest now" dispatch) so the site is
# consistent again within one pipeline run, no manual gesture needed.
#
# Not a push trigger directly on repair_missing_audio.yml: push events carry
# no workflow_dispatch "inputs", so there would be no way to force
# process_budget=0 for this path — the run would fall back to
# PROCESS_BUDGET_DEFAULT (30) and do a full, slow ingestion pass instead of
# "just regenerate". Dispatching explicitly (gh workflow run) is the same
# pattern already used in add_channel.yml's "Ingest the new channel now" step.
#
# No loop: every automated commit this repo makes to channels.json/
# speakers.json (add_channel.yml, update_channel.yml, repair_missing_audio.yml
# itself) carries "[skip ci]" in its message, which GitHub never routes to a
# push trigger in any workflow — so this workflow only ever fires on a human
# (non-"[skip ci]") commit, never on the bot's own writes.
on:
  push:
    branches: [main]
    paths:
      - channels.json
      - speakers.json

# Coalesce a burst of quick successive manual edits into a single dispatch;
# cancelling here only skips the `gh workflow run` call itself (cheap, no
# side effect yet), never the pipeline run it may have already dispatched.
concurrency:
  group: regen-on-manual-edit
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch "Update Podcast Feeds" (regen only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run repair_missing_audio.yml --repo "${{ github.repository }}" --ref main \
            -f reason="regen after manual edit ${{ github.sha }}" \
            -f process_budget=0 \
            -f backfill_budget_override=0
          echo "Dispatched 'Update Podcast Feeds' (regen only) after manual edit ${{ github.sha }} by ${{ github.actor }}."
          echo "Follow the run: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/repair_missing_audio.yml"
