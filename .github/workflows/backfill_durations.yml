name: Backfill Episode Durations

# Phase 4: the state lives in R2 (scripts/site_state.py). Was a 14-job matrix
# where every job committed its entries.json to git (git serialised them);
# now ONE job under the state lease: restore the entries.json, fill the
# missing durations (YouTube Data API), push only what changed (partial push,
# the rest of the state is carried over). The pipeline picks the durations
# up in the RSS at its next run; deploy-site publishes them.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'   # 01h30 Israel (UTC+3) chaque nuit

concurrency:
  group: backfill-durations${{ github.ref != 'refs/heads/main' && '-staging' || '' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TTP_STATE_PREFIX: ${{ github.ref == 'refs/heads/main' && '_state/' || '_state-staging/' }}
  TTP_SNAPSHOT_PREFIX: ${{ github.ref == 'refs/heads/main' && '_state-snapshots/' || '_state-staging-snapshots/' }}
  R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
  R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
  SLUGS: >-
    rav-itshak-cohen rav-yonathan-mergui rav-yaakov-sitruk rav-liran-ishai
    rav-barak-ben-nissan rav-menahem-sakhoun rabbin-jonas rav-meir-david-shmueli
    lev rav-paz-shavit beth-habad-tlv-nord torah_fr rav-ruben-attal rav-shimshone-attali

jobs:
  backfill:
    runs-on: ubuntu-latest
    # The hourly pipeline holds the lease for its whole run (up to 190 min).
    timeout-minutes: 240
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install boto3
        run: python -m pip install --quiet boto3

      - name: Take the state lease (waits for a running pipeline)
        id: lease
        run: python scripts/site_state.py lock acquire --ttl-minutes 30 --wait-minutes 200

      - name: Restore the entries from R2
        run: python scripts/site_state.py pull --dest . --only 'feeds/*.entries.json' --record "$RUNNER_TEMP/rec.json"

      - name: Backfill durations via YouTube API (batch 50)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/backfill_durations_api.py $SLUGS

      - name: Push the changed entries (partial push, anti-loss guard)
        run: |
          python scripts/site_state.py push --root . --base-record "$RUNNER_TEMP/rec.json" \
            --only 'feeds/*.entries.json' --commit "$GITHUB_SHA"

      - name: Release the state lease
        if: always() && steps.lease.outcome == 'success'
        run: python scripts/site_state.py lock release
