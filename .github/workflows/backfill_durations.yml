name: Backfill Episode Durations

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'   # 01h30 Israel (UTC+3) chaque nuit

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # API YouTube = ~1-3 min par chaîne, pas 32
    strategy:
      fail-fast: false
      matrix:
        slug:
          - rav-itshak-cohen
          - rav-yonathan-mergui
          - rav-yaakov-sitruk
          - rav-liran-ishai
          - rav-barak-ben-nissan
          - rav-menahem-sakhoun
          - rabbin-jonas
          - rav-meir-david-shmueli
          - lev
          - rav-paz-shavit
          - beth-habad-tlv-nord
          - torah_fr
          - rav-ruben-attal
          - rav-shimshone-attali

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Backfill durations via YouTube API (batch 50)
        id: backfill
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PYEOF'
          import json, os, re, sys, urllib.request, urllib.parse
          from pathlib import Path

          slug      = "${{ matrix.slug }}"
          api_key   = os.environ.get("YOUTUBE_API_KEY", "")
          entries_f = Path("feeds") / f"{slug}.entries.json"

          def write_output(filled, remaining, total):
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write(f"filled={filled}\nremaining={remaining}\ntotal={total}\n")

          if not entries_f.exists():
              print(f"{slug}: no entries file, skipping.")
              write_output(0, 0, 0); sys.exit(0)

          entries = json.loads(entries_f.read_text(encoding="utf-8"))
          missing = [ep for ep in entries if not ep.get("duration_secs") and ep.get("video_id")]
          print(f"{slug}: {len(missing)} missing / {len(entries)} total")

          if not missing:
              print("Nothing to do.")
              write_output(0, 0, len(entries)); sys.exit(0)

          if not api_key:
              print("No YOUTUBE_API_KEY — skipping.", file=sys.stderr)
              write_output(0, len(missing), len(entries)); sys.exit(0)

          def parse_iso8601(s):
              """PT1H2M3S -> seconds"""
              m = re.match(r'PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?', s or '')
              if not m: return 0
              return int(m.group(1) or 0)*3600 + int(m.group(2) or 0)*60 + int(m.group(3) or 0)

          def fetch_batch(video_ids):
              ids = ','.join(video_ids)
              url = (f"https://www.googleapis.com/youtube/v3/videos"
                     f"?id={urllib.parse.quote(ids)}&part=contentDetails&key={api_key}")
              try:
                  resp = urllib.request.urlopen(url, timeout=30)
                  data = json.loads(resp.read())
                  return {item['id']: parse_iso8601(item['contentDetails']['duration'])
                          for item in data.get('items', [])}
              except Exception as e:
                  print(f"  API error: {e}", file=sys.stderr)
                  return {}

          # Index entries by video_id for fast lookup
          idx = {ep['video_id']: ep for ep in entries if ep.get('video_id')}
          filled = 0
          BATCH = 50

          vids = [ep['video_id'] for ep in missing]
          for i in range(0, len(vids), BATCH):
              batch = vids[i:i+BATCH]
              durations = fetch_batch(batch)
              for vid, dur in durations.items():
                  if dur > 0 and vid in idx:
                      idx[vid]['duration_secs'] = dur
                      filled += 1
              print(f"  Batch {i//BATCH+1}: {len(durations)}/{len(batch)} resolved")

          remaining = sum(1 for ep in entries if not ep.get('duration_secs'))

          if filled > 0:
              tmp = entries_f.with_suffix('.tmp')
              tmp.write_text(json.dumps(entries, ensure_ascii=False, indent=2), encoding='utf-8')
              tmp.replace(entries_f)
              print(f"Saved — +{filled} this run, {remaining} remaining")
          else:
              print(f"No update — {remaining} remaining")

          write_output(filled, remaining, len(entries))
          PYEOF

      - name: Save stats artifact
        run: |
          mkdir -p /tmp/dur-stats
          echo '{"slug":"${{ matrix.slug }}","filled":${{ steps.backfill.outputs.filled }},"remaining":${{ steps.backfill.outputs.remaining }},"total":${{ steps.backfill.outputs.total }}}' \
            > /tmp/dur-stats/${{ matrix.slug }}.json

      - name: Upload stats
        uses: actions/upload-artifact@v7
        with:
          name: dur-stats-${{ matrix.slug }}
          path: /tmp/dur-stats/${{ matrix.slug }}.json
          retention-days: 1

      - name: Commit results for ${{ matrix.slug }}
        run: |
          git config --global user.name  "Podcast Bot"
          git config --global user.email "action@github.com"
          git add feeds/${{ matrix.slug }}.entries.json
          if git diff --staged --quiet; then
            echo "Nothing to commit for ${{ matrix.slug }}"
          else
            git commit -m "chore: backfill durations for ${{ matrix.slug }} [skip ci]"
            for i in 1 2 3 4 5; do
              sleep $((RANDOM % 10 + 1))
              git pull --rebase --autostash origin main && git push && break
              echo "Push attempt $i failed, retrying…"
            done
          fi

  summary:
    name: Rapport durées
    runs-on: ubuntu-latest
    needs: backfill
    if: always()
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download all stats artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dur-stats-*
          path: /tmp/dur-stats
          merge-multiple: true

      - name: Générer le rapport
        run: |
          python - <<'PYEOF'
          import json, glob, os, sys
          from pathlib import Path

          # Per-run delta from artifacts
          run_filled = 0; run_remaining = 0
          stats_by_slug = {}
          for f in glob.glob("/tmp/dur-stats/*.json"):
              try:
                  d = json.loads(open(f).read())
                  slug = d['slug']
                  stats_by_slug[slug] = d
                  run_filled    += d.get('filled', 0)
                  run_remaining += d.get('remaining', 0)
              except: pass

          # Global state from feeds — channel feeds only, or the derived speaker
          # feeds (copies of these same episodes) double-count the totals.
          sys.path.insert(0, "scripts")
          from feeds_util import channel_entry_files
          feeds = channel_entry_files("feeds")
          total_eps = 0; total_missing = 0
          rows = []

          for f in feeds:
              slug = Path(f).stem.replace('.entries', '')
              try:
                  eps = json.loads(open(f, encoding='utf-8').read())
              except: continue
              n = len(eps)
              m = sum(1 for e in eps if not e.get('duration_secs'))
              done = n - m
              pct = int(100 * done / n) if n else 0
              total_eps += n; total_missing += m
              bar  = '🟩' * (pct // 10) + '⬜' * (10 - pct // 10)
              slug_filled = stats_by_slug.get(slug, {}).get('filled', '?')
              rows.append((slug, done, n, m, pct, bar, slug_filled))

          total_done = total_eps - total_missing
          pct_total  = int(100 * total_done / total_eps) if total_eps else 0

          out = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/stdout')
          with open(out, 'w', encoding='utf-8') as f:
              f.write('# 🎙️ Backfill Durées — Rapport\n\n')
              f.write(f'## Ce run : **+{run_filled} durées ajoutées**\n\n')
              f.write(f'## État global : {total_done}/{total_eps} ({pct_total}%)\n\n')
              f.write(f'{"🟩" * (pct_total // 10)}{"⬜" * (10 - pct_total // 10)} {pct_total}%\n\n')
              f.write('| Chaîne | +ce run | Complétés | Total | Manquants | Progression |\n')
              f.write('|--------|---------|-----------|-------|-----------|-------------|\n')
              for slug, done, n, m, pct, bar, slug_filled in rows:
                  st = '✅' if m == 0 else ('🔄' if pct >= 50 else '⏳')
                  delta = f'+{slug_filled}' if isinstance(slug_filled, int) and slug_filled > 0 else ('—' if slug_filled == 0 else '?')
                  f.write(f'| {st} {slug} | {delta} | {done} | {n} | {m} | {bar} {pct}% |\n')
              import datetime
              f.write(f'\n> Run du {datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M")} UTC '
                      f'· {run_remaining} épisodes encore sans durée\n')
          PYEOF
