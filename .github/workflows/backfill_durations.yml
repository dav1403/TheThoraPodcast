name: Backfill Episode Durations (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slug:
          - rav-itshak-cohen
          - rav-yonathan-mergui
          - rav-yaakov-sitruk
          - rav-liran-ishai
          - rav-barak-ben-nissan
          - rav-menahem-sakhoun
          - rabbin-jonas
          - rav-meir-david-shmueli
          - lev
          - rav-paz-shavit
          - beth-habad-tlv-nord
          - torah_fr
          - rav-ruben-attal
          - rav-shimshone-attali

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (for yt-dlp EJS n-challenge solver)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pip install yt-dlp yt-dlp-ejs

      - name: Write YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
            echo "YOUTUBE_COOKIES_FILE=/tmp/yt_cookies.txt" >> $GITHUB_ENV
          fi

      - name: Backfill durations for ${{ matrix.slug }}
        run: |
          python - <<'EOF'
          import json, os, subprocess, sys
          from pathlib import Path

          slug = "${{ matrix.slug }}"
          feeds_dir = Path("feeds")
          entries_file = feeds_dir / f"{slug}.entries.json"

          if not entries_file.exists():
              print(f"No entries file for {slug}, skipping.")
              sys.exit(0)

          entries = json.loads(entries_file.read_text(encoding="utf-8"))
          missing = [ep for ep in entries if not ep.get("duration_secs")]
          print(f"{slug}: {len(missing)} episodes to backfill (out of {len(entries)} total)")

          if not missing:
              print("All durations already present, nothing to do.")
              sys.exit(0)

          cookies_file = os.environ.get("YOUTUBE_COOKIES_FILE", "")
          changed = False

          for ep in missing:
              vid = ep.get("video_id")
              if not vid:
                  continue
              url = f"https://www.youtube.com/watch?v={vid}"
              cmd = ["yt-dlp", "--print", "%(duration)s", "--skip-download", "--no-warnings"]
              if cookies_file and Path(cookies_file).exists():
                  cmd += ["--cookies", cookies_file]
              cmd.append(url)
              try:
                  out = subprocess.check_output(cmd, text=True, stderr=subprocess.DEVNULL, timeout=30).strip()
                  dur = int(out) if out and out != "NA" else 0
                  if dur > 0:
                      ep["duration_secs"] = dur
                      changed = True
                      print(f"  {vid}: {dur}s")
              except Exception as e:
                  print(f"  {vid}: skipped ({e})", file=sys.stderr)

          if changed:
              tmp = entries_file.with_suffix(".tmp")
              tmp.write_text(json.dumps(entries, ensure_ascii=False, indent=2), encoding="utf-8")
              tmp.replace(entries_file)
              print(f"Saved {entries_file.name}")
          else:
              print("No durations updated.")
          EOF

      - name: Commit results for ${{ matrix.slug }}
        run: |
          git config --global user.name  "Podcast Bot"
          git config --global user.email "action@github.com"
          git add feeds/${{ matrix.slug }}.entries.json
          if git diff --staged --quiet; then
            echo "Nothing to commit for ${{ matrix.slug }}"
          else
            git commit -m "chore: backfill durations for ${{ matrix.slug }} [skip ci]"
            # Retry push up to 5 times to handle parallel-job collisions
            for i in 1 2 3 4 5; do
              sleep $((RANDOM % 10 + 1))
              git pull --rebase --autostash origin main && git push && break
              echo "Push attempt $i failed, retrying…"
            done
          fi
