name: Backfill Episode Durations

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *'   # 01h30 Israel (UTC+3) chaque nuit

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        slug:
          - rav-itshak-cohen
          - rav-yonathan-mergui
          - rav-yaakov-sitruk
          - rav-liran-ishai
          - rav-barak-ben-nissan
          - rav-menahem-sakhoun
          - rabbin-jonas
          - rav-meir-david-shmueli
          - lev
          - rav-paz-shavit
          - beth-habad-tlv-nord
          - torah_fr
          - rav-ruben-attal
          - rav-shimshone-attali

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Deno (for yt-dlp EJS n-challenge solver)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: pip install yt-dlp yt-dlp-ejs

      - name: Write YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
            echo "YOUTUBE_COOKIES_FILE=/tmp/yt_cookies.txt" >> $GITHUB_ENV
          fi

      - name: Backfill durations for ${{ matrix.slug }}
        id: backfill
        run: |
          python - <<'EOF'
          import json, os, subprocess, sys
          from pathlib import Path

          slug = "${{ matrix.slug }}"
          feeds_dir = Path("feeds")
          entries_file = feeds_dir / f"{slug}.entries.json"

          if not entries_file.exists():
              print(f"No entries file for {slug}, skipping.")
              # Write zeros for summary
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"filled=0\nremaining=0\ntotal=0\n")
              sys.exit(0)

          entries = json.loads(entries_file.read_text(encoding="utf-8"))
          missing_before = [ep for ep in entries if not ep.get("duration_secs")]
          print(f"{slug}: {len(missing_before)} missing out of {len(entries)} total")

          if not missing_before:
              print("All durations already present, nothing to do.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"filled=0\nremaining=0\ntotal={len(entries)}\n")
              sys.exit(0)

          cookies_file = os.environ.get("YOUTUBE_COOKIES_FILE", "")
          filled = 0

          for ep in missing_before:
              vid = ep.get("video_id")
              if not vid:
                  continue
              url = f"https://www.youtube.com/watch?v={vid}"
              cmd = ["yt-dlp", "--print", "%(duration)s", "--skip-download", "--no-warnings"]
              if cookies_file and Path(cookies_file).exists():
                  cmd += ["--cookies", cookies_file]
              cmd.append(url)
              try:
                  out = subprocess.check_output(cmd, text=True, stderr=subprocess.DEVNULL, timeout=30).strip()
                  dur = int(out) if out and out != "NA" else 0
                  if dur > 0:
                      ep["duration_secs"] = dur
                      filled += 1
                      print(f"  {vid}: {dur}s")
              except Exception as e:
                  print(f"  {vid}: skipped ({e})", file=sys.stderr)

          remaining = len([ep for ep in entries if not ep.get("duration_secs")])

          if filled > 0:
              tmp = entries_file.with_suffix(".tmp")
              tmp.write_text(json.dumps(entries, ensure_ascii=False, indent=2), encoding="utf-8")
              tmp.replace(entries_file)
              print(f"Saved {entries_file.name} — filled {filled}, remaining {remaining}")
          else:
              print(f"No durations updated — remaining {remaining}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"filled={filled}\nremaining={remaining}\ntotal={len(entries)}\n")
          EOF

      - name: Commit results for ${{ matrix.slug }}
        run: |
          git config --global user.name  "Podcast Bot"
          git config --global user.email "action@github.com"
          git add feeds/${{ matrix.slug }}.entries.json
          if git diff --staged --quiet; then
            echo "Nothing to commit for ${{ matrix.slug }}"
          else
            git commit -m "chore: backfill durations for ${{ matrix.slug }} [skip ci]"
            for i in 1 2 3 4 5; do
              sleep $((RANDOM % 10 + 1))
              git pull --rebase --autostash origin main && git push && break
              echo "Push attempt $i failed, retrying…"
            done
          fi

  summary:
    name: Rapport durées
    runs-on: ubuntu-latest
    needs: backfill
    if: always()
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Générer le rapport
        run: |
          python - << 'PYEOF'
          import json, glob, os
          from pathlib import Path

          feeds = sorted(glob.glob("feeds/*.entries.json"))
          total_eps = 0; total_missing = 0
          rows = []

          for f in feeds:
              slug = Path(f).stem.replace('.entries', '')
              try:
                  eps = json.loads(open(f, encoding='utf-8').read())
              except:
                  continue
              n = len(eps)
              m = sum(1 for e in eps if not e.get('duration_secs'))
              done = n - m
              pct_done = int(100 * done / n) if n else 0
              total_eps += n; total_missing += m
              bar = '🟩' * (pct_done // 10) + '⬜' * (10 - pct_done // 10)
              rows.append((slug, done, n, m, pct_done, bar))

          total_done = total_eps - total_missing
          pct_total = int(100 * total_done / total_eps) if total_eps else 0

          out = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/stdout')
          with open(out, 'w', encoding='utf-8') as f:
              f.write('# 🎙️ Backfill Durées — Rapport\n\n')
              f.write(f'**Progression globale : {total_done}/{total_eps} ({pct_total}%)**\n\n')
              f.write(f'{"🟩" * (pct_total // 10)}{"⬜" * (10 - pct_total // 10)} {pct_total}%\n\n')
              f.write('| Chaîne | Complétés | Total | Manquants | % |\n')
              f.write('|--------|-----------|-------|-----------|---|\n')
              for slug, done, n, m, pct, bar in rows:
                  status = '✅' if m == 0 else ('🔄' if pct >= 50 else '⏳')
                  f.write(f'| {status} {slug} | {done} | {n} | {m} | {bar} {pct}% |\n')
              f.write(f'\n> Run du {__import__("datetime").datetime.utcnow().strftime("%Y-%m-%d %H:%M")} UTC\n')
          PYEOF
