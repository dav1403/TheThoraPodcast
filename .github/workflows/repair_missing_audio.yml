name: Update Podcast Feeds

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'manual'
      process_budget:
        description: 'Budget for new-episode processing (manual runs only)'
        required: false
        default: '30'
      backfill_budget_override:
        description: 'Override historical backfill budget; blank = use remaining budget from process step'
        required: false
        default: ''
  schedule:
    - cron: '37 * * * *'
    - cron: '7 * * * *'

# Off main (a staging dispatch on a branch) the group is suffixed: a test run
# can never take the place of a pending production run, nor wait behind one.
concurrency:
  group: podcast-pipeline${{ github.ref != 'refs/heads/main' && '-staging' || '' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Per-run download budget (new episodes first, remainder handed to backfill).
  # Raised 15 -> 30 on 2026-07-08 to drain the missing-audio backlog faster after
  # new channels were added. Sizing rationale: a run is ~6 min fixed overhead +
  # ~0.8-1.9 min/downloaded item, so budget 30 lands a typical run around 40-45 min
  # and a worst case around ~65 min. That keeps the usual run under the 60-min cron
  # interval, which matters because the `podcast-pipeline` concurrency group queues
  # (does not cancel) an overrun behind the next hourly cron and GitHub then drops
  # scheduled runs — so bloating the budget past ~50-min runs would cost us runs/day
  # and partly cancel out the gain. Bump higher only after confirming runs stay well
  # under ~50 min. Single source of truth; override per-run via the
  # workflow_dispatch "process_budget" input.
  PROCESS_BUDGET_DEFAULT: '30'
  # Phase 4: the state lives in R2 (scripts/site_state.py), not in git.
  # Off main, every key lives under _state-staging/ — a branch run can never
  # write the production state.
  TTP_STATE_PREFIX: ${{ github.ref == 'refs/heads/main' && '_state/' || '_state-staging/' }}
  TTP_SNAPSHOT_PREFIX: ${{ github.ref == 'refs/heads/main' && '_state-snapshots/' || '_state-staging-snapshots/' }}
  TTP_IS_PROD: ${{ github.ref == 'refs/heads/main' }}
  R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
  R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}

jobs:
  update:
    runs-on: ubuntu-latest
    # The state lease (below) is taken for 200 min: the job must always end
    # before it expires, or a waiting writer could take it over mid-run.
    timeout-minutes: 190

    steps:
      # Source only: the state comes from R2 (below), the generated pages are
      # rebuilt by deploy-site. Depth 1 + blobless + sparse: seconds instead
      # of the full-history checkout of the git-state era.
      - name: Checkout source (sparse, depth 1)
        uses: actions/checkout@v7
        with:
          # The branch as it stands at execution time (a run delayed in the
          # concurrency queue must not run stale scripts).
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /channels.json
            /speakers.json
            /scripts/
            /requirements.txt

      - name: Widen to the whole SOURCE tree (state and generated outputs excluded)
        run: |
          python3 scripts/site_state.py sparse-patterns --channels channels.json --speakers speakers.json > "$RUNNER_TEMP/sparse.txt"
          git sparse-checkout set --no-cone --stdin < "$RUNNER_TEMP/sparse.txt"
          echo "source files: $(git ls-files | wc -l)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate channels.json (fail fast on broken JSON)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if err=$(python -c "import json; json.load(open('channels.json', encoding='utf-8-sig'))" 2>&1); then
            echo "channels.json is valid JSON"
          else
            echo "::error::channels.json is invalid JSON — halting pipeline before deploy"
            echo "$err"
            TITLE="🔴 channels.json invalid — pipeline halted"
            BODY=$(printf 'channels.json failed JSON validation. Pipeline stopped before touching feeds/site.\n\n```\n%s\n```\n\nFix the JSON, push, next run recovers.\nRun: %s/%s/actions/runs/%s' "$err" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
            [ "$TTP_IS_PROD" = "true" ] || exit 1  # staging: red run, no production issue
            EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null)
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "$BODY" 2>/dev/null || true
            else
              gh issue create --title "$TITLE" --body "$BODY" --label bug 2>/dev/null || true
            fi
            exit 1
          fi

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Deno (for yt-dlp EJS n-challenge solver)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install boto3 early (state lease + restore)
        run: python -m pip install --quiet boto3

      # Git used to serialise the writers (a stale push was refused); R2 does
      # not, so every state writer takes this lease first (If-None-Match on
      # <prefix>_lock.json). Waits for e.g. the nightly duration backfill.
      - name: Take the state lease
        id: lease
        run: python scripts/site_state.py lock acquire --ttl-minutes 200 --wait-minutes 60

      # The state of the previous run, MD5-verified. Mandatory: without it the
      # run would start from nothing and the push guard would refuse it.
      - name: Restore the state from R2
        id: restore
        run: python scripts/site_state.py pull --dest . --record "$RUNNER_TEMP/state-record.json"

      - name: Ensure feeds/ directory exists
        run: mkdir -p feeds

      - name: Save pre-run feed counts
        run: python scripts/ci_pre_run_counts.py

      - name: Write YouTube cookies (rotating pool, single-cookie fallback)
        # Picks one cookie from YOUTUBE_COOKIES_POOL (many accounts concatenated,
        # separated by a line "-----COOKIE-----"), rotating by run number so each
        # account is used only occasionally. Falls back to the single
        # YOUTUBE_COOKIES secret when the pool is absent/empty/malformed. See
        # docs/SCALING-INGESTION.md for the pool format.
        env:
          YOUTUBE_COOKIES_POOL: ${{ secrets.YOUTUBE_COOKIES_POOL }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          COOKIE_ROTATION_INDEX: ${{ github.run_number }}
          # Hosted lane uses offset 0; the self-hosted lane uses offset 1 so the
          # two lanes pick different cookies at the same time slot.
          COOKIE_ROTATION_OFFSET: '0'
        run: |
          python scripts/select_cookie_from_pool.py --output /tmp/yt_cookies.txt
          if [ -s /tmp/yt_cookies.txt ]; then
            echo "YOUTUBE_COOKIES_FILE=/tmp/yt_cookies.txt" >> $GITHUB_ENV
          fi

      - name: Generate channel artwork (3000x3000 PNG for Apple Podcasts)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          mkdir -p artwork
          python scripts/generate_artwork.py

      # The masters above are 0.5-5 MB each (55 MB for the roster) because Apple
      # requires >= 1400 px. The site and the app display them in <= 104 px slots
      # and GitHub Pages offers no CDN resizing, so the 256 px variant has to be
      # built and committed here. Idempotent: only re-encodes changed artwork.
      - name: Build artwork thumbnails (256px WebP for site + mobile app)
        run: python scripts/build_artwork_thumbs.py

      - name: Sync external RSS channels
        run: python scripts/sync_rss_channels.py

      - name: Bootstrap new channels (backfill last 10 episodes if feed missing)
        env:
          YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:          ${{ github.repository }}
          R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}
        run: |
          touch processed.json
          python scripts/ci_bootstrap_all.py

      - name: Run podcast update (new episodes)
        env:
          YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:          ${{ github.repository }}
          R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}
        run: |
          PROCESS_BUDGET='${{ github.event.inputs.process_budget }}'
          if [ -z "$PROCESS_BUDGET" ]; then
            PROCESS_BUDGET="${PROCESS_BUDGET_DEFAULT:-15}"
          fi
          echo "Process budget: $PROCESS_BUDGET"
          python scripts/process_podcasts.py --budget "$PROCESS_BUDGET"

      - name: Run backfill (historical episodes with remaining budget)
        env:
          YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:          ${{ github.repository }}
          R2_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}
        run: |
          BUDGET='${{ github.event.inputs.backfill_budget_override }}'
          if [ -z "$BUDGET" ]; then
            BUDGET=$(cat /tmp/backfill_budget 2>/dev/null || echo 0)
          fi
          echo "Backfill budget: $BUDGET"
          python scripts/backfill_podcasts.py --budget "$BUDGET"

      # A title is read once, at ingestion: a class published as "24 août 2026"
      # and renamed on YouTube later kept its date title everywhere. This pass
      # re-reads the date-only titles (~160 videos, ~4 quota units), applies the
      # renames to entries.json + the channel RSS (guid = video id: platforms
      # update in place), and records the old page name for a redirect stub.
      # After process/backfill (they rewrite entries/RSS), before the generator
      # (it derives the speaker feeds and pages from the renamed entries).
      # Never blocks the run.
      - name: Resync date-only titles renamed on YouTube
        env:
          YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:          ${{ github.repository }}
        run: |
          python scripts/title_resync.py || echo "WARNING - title resync failed, continuing"

      - name: Tag untagged episodes with AI themes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/tag_episodes.py || echo "WARNING: tagging failed (API credits?), continuing"

      - name: Fetch episode transcripts (auto-captions from YouTube)
        env:
          YOUTUBE_COOKIES_FILE: ${{ env.YOUTUBE_COOKIES_FILE }}
        run: python scripts/fetch_transcripts.py --budget 50

      - name: Track ingestion volume (watchdog for "green but empty" runs)
        id: ingest
        run: python scripts/ci_ingest_watchdog.py

      - name: Generate per-channel HTML pages and update sitemap
        run: python scripts/generate_channel_pages.py

      # Full-text search INSIDE the classes. Rebuilds the sharded inverted index
      # over feeds/transcripts/ (~16 000 files, ~500 MB) in ~2 min. The step is
      # self-gating: it exits in a second when the corpus is unchanged, and
      # --min-interval-hours caps how often ~22 MB of shards churn in git (the
      # index is committed, like sitemap.xml and search-index.json). Lower it to
      # 0 to make every new transcript searchable within the hour.
      - name: Build transcript full-text search index
        run: python scripts/build_transcript_index.py --min-interval-hours 6

      # Replaces the git commit: the new generation of the state goes to R2,
      # compare-and-swap on the manifest, refused if any entries.json lost
      # episodes or a feed disappeared (anti-loss guard). Mandatory: a failure
      # is a red run. Daily snapshot (+ transcripts on Sundays).
      # The site is rebuilt and published by deploy-site.yml (workflow_run).
      - name: Push the new state to R2 (anti-loss guard, CAS)
        id: push
        timeout-minutes: 30
        run: |
          python scripts/site_state.py push --root . --base-record "$RUNNER_TEMP/state-record.json"             --snapshot --snapshot-copy "$RUNNER_TEMP/snapshot/state.tar.gz"

      - name: Snapshot retention (30 days, 90 with transcripts)
        if: steps.push.outcome == 'success'
        continue-on-error: true
        run: python scripts/site_state.py prune-snapshots

      # Independent of R2: the day's snapshot (state minus transcripts) kept
      # 90 days by GitHub. Only present on the first run of the UTC day.
      - name: Keep the day's snapshot as a GitHub artefact (90 days)
        if: steps.push.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: state-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/snapshot/state.tar.gz
          retention-days: 90
          compression-level: 0
          if-no-files-found: ignore

      - name: Release the state lease
        if: always() && steps.lease.outcome == 'success'
        run: python scripts/site_state.py lock release

      - name: Alert if YouTube auth error detected
        if: always() && env.TTP_IS_PROD == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/auth_error ]; then
            echo "No YouTube auth error detected."
            # Auto-resolve: if a previous run opened a cookies-expired issue and the
            # cookies are working again, close it so stale "auth error" issues don't
            # linger (real case: #10 stayed open 5 days after recovery).
            # Same search string as the idempotence check below. Idempotent (no open
            # issue -> no-op) and best-effort (never fail the run on a GitHub API hiccup).
            OPEN=$(gh issue list --state open --search 'YouTube auth error in:title' \
              --json number --jq '.[0].number // empty' 2>/dev/null) || OPEN=""
            if [ -n "$OPEN" ]; then
              COMMENT=$(printf 'Auto-résolu : cookies YouTube de nouveau OK au run %s\n\n%s/%s/actions/runs/%s' \
                "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
              if gh issue close "$OPEN" --comment "$COMMENT" 2>/dev/null; then
                echo "Closed stale auth-error issue #$OPEN (cookies recovered)."
              else
                echo "Could not auto-close issue #$OPEN (best-effort) — leaving it open."
              fi
            fi
            exit 0
          fi

          ERROR=$(cat /tmp/auth_error)
          echo "::warning::YouTube auth error detected - cookies may be expired"

          # Idempotence: don't open a new issue on every hourly run if one is already open.
          # (`// empty` so a missing match yields an empty string, not the literal "null".)
          EXISTING=$(gh issue list --state open --search 'YouTube auth error in:title' \
            --json number --jq '.[0].number // empty') || EXISTING=""
          if [ -n "$EXISTING" ]; then
            echo "Auth-error issue already open (#$EXISTING) — not creating a duplicate."
            exit 0
          fi

          BODY=$(printf 'CI detected a YouTube auth error. Cookies may need refreshing.\n\nError:\n%s\n\nRun: %s/%s/actions/runs/%s' \
            "$ERROR" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")

          # Fail loudly: no `2>/dev/null`, no `|| true`. A silent failure here means
          # expired cookies with nobody notified (the exact bug we are fixing).
          if ! gh issue create \
                --title "YouTube auth error - cookies may be expired" \
                --body "$BODY" \
                --label "bug"; then
            echo "::error::YouTube cookies are expired AND the alert issue could not be created (see gh output above — check the job's issues:write permission and the 'bug' label)."
            exit 1
          fi
          echo "Opened a new GitHub issue for the YouTube auth error."

      - name: Alert if Anthropic credits exhausted (theme tagging)
        if: always() && env.TTP_IS_PROD == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/anthropic_credit_error ]; then
            echo "No Anthropic credit/quota error detected."
            exit 0
          fi

          ERROR=$(cat /tmp/anthropic_credit_error)
          echo "::warning::Anthropic API credits/quota exhausted - theme tagging skipped"

          # Idempotence: don't open a new issue on every hourly run if one is already open.
          EXISTING=$(gh issue list --state open --search 'Anthropic credits exhausted in:title' \
            --json number --jq '.[0].number // empty') || EXISTING=""
          if [ -n "$EXISTING" ]; then
            echo "Credit-error issue already open (#$EXISTING) — not creating a duplicate."
            exit 0
          fi

          BODY=$(printf 'CI could not tag episodes with AI themes: the Anthropic API rejected the request for billing reasons (credits/quota exhausted). Top up at https://console.anthropic.com/settings/billing\n\nError:\n%s\n\nRun: %s/%s/actions/runs/%s' \
            "$ERROR" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")

          # Fail loudly (no `2>/dev/null`, no `|| true`): a silent failure here
          # means exhausted credits with nobody notified — the bug we are fixing.
          if ! gh issue create \
                --title "Anthropic credits exhausted - theme tagging skipped" \
                --body "$BODY" \
                --label "bug"; then
            echo "::error::Anthropic credits exhausted AND the alert issue could not be created (check the job's issues:write permission and the 'bug' label)."
            exit 1
          fi
          echo "Opened a new GitHub issue for the Anthropic credit error."

      - name: Alert if ingestion has been stuck at zero
        if: always() && env.TTP_IS_PROD == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADDED: ${{ steps.ingest.outputs.added }}
          PENDING: ${{ steps.ingest.outputs.pending }}
          ZERO_STREAK: ${{ steps.ingest.outputs.zero_streak }}
        run: |
          # A run can be green and still download nothing (per-episode errors are
          # caught; expired cookies give silent 403s). One zero run is normal, so we
          # only alert after THRESHOLD consecutive zero runs *while work is pending*.
          # The streak is computed and persisted by scripts/ci_ingest_watchdog.py in
          # feeds/ingest_state.json (staged by the `git add feeds/` above).
          THRESHOLD=3
          TITLE="⚠️ Ingestion à zéro"
          if [ -z "$ZERO_STREAK" ]; then
            echo "Watchdog step did not run (earlier failure) — nothing to evaluate."
            exit 0
          fi
          echo "added=$ADDED pending=$PENDING zero_streak=$ZERO_STREAK (threshold $THRESHOLD)"

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty' 2>/dev/null) || EXISTING=""

          if [ "$ZERO_STREAK" -lt "$THRESHOLD" ]; then
            # Recovered: close a previously opened alert so it does not linger.
            if [ "$ZERO_STREAK" -eq 0 ] && [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Auto-résolu : $ADDED épisode(s) ingéré(s) au run ${{ github.run_id }}." 2>/dev/null \
                && echo "Closed stale ingestion issue #$EXISTING." \
                || echo "Could not auto-close issue #$EXISTING (best-effort)."
            fi
            exit 0
          fi

          echo "::warning::No episode ingested for $ZERO_STREAK consecutive runs while $PENDING episode(s) are pending."
          BODY=$(printf 'Le pipeline est vert mais **n'"'"'ingère plus rien** depuis **%s runs consécutifs**, alors que **%s épisode(s)** restent à récupérer.\n\nCauses probables : cookies YouTube expirés (403 silencieux), yt-dlp cassé, quota API, R2 injoignable.\n\nÀ vérifier : logs des steps « Run podcast update » / « Run backfill », secret `YOUTUBE_COOKIES_POOL`.\n\nRun : %s/%s/actions/runs/%s' \
            "$ZERO_STREAK" "$PENDING" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY" && echo "Commented on existing issue #$EXISTING."
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "bug" && echo "Opened ingestion-zero issue."
          fi

      - name: Generate run summary
        if: always()
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/generate_summary.py >> $GITHUB_STEP_SUMMARY

      # LAST STEP, on purpose. process_podcasts.py isolates a failing channel
      # (logs it in the ledger, exits 0) so the other channels are processed,
      # the state is pushed to R2 and deploy-site rebuilds the site (it runs on
      # "success" and "failure"). Incident 21-22/10/2026: one channel's exit 1
      # skipped every later step for 6 h. The failure must still not hide
      # behind a green run: this step annotates each channel error, adds a
      # table to the summary and turns the run red, after publication.
      - name: Fail the run if a channel errored (after publication)
        if: always()
        run: python3 scripts/channel_errors.py check
