name: Update Podcast Feeds

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure feeds/ directory exists
        run: mkdir -p feeds

      - name: Write YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > /tmp/yt_cookies.txt
            echo "YOUTUBE_COOKIES_FILE=/tmp/yt_cookies.txt" >> $GITHUB_ENV
          fi

      - name: Bootstrap new channels (backfill last 10 episodes if feed missing)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:     ${{ github.repository }}
        run: |
          touch processed.json
          python - <<'EOF'
          import json
          from pathlib import Path
          import subprocess
          import sys

          channels = json.loads(Path("channels.json").read_text())
          for ch in channels:
              if not ch.get("enabled", True):
                  continue
              entries_file = Path(f"feeds/{ch['slug']}.entries.json")
              needs_bootstrap = (
                  not entries_file.exists() or
                  json.loads(entries_file.read_text() or "[]") == []
              )
              if needs_bootstrap:
                  print(f"Bootstrapping {ch['slug']}...")
                  result = subprocess.run(
                      [sys.executable, "scripts/bootstrap_channel.py", "--slug", ch["slug"], "--max", "10"],
                      capture_output=False
                  )
                  if result.returncode != 0:
                      print(f"Bootstrap failed for {ch['slug']}")
          EOF

      - name: Run podcast update
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:     ${{ github.repository }}
        run: python scripts/process_podcasts.py

      - name: Commit and push updated feeds
        run: |
          git config --global user.name  "Podcast Bot"
          git config --global user.email "action@github.com"
          git add feeds/ processed.json
          git diff --staged --quiet || git commit -m "chore: update podcast feeds [skip ci]"
          git push
