name: Social Media Posts

on:
  schedule:
    - cron: '0 8 * * 1'   # Monday    08:00 UTC — Zoom Rabbi
    - cron: '0 8 * * 3'   # Wednesday 08:00 UTC — Zoom Thème
    - cron: '0 7 * * 5'   # Friday    07:00 UTC — Paracha (avant Shabbat)
  workflow_dispatch:
    inputs:
      type:
        description: 'Post type (rabbi, theme, paracha, new_rabbi, or empty for auto)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: true or false'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONIOENCODING: utf-8

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # Full history: the commit step rebases onto main to survive a race with
          # the hourly pipeline, and rebasing on a depth-1 shallow clone is unsafe.
          # BUT the repo carries ~28 Go of regenerated artefacts in its history, so
          # a plain fetch-depth: 0 fills the runner disk and hangs forever.
          # filter: blob:none = blobless partial clone: all commits/trees, zero
          # historical blobs. Git hydrates the few blobs it actually needs on
          # demand (checkout of HEAD, pull --rebase), so the rebase-retry below
          # keeps working.
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (social_post)
        # Fast, network-free guard (Hebcal and Meta are mocked). Runs before
        # posting so a broken reading resolver never reaches the Friday post.
        run: |
          pip install pytest
          python -m pytest tests/test_social_post.py -q

      - name: Run social post
        id: post
        # Fails the job (exit 1) when a configured channel fails (e.g. Meta
        # token expired), when the weekly reading cannot be determined, or when
        # no channel is configured. The per-channel table (OK / NON CONFIRMÉ /
        # ÉCHEC) is written to the run summary ($GITHUB_STEP_SUMMARY).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_ID:        ${{ secrets.META_PAGE_ID }}
          FB_ACCESS_TOKEN:   ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          IG_USER_ID:        ${{ secrets.META_IG_ACCOUNT_ID }}
          MAKE_WEBHOOK_URL:  ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          TYPE_ARG=""
          DRY_ARG=""
          if [ -n "${{ github.event.inputs.type }}" ]; then
            TYPE_ARG="--type ${{ github.event.inputs.type }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          python scripts/social_post.py $TYPE_ARG $DRY_ARG

      - name: Alert if Anthropic credits exhausted (social copy)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/anthropic_credit_error ]; then
            echo "No Anthropic credit/quota error detected."
            exit 0
          fi

          ERROR=$(cat /tmp/anthropic_credit_error)
          echo "::warning::Anthropic API credits/quota exhausted - social copy fell back to canned text"

          EXISTING=$(gh issue list --state open --search 'Anthropic credits exhausted in:title' \
            --json number --jq '.[0].number // empty') || EXISTING=""
          if [ -n "$EXISTING" ]; then
            echo "Credit-error issue already open (#$EXISTING) — not creating a duplicate."
            exit 0
          fi

          BODY=$(printf 'CI (social posts) could not generate post copy with AI: the Anthropic API rejected the request for billing reasons (credits/quota exhausted). The post went out with fallback text. Top up at https://console.anthropic.com/settings/billing\n\nError:\n%s\n\nRun: %s/%s/actions/runs/%s' \
            "$ERROR" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")

          if ! gh issue create \
                --title "Anthropic credits exhausted - social copy skipped" \
                --body "$BODY" \
                --label "bug"; then
            echo "::error::Anthropic credits exhausted AND the alert issue could not be created (check issues:write permission and the 'bug' label)."
            exit 1
          fi
          echo "Opened a new GitHub issue for the Anthropic credit error."

      - name: Commit updated social state
        # Also after a failed post: the script saves the rotation state and
        # last_posted even when a channel fails, so a partial success is not
        # re-posted on the next run.
        if: ${{ !cancelled() && steps.post.outcome != 'skipped' }}
        run: |
          git config --global user.name  "Podcast Bot"
          git config --global user.email "action@github.com"
          git add social_state.json
          git diff --staged --quiet || git commit -m "chore: update social post state [skip ci]"
          git pull --rebase origin main
          git push
