name: Social Media Posts

on:
  schedule:
    - cron: '0 8 * * 1'   # Monday    08:00 UTC — Zoom Rabbi
    - cron: '0 8 * * 3'   # Wednesday 08:00 UTC — Zoom Thème
    - cron: '0 7 * * 5'   # Friday    07:00 UTC — Paracha (avant Shabbat)
    - cron: '15 11 26 5 *' # one-time: 2026-05-26 11:15 UTC
  workflow_dispatch:
    inputs:
      type:
        description: 'Post type (rabbi, theme, paracha, new_rabbi, or empty for auto)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: true or false'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONIOENCODING: utf-8

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run social post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_ID:        ${{ secrets.META_PAGE_ID }}
          FB_ACCESS_TOKEN:   ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          IG_USER_ID:        ${{ secrets.META_IG_ACCOUNT_ID }}
        run: |
          TYPE_ARG=""
          DRY_ARG=""
          if [ "${{ github.event.schedule }}" = "15 11 26 5 *" ]; then
            TYPE_ARG="--type rabbi"
          elif [ -n "${{ github.event.inputs.type }}" ]; then
            TYPE_ARG="--type ${{ github.event.inputs.type }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          python scripts/social_post.py $TYPE_ARG $DRY_ARG

      - name: Commit updated social state
        run: |
          git config --global user.name  "Podcast Bot"
          git config --global user.email "action@github.com"
          git add social_state.json
          git diff --staged --quiet || git commit -m "chore: update social post state [skip ci]"
          git pull --rebase origin main
          git push
