<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Torah Podcast</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: #0b0b0f; color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 2rem calc(1.5rem + env(safe-area-inset-left)) 2rem calc(1.5rem + env(safe-area-inset-right));
      gap: 1rem;
    }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
    p { margin: 0; max-width: 30ch; line-height: 1.55; color: #a1a1aa; font-size: 0.95rem; }
    button {
      margin-top: 0.75rem;
      background: #f4f4f5; color: #0b0b0f;
      border: 0; border-radius: 999px;
      padding: 0.8rem 1.75rem;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.75; }
    small { color: #52525b; font-size: 0.75rem; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>The Torah Podcast</h1>
    <p>Connexion indisponible. L'application a besoin d'Internet pour charger les cours.</p>
    <button type="button" onclick="location.replace('https://thetorahpodcast.net')">Reessayer</button>
    <small>thetorahpodcast.net</small>
  </main>
</body>
</html>
