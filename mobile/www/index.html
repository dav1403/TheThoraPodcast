<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Torah Podcast</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%;
        background: #1a1a2e; color: #f5f5f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 1rem; text-align: center; padding: 2rem;
      }
      h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
      p { margin: 0; opacity: .75; font-size: .95rem; line-height: 1.5; }
      .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: #f5f5f0; opacity: .35;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { opacity: .2; transform: scale(.8) } 50% { opacity: .8; transform: scale(1.2) } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="dot"></div>
      <h1>The Torah Podcast</h1>
      <p>Chargement…</p>
    </div>
    <script>
      // Bundled shell. In production the native app loads
      // https://thetorahpodcast.net directly (see capacitor.config.ts > server.url),
      // so this page is normally never displayed. If it is (e.g. the config was
      // built without a remote URL), send the user to the live site.
      setTimeout(function () {
        location.replace('https://thetorahpodcast.net/');
      }, 400);
    </script>
  </body>
</html>
