<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hors connexion — The Torah Podcast</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%;
        background: #1a1a2e; color: #f5f5f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 1.25rem; text-align: center; padding: 2rem;
      }
      h1 { font-size: 1.35rem; font-weight: 600; margin: 0; }
      p { margin: 0; max-width: 26rem; opacity: .75; font-size: .95rem; line-height: 1.55; }
      button {
        margin-top: .5rem;
        border: 1px solid rgba(245,245,240,.35);
        background: transparent; color: #f5f5f0;
        padding: .7rem 1.6rem; border-radius: 999px;
        font-size: .95rem; font-family: inherit;
        cursor: pointer;
      }
      button:active { background: rgba(245,245,240,.12); }
      .status { font-size: .8rem; opacity: .5; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Pas de connexion</h1>
      <p>
        Impossible de joindre <strong>thetorahpodcast.net</strong>.
        Vérifiez votre connexion internet, puis réessayez.
      </p>
      <button type="button" id="retry">Réessayer</button>
      <div class="status" id="status"></div>
    </div>
    <script>
      var SITE = 'https://thetorahpodcast.net/';
      var statusEl = document.getElementById('status');

      function retry() {
        statusEl.textContent = 'Connexion…';
        // navigator.onLine is unreliable on its own; do a real request.
        fetch(SITE, { method: 'HEAD', cache: 'no-store', mode: 'no-cors' })
          .then(function () { location.replace(SITE); })
          .catch(function () { statusEl.textContent = 'Toujours hors connexion.'; });
      }

      document.getElementById('retry').addEventListener('click', retry);
      window.addEventListener('online', retry);
    </script>
  </body>
</html>
