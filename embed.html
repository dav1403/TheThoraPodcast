<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){var t;try{t=localStorage.getItem('ttp_theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}document.documentElement.setAttribute('data-theme',t)})();</script>
  <title>The Torah Podcast — Widget</title>
  <style>
    :root {
      /* Page */
      --color-bg: #f5f5f0;
      --color-surface: #fff;
      --color-surface-alt: #eee;
      --color-text: #222;
      --color-text-secondary: #333;
      --color-text-tertiary: #555;
      --color-text-muted: #666;
      --color-text-subtle: #888;
      --color-text-faint: #999;
      --color-text-disabled: #aaa;
      --color-border: #ddd;
      --color-border-soft: #e0e0e0;
      /* Accent */
      --color-accent: #e87722;
      --color-on-accent: #fff;
      /* Inverse surfaces (dark header, footer, menus) */
      --color-inverse-bg: #1a1a2e;
      --color-inverse-surface: #252545;
      --color-inverse-heading: #aab;
      --color-on-inverse: #fff;
      --color-on-inverse-soft: rgba(255,255,255,.78);
      --color-on-inverse-muted: rgba(255,255,255,.65);
      --color-on-inverse-dim: rgba(255,255,255,.6);
      --color-inverse-border: rgba(255,255,255,.2);
      --color-inverse-border-strong: rgba(255,255,255,.35);
      --color-inverse-border-soft: rgba(255,255,255,.15);
      --color-inverse-border-faint: rgba(255,255,255,.12);
      --color-inverse-hover: rgba(255,255,255,.1);
      --color-inverse-hover-soft: rgba(255,255,255,.12);
      --color-inverse-tint: rgba(255,255,255,.05);
      --color-inverse-scrim: rgba(255,255,255,.5);
      /* Elevation */
      --shadow-card: rgba(0,0,0,.08);
      --shadow-card-soft: rgba(0,0,0,.06);
      --shadow-overlay: rgba(0,0,0,.5);
      /* Light-surface roles added for the dark theme */
      --color-heading: #1a1a2e;
      --color-text-body: #444;
      --color-text-soft: #777;
      --color-border-strong: #ccc;
      --color-border-hover: #bbb;
      --color-divider: #f0f0f0;
      --color-surface-muted: #f0f0f0;
      --color-surface-sunken: #fafafa;
      --color-skeleton: #e8e8e8;
      --color-surface-warm: #fbfaf7;
      --color-surface-tag: #f0f0e8;
      --color-text-hint: #bbb;
      --color-surface-cream: #faf6f0;
      --color-border-cream: #f0e6d8;
      --color-surface-hover: #f0f0ea;
      --color-surface-muted-hover: #e2e2e2;
      --color-badge-bg: #eceaf6;
      --color-badge-text: #6a5acd;
      --color-mark-bg: #ffe9d2;
      --color-mark-text: #b4530a;
      --color-primary: #1a1a2e;
      --color-primary-hover: #2d2d50;
      /* Secondary-page roles (paracha, limud yomi, legal, embed...) */
      --color-border-card: #e8e8e3;
      --color-border-warm: #e4e4dc;
      --color-border-sand: #e2ddd0;
      --color-divider-soft: #f5f5f5;
      --color-divider-warm: #f0f0eb;
      --color-divider-alt: #eee;
      --color-surface-warm-hover: #faf8f3;
      --color-surface-cool-hover: #f7f7f9;
      --color-surface-cool-hover-alt: #f4f4f8;
      --color-surface-accent-soft: #fff8f3;
      --color-primary-tint: rgba(26,26,46,.06);
      --color-primary-tint-strong: rgba(26,26,46,.12);
      --color-text-gold: #9a7a3a;
      --color-text-sand: #4a3f2a;
      --color-text-pale: #ccc;
    }
    /* Dark theme — set by the inline head script from TTPPrefs `theme`
       (auto | light | dark; auto follows prefers-color-scheme). */
    [data-theme="dark"] {
      color-scheme: dark;
      --color-bg: #0d0d1a;
      --color-surface: #1a1a2e;
      --color-surface-alt: #252545;
      --color-text: #f6f6fa;
      --color-text-secondary: #e4e4ee;
      --color-text-tertiary: #c8c8da;
      --color-text-muted: #b4b4cc;
      --color-text-subtle: #a6a6c2;
      --color-text-faint: #9c9cb8;
      --color-text-disabled: #8c8caa;
      --color-border: #34345a;
      --color-border-soft: #2c2c4e;
      --color-inverse-bg: #14142a;
      --shadow-card: rgba(0,0,0,.35);
      --shadow-card-soft: rgba(0,0,0,.3);
      --color-heading: #f6f6fa;
      --color-text-body: #d2d2e2;
      --color-text-soft: #aeaec8;
      --color-border-strong: #4a4a74;
      --color-border-hover: #5a5a86;
      --color-divider: #26264a;
      --color-surface-muted: #252545;
      --color-surface-sunken: #151529;
      --color-skeleton: #2a2a4a;
      --color-surface-warm: #1f1f36;
      --color-surface-tag: #2a2a48;
      --color-text-hint: #9494b2;
      --color-surface-cream: #22223a;
      --color-border-cream: #3a3452;
      --color-surface-hover: #252545;
      --color-surface-muted-hover: #303056;
      --color-badge-bg: #2e2a52;
      --color-badge-text: #c0b6f4;
      --color-mark-bg: rgba(232,119,34,.22);
      --color-mark-text: #ffc79a;
      --color-primary: #3d3d6e;
      --color-primary-hover: #4c4c82;
      --color-border-card: #34345a;
      --color-border-warm: #34345a;
      --color-border-sand: #3a3452;
      --color-divider-soft: #26264a;
      --color-divider-warm: #26264a;
      --color-divider-alt: #2c2c4e;
      --color-surface-warm-hover: #252545;
      --color-surface-cool-hover: #252545;
      --color-surface-cool-hover-alt: #252545;
      --color-surface-accent-soft: #2e2236;
      --color-primary-tint: rgba(255,255,255,.06);
      --color-primary-tint-strong: rgba(255,255,255,.12);
      --color-text-gold: #dcbc7c;
      --color-text-sand: #e6dcc6;
      --color-text-pale: #8c8caa;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--color-surface);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      font-size: 14px;
      line-height: 1.4;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .widget-header {
      background: var(--color-inverse-bg);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .ch-art {
      width: 52px; height: 52px;
      border-radius: 8px;
      object-fit: cover;
      background: #333;
      flex-shrink: 0;
    }
    .ch-info { min-width: 0; flex: 1; }
    .ch-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--color-on-inverse);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ch-meta {
      font-size: 0.72rem;
      color: #99a;
      margin-top: 2px;
    }
    .ch-platforms {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .plat-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      border-radius: 50%;
      text-decoration: none;
      flex-shrink: 0;
      transition: opacity .15s;
    }
    .plat-btn:hover { opacity: 0.75; }
    .plat-btn svg { width: 14px; height: 14px; }
    .plat-spotify { background: #1DB954; color: var(--color-on-inverse); }
    .plat-apple   { background: #872EC4; color: var(--color-on-inverse); }
    .plat-deezer  { background: #EF5466; color: var(--color-on-inverse); }
    .plat-rss     { background: var(--color-accent); color: var(--color-on-accent); }

    /* ── Episode list ───────────────────────────────────────── */
    .episode-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      scrollbar-width: thin;
      scrollbar-color: var(--color-border) transparent;
    }
    .episode-list::-webkit-scrollbar { width: 4px; }
    .episode-list::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }

    .ep-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--color-divider);
      cursor: default;
    }
    .ep-item:last-child { border-bottom: none; }
    .ep-thumb {
      width: 60px; height: 40px;
      border-radius: 5px;
      object-fit: cover;
      background: var(--color-skeleton);
      flex-shrink: 0;
    }
    .ep-thumb-ph {
      width: 60px; height: 40px;
      border-radius: 5px;
      background: var(--color-skeleton);
      flex-shrink: 0;
    }
    .ep-body { flex: 1; min-width: 0; }
    .ep-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--color-heading);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .ep-date { font-size: 0.68rem; color: var(--color-text-disabled); }
    .play-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--color-primary);
      color: var(--color-on-inverse);
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s;
    }
    .play-btn:hover { background: var(--color-primary-hover); }
    .play-btn.playing { background: var(--color-accent); }
    .play-btn svg { width: 11px; height: 11px; }

    /* ── Mini player bar ────────────────────────────────────── */
    #mini-player {
      background: var(--color-bg);
      border-top: 1px solid var(--color-divider-alt);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    #mini-player.hidden { display: none; }
    #mini-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--color-heading);
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #mini-audio {
      flex: 2;
      min-width: 80px;
      height: 28px;
      accent-color: var(--color-accent);
    }

    /* ── Footer ─────────────────────────────────────────────── */
    .widget-footer {
      border-top: 1px solid var(--color-divider-alt);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--color-surface);
    }
    .widget-brand {
      font-size: 0.68rem;
      color: var(--color-text-hint);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .widget-brand:hover { color: var(--color-heading); }
    .ep-count { font-size: 0.68rem; color: var(--color-text-pale); }

    /* ── States ─────────────────────────────────────────────── */
    .state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-disabled);
      font-size: 0.85rem;
    }
    .loading-spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--color-border);
      border-top-color: var(--color-text-tertiary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="widget-header" id="widget-header" style="display:none">
  <img class="ch-art" id="ch-art" src="" alt="">
  <div class="ch-info">
    <div class="ch-name" id="ch-name"></div>
    <div class="ch-meta" id="ch-meta"></div>
  </div>
  <div class="ch-platforms" id="ch-platforms"></div>
</div>

<ul class="episode-list" id="episode-list">
  <div class="state">
    <div class="loading-spinner"></div>
    <span id="loading-txt">Chargement…</span>
  </div>
</ul>

<div id="mini-player" class="hidden">
  <div id="mini-title"></div>
  <audio id="mini-audio" controls></audio>
</div>

<div class="widget-footer">
  <a class="widget-brand" href="https://thetorahpodcast.net" target="_blank" rel="noopener">
    🎙 The Torah Podcast
  </a>
  <span class="ep-count" id="ep-count"></span>
</div>

<!-- Shared helpers (escapeHtml, playIcon, pauseIcon, formatDate). Without this
     the embed threw "escapeHtml is not defined" / "playIcon is not defined". -->
<script src="js/utils.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const slug   = params.get('slug') || '';
  const lang   = params.get('lang') || 'fr';
  window.lang  = lang;   // utils.js helpers (formatDate) read window.lang
  const T = (fr, he) => (lang === 'he' ? he : fr);
  document.documentElement.lang = lang === 'he' ? 'he' : 'fr';
  document.documentElement.dir  = lang === 'he' ? 'rtl' : 'ltr';
  { const _lt = document.getElementById('loading-txt'); if (_lt) _lt.textContent = T('Chargement…', 'טוען…'); }

  function platformSVG(name) {
    if (name === 'spotify') return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424a.622.622 0 01-.857.207c-2.348-1.435-5.304-1.76-8.785-.964a.623.623 0 11-.277-1.215c3.809-.87 7.076-.496 9.712 1.115.294.18.387.563.207.857zm1.223-2.72a.78.78 0 01-1.072.257c-2.687-1.652-6.785-2.131-9.965-1.166a.78.78 0 01-.973-.519.781.781 0 01.519-.972c3.632-1.102 8.147-.568 11.234 1.328a.78.78 0 01.257 1.072zm.105-2.83C14.691 8.95 9.375 8.775 6.297 9.71a.937.937 0 11-.543-1.793c3.521-1.068 9.376-.861 13.072 1.332a.937.937 0 01-.912 1.624z"/></svg>`;
    if (name === 'apple') return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm.5 3.5c.97 0 1.75.43 1.75.43L13 8.5s-.5-.25-1-.25c-1.5 0-2.25 1.25-2.25 2.75v.5h2.5v2H9.75V18h-2v-4.5H6.5v-2h1.25V11c0-2.5 1.75-5.5 4.75-5.5z"/></svg>`;
    if (name === 'deezer') return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.81 10.5h2.69v1.5h-2.69zm0 2.25h2.69v1.5h-2.69zm0 2.25h2.69v1.5h-2.69zM13.5 7.5h2.69V9H13.5zm0 2.25h2.69v1.5H13.5zm0 2.25h2.69v1.5H13.5zm0 2.25h2.69v1.5H13.5zM8.19 12h2.69v1.5H8.19zm0 2.25h2.69v1.5H8.19zM2.5 14.25h2.69v1.5H2.5z"/></svg>`;
    if (name === 'rss') return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.18 15.64a2.18 2.18 0 010 4.36 2.18 2.18 0 010-4.36M4 4.44A15.56 15.56 0 0119.56 20h-2.83A12.73 12.73 0 004 7.27V4.44m0 5.66a9.9 9.9 0 019.9 9.9h-2.83A7.07 7.07 0 004 12.93V10.1z"/></svg>`;
    return '';
  }

  // ── Audio player ─────────────────────────────────────────────────────────
  let activeBtn = null;
  const miniPlayer = document.getElementById('mini-player');
  const miniAudio  = document.getElementById('mini-audio');
  const miniTitle  = document.getElementById('mini-title');

  document.addEventListener('click', e => {
    const btn = e.target.closest('.play-btn[data-url]');
    if (!btn) return;

    if (btn === activeBtn) {
      if (miniAudio.paused) { miniAudio.play(); btn.classList.add('playing'); btn.innerHTML = pauseIcon(); }
      else { miniAudio.pause(); btn.classList.remove('playing'); btn.innerHTML = playIcon(); }
      return;
    }
    if (activeBtn) { activeBtn.classList.remove('playing'); activeBtn.innerHTML = playIcon(); }
    activeBtn = btn;
    btn.classList.add('playing');
    btn.innerHTML = pauseIcon();
    miniTitle.textContent = btn.dataset.title;
    miniAudio.src = btn.dataset.url;
    miniAudio.play();
    miniPlayer.classList.remove('hidden');
  });

  miniAudio.addEventListener('ended', () => {
    if (activeBtn) { activeBtn.classList.remove('playing'); activeBtn.innerHTML = playIcon(); activeBtn = null; }
  });

  // ── Load data ────────────────────────────────────────────────────────────
  (async () => {
    const listEl = document.getElementById('episode-list');

    if (!slug) {
      listEl.innerHTML = `${T("Paramètre <code>slug</code> manquant.", "פרמטר <code>slug</code> חסר.")}`;
      return;
    }

    let chInfo = null;
    try {
      const chRes = await fetch('channels.json');
      if (chRes.ok) {
        const all = await chRes.json();
        chInfo = all.find(c => c.slug === slug && c.enabled);
      }
    } catch(_) {}

    if (!chInfo) {
      listEl.innerHTML = `${T("Canal introuvable.", "הערוץ לא נמצא.")}`;
      return;
    }

    // Render header
    const header = document.getElementById('widget-header');
    const chArt = document.getElementById('ch-art');
    // Small embed header: thumbnail first, PNG master only if it 404s.
    chArt.onerror = () => { chArt.onerror = null; chArt.src = `artwork/${slug}.png`; };
    chArt.src = `artwork/thumb/${slug}.webp`;
    document.getElementById('ch-name').textContent = chInfo.podcast_author;
    document.getElementById('ch-meta').textContent =
      chInfo.podcast_language === 'he' ? 'עברית' : 'Cours en français';
    header.style.display = '';

    // Platform buttons
    const platEl = document.getElementById('ch-platforms');
    const platDefs = [
      { key: 'spotify', cls: 'plat-spotify', label: 'Spotify' },
      { key: 'apple',   cls: 'plat-apple',   label: 'Apple Podcasts' },
      { key: 'deezer',  cls: 'plat-deezer',  label: 'Deezer' },
      { key: 'rss',     cls: 'plat-rss',     label: 'RSS' },
    ];
    platEl.innerHTML = platDefs
      .filter(p => chInfo.platforms && chInfo.platforms[p.key])
      .map(p => `<a class="plat-btn ${p.cls}" href="${escapeHtml(chInfo.platforms[p.key])}" target="_blank" rel="noopener" title="${p.label}">${platformSVG(p.key)}</a>`)
      .join('');

    // Load episodes.
    // Course language: the widget lives on someone else's page, where the
    // visitor has no control, so the EMBEDDER decides via ?courselang=fr|he
    // (default: the stored site preference). A filter that would empty the
    // widget is ignored — a dead embed on a partner site is worse than an
    // unfiltered one.
    let episodes = [];
    try {
      const epRes = await fetch(`feeds/${slug}.entries.json`);
      if (epRes.ok) episodes = await epRes.json();
    } catch(_) {}

    const forced = new URLSearchParams(location.search).get('courselang');
    const wanted = (forced === 'fr' || forced === 'he' || forced === 'all')
      ? forced : TTPPrefs.courseLang();
    if (wanted !== 'all') {
      const kept = episodes.filter(ep => episodeCourseLang(ep, chInfo) === wanted);
      if (kept.length) episodes = kept;
    }

    episodes.sort((a, b) => new Date(b.published) - new Date(a.published));

    if (!episodes.length) {
      listEl.innerHTML = `${T("Aucun épisode disponible.", "אין פרקים זמינים.")}`;
      return;
    }

    document.getElementById('ep-count').textContent =
      lang === 'he' ? `${episodes.length} שיעורים` : `${episodes.length} épisodes`;

    listEl.innerHTML = episodes.map(ep => {
      const thumb = ep.thumbnail
        ? `<img class="ep-thumb" src="${escapeHtml(ep.thumbnail)}" alt="" loading="lazy">`
        : `<div class="ep-thumb-ph"></div>`;
      const playBtnHtml = ep.audio_url
        ? `<button class="play-btn"
             data-url="${escapeHtml(ep.audio_url)}"
             data-title="${escapeHtml(ep.title)}"
             title="${T('Écouter', 'האזן')}" aria-label="${T('Écouter', 'האזן')}"
           >${playIcon()}</button>`
        : '';
      return `
        <li class="ep-item">
          ${thumb}
          <div class="ep-body">
            <div class="ep-title">${escapeHtml(ep.title)}</div>
            <div class="ep-date">${formatDate(ep.published)}</div>
          </div>
          ${playBtnHtml}
        </li>`;
    }).join('');
  })();
</script>

</body>
</html>
