    /* Sticky search + filter bar */

    }
    .search-wrap {
      position: relative;

    }
    .search-input::placeholder { color: rgba(255,255,255,0.4); }

    /* Filter chips (inside sticky bar) */
    .filter-row {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      background: var(--color-inverse-hover);
      border: 1px solid var(--color-inverse-border);

      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 3px;

      width: 14px;
      height: 14px;
      border-radius: 3px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .ep-channel-name {
      font-size: 0.68rem;

      font-weight: 600;

    .ep-channel-name:hover { color: var(--color-heading); }
    .ep-title {
      font-weight: 600;
      font-size: 0.88rem;

      text-decoration: none;
    }
    .ep-title:hover { color: var(--color-heading); text-decoration: underline; }
    .ep-date { font-size: 0.73rem; color: var(--color-text-subtle); margin-bottom: 6px; }
    .ep-desc {
      font-size: 0.78rem;
      color: var(--color-text-tertiary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 7px;
    }
    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--color-primary);
      color: var(--color-on-inverse);

      border-radius: 20px;

      font-size: 0.76rem;

      transition: background .15s;

    .play-btn:hover { background: var(--color-primary-hover); }
    .play-btn.playing { background: var(--color-accent); }
    .play-btn svg { width: 10px; height: 10px; flex-shrink: 0; }

    /* Load more */
    .load-more-wrap { padding: 24px 0; text-align: center; }
    .load-more-btn {
      background: var(--color-surface);
      border: 1px solid var(--color-border-strong);
      border-radius: 8px;
      padding: 9px 28px;
      font-size: 0.85rem;
      color: var(--color-text-body);
      cursor: pointer;
      font-family: inherit;
      transition: background .12s, border-color .12s;
    }
    .load-more-btn:hover { background: var(--color-surface-hover); border-color: var(--color-text-disabled); }

    .state {
      padding: 48px 20px;
      text-align: center;
      color: var(--color-text-subtle);
      font-size: 0.9rem;
    }
    .state.loading::before {
      content: '';
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--color-border-strong);
      border-top-color: var(--color-text-tertiary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Persistent player */
    #player {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--color-inverse-bg);
      color: var(--color-on-inverse);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      box-shadow: 0 -2px 16px rgba(0,0,0,.25);
      z-index: 200;
      transform: translateY(0);
      transition: transform .25s ease;
    }
    #player.hidden { transform: translateY(100%); }
    #player-art {
      width: 44px; height: 44px;
      border-radius: 6px;
      object-fit: cover;
      background: #333;
      flex-shrink: 0;
    }
    #player-info { min-width: 0; flex: 1; }
    #player-title { font-size: 0.82rem; font-weight: 600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    #player-channel { font-size: 0.68rem; color: #99a; }
    #player-audio { flex: 2; min-width: 120px; height: 32px; accent-color: var(--color-accent); }
    #player-close {
      background: none; border: none; color: #778; font-size: 1.1rem;
      cursor: pointer; padding: 4px 6px; flex-shrink: 0; line-height: 1;
    }
    #player-close:hover { color: var(--color-on-inverse); }

    @media (max-width: 500px) {
      .ep-thumb, .ep-thumb-ph { display: none; }
      #player-art { display: none; }
    }
  
    .site-footer { background: var(--color-inverse-bg); color: var(--color-inverse-scrim); text-align: center; padding: 20px 16px; font-size: .78rem; margin-top: 40px; }

    <button type="button" class="lang-opt" data-lang="fr" onclick="setLang('fr')">FR</button>
    <button type="button" class="lang-opt" data-lang="en" onclick="setLang('en')">EN</button>
    <button type="button" class="lang-opt" data-lang="he" onclick="setLang('he')">עב</button>
  </div>
</header>

<div class="sticky-bar">
  <div class="sticky-bar-inner">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-input" id="search" type="search" placeholder="Rechercher un épisode ou un rav…" autocomplete="off" data-i18n="|search_ph">
    </div>
    <div class="filter-row" id="filter-row">
      <button class="filter-chip active" data-slug="all" data-i18n="filter_all">Tous les rabbins</button>
    </div>
    <div class="filter-row" id="dur-filter-row" style="margin-top:4px">
      <button class="filter-chip active" data-dur="all" onclick="filterDurDC(this)">Tous</button>
      <button class="filter-chip" data-dur="short" onclick="filterDurDC(this)">&lt;&nbsp;5&nbsp;min</button>
      <button class="filter-chip" data-dur="medium" onclick="filterDurDC(this)">5–20&nbsp;min</button>
      <button class="filter-chip" data-dur="long" onclick="filterDurDC(this)">&gt;&nbsp;20&nbsp;min</button>
    </div>
  </div>
</div>

<main>
  <div class="page-header">
    <div class="page-title" data-i18n="page_title">Derniers cours</div>
    <div class="page-subtitle" id="page-subtitle"></div>
  </div>

  <div id="app">
    <div class="state loading" data-i18n="loading">Chargement…</div>
  </div>
</main>

<div id="player" class="hidden">
  <img id="player-art" src="" alt="">
  <div id="player-info">
    <div id="player-title"></div>
    <div id="player-channel"></div>
  </div>
  <audio id="player-audio" controls></audio>
  <button id="player-close" title="Fermer">✕</button>
</div>

<script>
  // ─── i18n ──────────────────────────────────────────────────────────────────
  const I18N = {
    fr: {
      nav_home:'Accueil', nav_rabbis:'Rabbins', nav_last_classes:'Derniers cours',
      nav_daf_hayomi:'Daf Hayomi', nav_limud:'Limud Yomi', nav_hitat:'Hitat Yomi', nav_hayomyom:'Hayom Yom', nav_paracha:'Paracha', nav_themes:'Thème', nav_all_rabbis:'Tous les rabbins →',
      lang_toggle:'English',
      subtitle:'Cours de Torah — disponibles sur vos plateformes favorites',
      page_title:'Derniers cours',
      filter_all:'Tous les rabbins',
      dur_all:'Tous', dur_short:'< 5 min', dur_medium:'5–20 min', dur_long:'> 20 min',
      search_ph:'Rechercher un épisode ou un rav…',
      listen:'Écouter', playing:'En cours…', loading:'Chargement…',
      load_more:'Voir plus',
      no_episodes:'Aucun épisode trouvé.',
      loading_catalog:'Chargement du catalogue complet…',
    },
    en: {
      nav_home:'Home', nav_rabbis:'Rabbis', nav_last_classes:'Latest classes',
      nav_daf_hayomi:'Daf Hayomi', nav_limud:'Limud Yomi', nav_hitat:'Hitat Yomi', nav_hayomyom:'Hayom Yom', nav_paracha:'Parasha', nav_themes:'Topics', nav_all_rabbis:'All rabbis →',
      lang_toggle:'עברית',
      subtitle:'Torah classes — available on your favorite platforms',
      page_title:'Latest classes',
      filter_all:'All rabbis',
      dur_all:'All', dur_short:'< 5 min', dur_medium:'5–20 min', dur_long:'> 20 min',
      search_ph:'Search for an episode or a rabbi…',
      listen:'Listen', playing:'Playing…', loading:'Loading…',
      load_more:'See more',
      no_episodes:'No episodes found.',
      loading_catalog:'Loading the full catalog…',
    },
    he: {
      nav_home:'ראשי', nav_rabbis:'הרבנים', nav_last_classes:'שיעורים אחרונים',
      nav_daf_hayomi:'דף היומי', nav_limud:'לימוד יומי', nav_hitat:'חת"ת', nav_hayomyom:'היום יום', nav_paracha:'פרשה', nav_themes:'נושא', nav_all_rabbis:'כל הרבנים →',
      lang_toggle:'Français',
      subtitle:'שיעורי תורה — זמינים בפלטפורמות האהובות עליכם',
      page_title:'שיעורים אחרונים',
      filter_all:'כל הרבנים',
      search_ph:'חיפוש שיעור או רב…',
      listen:'האזן', playing:'מתנגן…', loading:'טוען…',
      load_more:'טען עוד',
      no_episodes:'לא נמצאו פרקים.',
      loading_catalog:'טוען את הקטלוג המלא…',
    },
  };
  let lang = localStorage.getItem('lang') || 'fr';
  function t(k) { return (I18N[lang]||{})[k] || I18N.fr[k] || k; }
  function applyLang() {
    document.querySelectorAll('.lang-opt').forEach(function(b){ b.classList.toggle('active', b.dataset.lang === lang); });
    document.documentElement.lang = lang;
    document.documentElement.dir  = lang === 'he' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (key.startsWith('|')) { el.placeholder = t(key.slice(1)); }
      else { el.textContent = t(key); }
    });
  }
  function setLang(l) { if (l === lang) return; localStorage.setItem('lang', l); location.reload(); }
  applyLang();

  document.addEventListener('click', e => {
    if (e.target.closest('.nav-submenu')) return;
    const caret = e.target.closest('.nav-dd-caret');
    document.querySelectorAll('.nav-dropdown.open').forEach(el => {
      if (!caret || el !== caret.closest('.nav-dropdown')) el.classList.remove('open');
    });
    if (caret) caret.closest('.nav-dropdown').classList.toggle('open');
  });

  // ─── Player ────────────────────────────────────────────────────────────────
  let activeBtn = null;
  // The list is re-rendered while the catalog streams in, so the DOM node of the
  // playing button is thrown away regularly. The episode id is what survives.
  let activeEpId = null;
  const playerEl    = document.getElementById('player');
  const playerAudio = document.getElementById('player-audio');
  const playerTitle = document.getElementById('player-title');
  const playerCh    = document.getElementById('player-channel');
  const playerArt   = document.getElementById('player-art');







  function loadInPlayer(ep, chName, slug) {
    playerTitle.textContent = ep.title;
    playerCh.textContent    = chName;
    // 44 px slot — the thumbnail, never the 3000 px master.
    playerArt.onerror       = () => { playerArt.onerror = null; playerArt.src = `artwork/${slug}.png`; };
    playerArt.src           = ep.thumbnail || `artwork/thumb/${slug}.webp`;
    playerAudio.src         = ep.audio_url;
    playerAudio.play();
    playerEl.classList.remove('hidden');
  }

  document.addEventListener('click', e => {
    const btn = e.target.closest('.play-btn[data-ep-id]');
    if (!btn) return;
    const epId = btn.dataset.epId;
    const flat  = window._flat || [];
    const item  = flat.find(x => x.ep.video_id === epId);
    if (!item) return;

    if (btn === activeBtn) {
      if (playerAudio.paused) {
        playerAudio.play();
        btn.classList.add('playing');
        btn.innerHTML = pauseIcon() + ' ' + t('playing');
      } else {
        playerAudio.pause();
        btn.classList.remove('playing');
        btn.innerHTML = playIcon() + ' ' + t('listen');
      }
      return;
    }
    if (activeBtn) {
      activeBtn.classList.remove('playing');
      activeBtn.innerHTML = playIcon() + ' ' + t('listen');
    }
    activeBtn = btn;
    activeEpId = epId;
    btn.classList.add('playing');
    btn.innerHTML = pauseIcon() + ' ' + t('playing');
    loadInPlayer(item.ep, item.ch.name, item.ch.slug);
  });

  document.getElementById('player-close').addEventListener('click', () => {
    playerAudio.pause();
    playerEl.classList.add('hidden');
    if (activeBtn) {
      activeBtn.classList.remove('playing');
      activeBtn.innerHTML = playIcon() + ' ' + t('listen');
    }
    activeBtn = null;
    activeEpId = null;
  });

  playerAudio.addEventListener('ended', () => {
    if (activeBtn) {
      activeBtn.classList.remove('playing');
      activeBtn.innerHTML = playIcon() + ' ' + t('listen');
    }
    activeBtn = null;
    activeEpId = null;
  });

  // ─── Helpers ───────────────────────────────────────────────────────────────




  // home.json rows already carry the episode page URL; feed rows don't, so it is
  // recomputed from the title the usual way.
  function epHref(ep, chSlug) { return ep.url || epUrl(ep, chSlug); }

  function renderEpisodeItem(item) {
    const { ep, ch } = item;
    const thumb = ep.thumbnail
      ? `<a href="${epHref(ep, ch.slug)}"><img class="ep-thumb" src="${escapeHtml(ep.thumbnail)}" alt="" loading="lazy"></a>`
      : `<div class="ep-thumb-ph"></div>`;
    const desc = ep.description
      ? `<p class="ep-desc">${escapeHtml(ep.description.slice(0, 200))}</p>`
      : '';
    const playBtn = ep.audio_url
      ? `<button class="play-btn" data-ep-id="${escapeHtml(ep.video_id)}">${playIcon()} ${t('listen')}</button>`
      : '';
    return `
      <li class="episode-item" data-slug="${escapeHtml(ch.slug)}" data-dur="${ep.duration_secs || 0}" data-ep-dur="${ep.duration_secs || 0}">
        ${thumb}
        <div class="ep-body">
          <div class="ep-channel">
            <img class="ep-channel-art" src="artwork/thumb/${escapeHtml(ch.slug)}.webp" alt="" loading="lazy" onerror="if(this.dataset.fb){this.onerror=null;this.style.display='none'}else{this.dataset.fb='1';this.src='artwork/${escapeHtml(ch.slug)}.png'}">
            <a class="ep-channel-name" href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.name)}</a>
          </div>
          <a class="ep-title" href="${epHref(ep, ch.slug)}">${escapeHtml(ep.title)}</a>
          <div class="ep-date">${formatDate(ep.published)}${ep.duration_secs > 0 ? " - " + formatDuration(ep.duration_secs) : ""}</div>
          ${desc}${playBtn}
        </div>
      </li>`;
  }

  // ─── Main ──────────────────────────────────────────────────────────────────
  const PAGE_SIZE = 30;
  let visibleCount = PAGE_SIZE;
  let activeFilter = 'all';
  let searchQuery  = '';
  // false while the per-channel feeds are still streaming in behind the first
  // paint. Read by renderList() and by the subtitle.
  let catalogLoaded = false;

  let activeDurFilter = 'all';
  function filterDurDC(btn) {
    document.querySelectorAll('#dur-filter-row .filter-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeDurFilter = btn.dataset.dur;
    visibleCount = PAGE_SIZE;
    renderList();
  }
  function filteredFlat() {
    let flat = window._flat || [];
    if (activeFilter !== 'all') flat = flat.filter(x => x.ch.slug === activeFilter || (x.speakers && x.speakers.includes(activeFilter)));
    if (activeDurFilter !== 'all') {
      flat = flat.filter(x => {
        const d = x.ep.duration_secs || 0;
        if (activeDurFilter === 'short')  return d > 0 && d < 300;
        if (activeDurFilter === 'medium') return d >= 300 && d <= 1200;
        if (activeDurFilter === 'long')   return d > 1200;
        return true;
      });
    }
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      flat = flat.filter(x =>
        x.ep.title.toLowerCase().includes(q) ||
        x.ch.name.toLowerCase().includes(q) ||
        (x.ep.description || '').toLowerCase().includes(q)
      );
      // latest.json only holds the newest classes, so a search limited to it
      // would silently stop finding older ones. search-index.json (the very file
      // index.html lazy-loads, fetched only once the visitor actually types)
      // covers the whole catalogue. Skipped when a rav chip is active: his full
      // feed is already loaded and those rows are richer.
      if (activeFilter === 'all') flat = flat.concat(searchIndexMatches(q));
      flat.sort((a, b) => new Date(b.ep.published) - new Date(a.ep.published));
    }
    return flat;
  }

  // -- Whole-catalogue title search (lazy) ------------------------------------
  // search-index.json rows: t = title, c = rav display name, u = episode page
  // URL, d = YYYY-MM-DD, l = course language.
  let searchIdx = null, searchIdxPending = false;
  function ensureSearchIndex() {
    if (searchIdx || searchIdxPending) return;
    searchIdxPending = true;
    fetch('search-index.json')
      .then(r => r.ok ? r.json() : [])
      .catch(() => [])
      .then(rows => { searchIdx = rows; searchIdxPending = false; renderList(); });
  }

  const SEARCH_EXTRA_MAX = 500;
  function searchIndexMatches(q) {
    // These rows carry no duration, so they cannot honour the duration chips --
    // rather than guess, the fallback stands down while one is active.
    if (!searchIdx || activeDurFilter !== 'all') return [];
    // Seeded with what is already loaded, then grown as rows are emitted: the
    // catalogue really does hold classes sharing a title and a date, and
    // ep_path() maps both to the same page.
    const seen = new Set(window._urls || []);
    const out = [];
    for (const r of searchIdx) {
      if (out.length >= SEARCH_EXTRA_MAX) break;
      if (seen.has(r.u)) continue;
      if (HITAT_RE.test(r.t || '')) continue;
      if (!(r.t || '').toLowerCase().includes(q) && !(r.c || '').toLowerCase().includes(q)) continue;
      const ch = chByName.get(r.c) || { slug: '', name: r.c || '' };
      if (!courseLangKeeps(r, ch)) continue;
      // Deliberately partial row: the index carries no thumbnail, duration nor
      // audio URL. renderEpisodeItem already degrades gracefully (placeholder
      // artwork, no play button) and the title links to the episode page, which
      // has its own player.
      seen.add(r.u);
      out.push({ ep: { title: r.t, published: r.d, url: r.u, duration_secs: 0 }, ch: ch, speakers: [] });
    }
    return out;
  }

  // The playing button is destroyed on every re-render (innerHTML). Re-attach to
  // the new node carrying the same episode id, so the streaming catalog never
  // desyncs the list from the player.
  function restorePlayingBtn(app) {
    if (!activeEpId) return;
    activeBtn = null;
    app.querySelectorAll('.play-btn[data-ep-id]').forEach(b => {
      if (b.dataset.epId !== activeEpId) return;
      activeBtn = b;
      if (!playerAudio.paused) {
        b.classList.add('playing');
        b.innerHTML = pauseIcon() + ' ' + t('playing');
      }
    });
  }

  function renderList() {
    const app = document.getElementById('app');
    const items = filteredFlat();
    const slice = items.slice(0, visibleCount);

    if (!slice.length) {
      // Never a blank page: while the rest of the catalog is still streaming in,
      // "no episode" would be a lie — say "loading" instead.
      if (!catalogLoaded || pendingFeeds) {
        app.innerHTML = `<div class="state loading">${t('loading')}</div>`;
        return;
      }
      // When the course-language filter is what emptied it, say so and offer the
      // way back to "Toutes".
      app.innerHTML = courseLangFiltering() && !searchQuery && activeFilter === 'all'
        ? courseLangEmptyHtml()
        : `<div class="state">${t('no_episodes')}</div>`;
      return;
    }

    const listHtml = slice.map(renderEpisodeItem).join('');
    const hasMore  = items.length > visibleCount;
    const moreHtml = hasMore
      ? `<div class="load-more-wrap"><button class="load-more-btn" id="load-more-btn">${t('load_more')} (${items.length - visibleCount})</button></div>`
      : '';

    app.innerHTML = `<div class="episode-card"><ul class="episode-list">${listHtml}</ul></div>${moreHtml}`;
    restorePlayingBtn(app);

    const loadBtn = document.getElementById('load-more-btn');
    if (loadBtn) {
      loadBtn.addEventListener('click', () => {
        visibleCount += PAGE_SIZE;
        renderList();
      });
    }
  }

  // ─── Episode store ─────────────────────────────────────────────────────────
  // Keyed by video_id so the 20 seed rows taken from home.json are silently
  // replaced by the richer rows of `feeds/<slug>.entries.json` when their
  // channel lands — the page never shows the same class twice.
  const epStore = new Map();
  // The daily "HITAT DU JOUR" shiurim live on hitat.html, not in the
  // chronological feed.
  const HITAT_RE = /HITAT DU JOUR/i;
  let speakers = [];

  const speakerMatch = (title, patterns) =>
    (patterns || []).some(p => (title || '').toLowerCase().includes(p.toLowerCase()));

  // Merge a channel's episodes into the store, tagging each with the
  // manually-added rabbi(s) it matches within its source channel.
  function addEpisodes(ch, entries) {
    for (const ep of entries || []) {
      if (!ep || HITAT_RE.test(ep.title || '')) continue;
      const item = { ep, ch };
      // latest.json rows already carry their matched rabbis (`sp`); entries
      // pulled straight from a feed are matched here, with the very patterns
      // build_latest_index used server-side.
      item.speakers = ep.sp || speakers
        .filter(sp => (sp.from_channels || []).includes(ch.slug) && speakerMatch(ep.title, sp.title_patterns))
        .map(sp => sp.slug);
      epStore.set(ep.video_id || (ch.slug + '|' + ep.published + '|' + ep.title), item);
    }
  }

  function rebuildFlat() {
    const flat = Array.from(epStore.values());
    flat.sort((a, b) => new Date(b.ep.published) - new Date(a.ep.published));
    window._flat = flat;
    // Episode-page URLs of everything already loaded -- the only key shared with
    // search-index.json rows (they carry no video_id), so it is what keeps a
    // class from showing up twice in a search.
    window._urls = new Set(flat.map(x => epHref(x.ep, x.ch.slug)));
  }

  // The page holds only the newest slice of the catalogue, so the count comes
  // from the pre-computed totals of latest.json -- and follows the
  // course-language preference like every other count on the site.
  function setSubtitle() {
    const n = indexMeta ? courseLangCount(indexMeta, 'total') : epStore.size;
    const suffix = (catalogLoaded && !pendingFeeds) ? '' : ' · ' + t('loading_catalog');
    document.getElementById('page-subtitle').textContent = (lang === 'he'
      ? `${n} שיעורים מכל הרבנים, לפי סדר פרסום`
      : (lang === 'en' ? `${n} classes from all rabbis, by publication order`
                       : `${n} cours de tous les rabbins, par ordre de publication`)) + suffix;
  }

  // -- Chips, lazy histories --------------------------------------------------
  const chBySlug = new Map();
  const chByName = new Map();
  let indexMeta = null;
  // Number of full feeds currently in flight; while > 0 the list says "loading"
  // rather than "no episode".
  let pendingFeeds = 0;

  function addChip(slug, name, artSlug) {
    const btn = document.createElement('button');
    btn.className = 'filter-chip';
    btn.dataset.slug = slug;
    btn.innerHTML = `<img src="artwork/thumb/${escapeHtml(artSlug)}.webp" alt="" onerror="if(this.dataset.fb){this.onerror=null;this.style.display='none'}else{this.dataset.fb='1';this.src='artwork/${escapeHtml(artSlug)}.png'}"> ${escapeHtml(name)}`;
    document.getElementById('filter-row').appendChild(btn);
  }

  const fullyLoaded = new Set();

  // Full history behind a chip. For a channel that is its own feed; for a
  // manually-added rabbi it is the host channel(s) he was extracted from --
  // loading those lets addEpisodes tag his classes exactly as
  // build_latest_index did, and keeps every row attached to its real channel.
  async function ensureFullHistory(slug) {
    const sp = speakers.find(s => s.slug === slug);
    const wanted = sp ? (sp.from_channels || []) : [slug];
    const todo = wanted.filter(s => !fullyLoaded.has(s) && chBySlug.has(s));
    if (!todo.length) return;
    todo.forEach(s => fullyLoaded.add(s));
    pendingFeeds += todo.length;
    setSubtitle();
    renderList();
    try {
      await Promise.all(todo.map(async s => {
        const ch = chBySlug.get(s);
        let entries = [];
        // fetchChannelEntries (js/utils.js) applies the course-language
        // preference, so the list and the counts follow from here.
        try { entries = await fetchChannelEntries(ch); } catch (_) { entries = []; }
        addEpisodes(ch, entries);
      }));
    } finally {
      pendingFeeds -= todo.length;
    }
    rebuildFlat();
    setSubtitle();
    renderList();
  }

  // -- Boot -------------------------------------------------------------------
  // This page used to download the 22 `feeds/<slug>.entries.json` before it
  // could paint a single row -- 33 672 889 bytes raw / 4 573 683 gzipped,
  // measured 31/08/2026, for a first screen of 30 items. It now reads
  // `latest.json`, the pre-computed chronological index written by
  // build_latest_index() (scripts/generate_channel_pages.py): the newest
  // classes of the whole site, the chips with their real catalogue counts, and
  // the real totals. Anything beyond that is fetched only if the visitor asks
  // for it -- one rav's feed when he picks a chip, search-index.json when he
  // types.
  (async () => {
    const app = document.getElementById('app');
    const filterRow = document.getElementById('filter-row');

    // Controls are wired first: they must already work on the index rows.
    filterRow.addEventListener('click', e => {
      const chip = e.target.closest('.filter-chip');
      if (!chip) return;
      activeFilter = chip.dataset.slug;
      visibleCount = PAGE_SIZE;
      filterRow.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c === chip));
      renderList();
      // A chip must show that rav's WHOLE history, not just the slice of him
      // that happened to land in the index.
      if (activeFilter !== 'all') ensureFullHistory(activeFilter);
    });

    const searchEl = document.getElementById('search');
    let searchTimer;
    searchEl.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchQuery  = searchEl.value.trim();
        visibleCount = PAGE_SIZE;
        if (searchQuery && activeFilter === 'all') ensureSearchIndex();
        renderList();
      }, 200);
    });

    let idx = null;
    try {
      const res = await fetch('latest.json');
      if (res.ok) idx = await res.json();
    } catch (_) {}

    if (!idx) {
      catalogLoaded = true;
      app.innerHTML = `<div class="state">${t('no_episodes')}</div>`;
      return;
    }

    indexMeta = idx;
    speakers  = idx.speakers || [];
    for (const ch of (idx.channels || [])) { chBySlug.set(ch.slug, ch); chByName.set(ch.name, ch); }

    for (const row of (idx.episodes || [])) {
      const ch = chBySlug.get(row.slug) || { slug: row.slug, name: row.ch_name };
      if (courseLangKeeps(row, ch)) addEpisodes(ch, [row]);
    }

    catalogLoaded = true;
    rebuildFlat();
    setSubtitle();
    renderList();

    // Populate nav submenu
    const sub = document.getElementById('nav-rabbis-submenu');
    if (sub) {
      sub.innerHTML = (idx.channels || []).map(ch =>
        `<a href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.name)}</a>`
      ).join('') + `<a href="rabbins.html" class="nav-submenu-all">${t('nav_all_rabbis')}</a>`;
    }

    // Chips. The counts are pre-computed over the whole catalogue, so the list
    // no longer depends on what happens to be loaded -- and a rav with nothing
    // in the chosen course language still never gets one (a chip that can only
    // answer "no episode" is noise).
    for (const ch of (idx.channels || [])) {
      if (courseLangCount(ch, 'count')) addChip(ch.slug, ch.name, ch.slug);
    }
    // Guests have no artwork of their own -- the chip borrows the host channel's.
    for (const sp of (idx.speakers || [])) {
      if (courseLangCount(sp, 'count')) addChip(sp.slug, sp.name, sp.art_slug || sp.slug);
    }
  })();
