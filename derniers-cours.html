<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Derniers cours — The Torah Podcast</title>
  <meta name="description" content="Les derniers cours de Torah publiés par tous nos rabbins — Rav Itshak Cohen, Rav Yonathan Mergui, Rav Yaakov Sitruk et plus. Retrouvez les épisodes les plus récents.">
  <link rel="canonical" href="https://thetorahpodcast.net/derniers-cours.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://thetorahpodcast.net/derniers-cours.html">
  <meta property="og:title" content="Derniers cours — The Torah Podcast">
  <meta property="og:description" content="Les derniers cours de Torah publiés par tous nos rabbins. Retrouvez les épisodes les plus récents.">
  <meta property="og:image" content="https://thetorahpodcast.net/artwork/rav-itshak-cohen.png">
  <meta property="og:site_name" content="The Torah Podcast">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Derniers cours — The Torah Podcast">
  <meta name="twitter:description" content="Les derniers cours de Torah publiés par tous nos rabbins.">
  <meta name="twitter:image" content="https://thetorahpodcast.net/artwork/rav-itshak-cohen.png">
  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="preconnect" href="https://pub-a5fae25ce5124edebe0bf7393f72823c.r2.dev" crossorigin>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7Z2QEN865Y"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-7Z2QEN865Y');</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f0;
      color: #222;
      line-height: 1.5;
      padding-bottom: 80px;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 28px 20px 0;
      text-align: center;
    }
    header h1 { font-size: 2rem; margin-bottom: 6px; }
    header p  { color: #aab; font-size: 0.95rem; margin-bottom: 14px; }
    .header-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 16px 20px;
    }
    .header-nav a {
      color: rgba(255,255,255,.65);
      text-decoration: none;
      font-size: 0.8rem;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.2);
      transition: background .15s, color .15s, border-color .15s;
    }
    .header-nav a:hover { color: #fff; border-color: rgba(255,255,255,.5); background: rgba(255,255,255,.1); }
    .header-nav a.active { color: #1a1a2e; background: #fff; border-color: #fff; font-weight: 600; }
    .nav-dropdown { position: relative; display: inline-flex; }
    .nav-dd-link { color: rgba(255,255,255,.65); text-decoration: none; font-size: .8rem; padding: 5px 4px 5px 14px; border-radius: 20px 0 0 20px; border: 1px solid rgba(255,255,255,.2); border-right: none; transition: background .15s, color .15s; }
    .nav-dd-link:hover { color: #fff; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.5); }
    .nav-dd-caret { color: rgba(255,255,255,.65); font-size: .8rem; padding: 5px 10px 5px 6px; border-radius: 0 20px 20px 0; border: 1px solid rgba(255,255,255,.2); border-left: none; background: none; cursor: pointer; font-family: inherit; transition: background .15s, color .15s; }
    .nav-dd-caret:hover, .nav-dropdown.open .nav-dd-caret { color: #fff; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.5); }
    .nav-submenu { display: none; position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: #252545; border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 10px; z-index: 300; box-shadow: 0 8px 28px rgba(0,0,0,.5); flex-wrap: wrap; gap: 4px; min-width: 340px; max-width: 92vw; }
    .nav-dropdown.open .nav-submenu { display: flex; }
    .nav-submenu a { color: rgba(255,255,255,.78); text-decoration: none; padding: 6px 12px; border-radius: 20px; font-size: .78rem; white-space: nowrap; border: 1px solid rgba(255,255,255,.15); transition: background .12s, color .12s; }
    .nav-submenu a:hover { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.35); }
    .lang-btn {
      color: rgba(255,255,255,.65);
      font-size: 0.8rem;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.2);
      background: none;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, color .15s;
    }
    .lang-btn:hover { color: #fff; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.5); }

    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 40px; }

    .page-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
    }
    .page-subtitle {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 20px;
    }

    /* Channel filter chips */
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }
    .filter-chip {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 5px 13px;
      font-size: 0.78rem;
      color: #555;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background .12s, border-color .12s, color .12s;
    }
    .filter-chip:hover { background: #f0f0ea; border-color: #bbb; color: #222; }
    .filter-chip.active { background: #1a1a2e; border-color: #1a1a2e; color: #fff; }
    .filter-chip img {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      object-fit: cover;
    }

    /* Episode list */
    .episode-list { list-style: none; }
    .episode-item {
      display: flex;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid #e8e8e3;
      align-items: flex-start;
      background: transparent;
    }
    .episode-item:last-child { border-bottom: none; }
    .ep-thumb {
      width: 100px;
      height: 66px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
      background: #ddd;
    }
    .ep-thumb-ph {
      width: 100px;
      height: 66px;
      border-radius: 8px;
      flex-shrink: 0;
      background: #e8e8e8;
    }
    .ep-body { flex: 1; min-width: 0; }
    .ep-channel {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 3px;
    }
    .ep-channel-art {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .ep-channel-name {
      font-size: 0.7rem;
      color: #888;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-channel-name:hover { color: #1a1a2e; }
    .ep-title {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 2px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #222;
      text-decoration: none;
      line-height: 1.35;
    }
    .ep-title:hover { color: #1a1a2e; text-decoration: underline; }
    .ep-date { font-size: 0.72rem; color: #aaa; margin-bottom: 6px; }
    .ep-desc {
      font-size: 0.78rem;
      color: #666;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 5px 13px;
      font-size: 0.76rem;
      cursor: pointer;
      transition: background .15s;
    }
    .play-btn:hover { background: #2d2d50; }
    .play-btn.playing { background: #e87722; }
    .play-btn svg { width: 10px; height: 10px; flex-shrink: 0; }

    /* Load more */
    .load-more-wrap { padding: 24px 0; text-align: center; }
    .load-more-btn {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 9px 28px;
      font-size: 0.85rem;
      color: #444;
      cursor: pointer;
      font-family: inherit;
      transition: background .12s, border-color .12s;
    }
    .load-more-btn:hover { background: #f0f0ea; border-color: #aaa; }

    .state {
      padding: 48px 20px;
      text-align: center;
      color: #888;
      font-size: 0.9rem;
    }
    .state.loading::before {
      content: '';
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #ccc;
      border-top-color: #555;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Persistent player */
    #player {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      box-shadow: 0 -2px 16px rgba(0,0,0,.25);
      z-index: 200;
      transform: translateY(0);
      transition: transform .25s ease;
    }
    #player.hidden { transform: translateY(100%); }
    #player-art {
      width: 44px; height: 44px;
      border-radius: 6px;
      object-fit: cover;
      background: #333;
      flex-shrink: 0;
    }
    #player-info { min-width: 0; flex: 1; }
    #player-title { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #player-channel { font-size: 0.68rem; color: #99a; }
    #player-audio { flex: 2; min-width: 120px; height: 32px; accent-color: #e87722; }
    #player-close {
      background: none; border: none; color: #778; font-size: 1.1rem;
      cursor: pointer; padding: 4px 6px; flex-shrink: 0; line-height: 1;
    }
    #player-close:hover { color: #fff; }

    @media (max-width: 500px) {
      .ep-thumb, .ep-thumb-ph { display: none; }
      #player-art { display: none; }
    }
  </style>
</head>
<body>

<header>
  <h1>The Torah Podcast</h1>
  <p data-i18n="subtitle">Cours de Torah — disponibles sur vos plateformes favorites</p>
  <nav class="header-nav">
    <a href="./" data-i18n="nav_home">Accueil</a>
    <div class="nav-dropdown" id="nav-dropdown">
      <a class="nav-dd-link" href="links.html" data-i18n="nav_rabbis">Rabbins</a><button class="nav-dd-caret" aria-label="Voir la liste">▾</button>
      <div class="nav-submenu" id="nav-rabbis-submenu"></div>
    </div>
    <a href="derniers-cours.html" class="active" data-i18n="nav_last_classes">Derniers cours</a>
    <a href="parasha.html" data-i18n="nav_parasha">Paracha</a>
    <a href="themes.html" data-i18n="nav_themes">Thème</a>
    <button class="lang-btn" onclick="toggleLang()" data-i18n="lang_toggle">עברית</button>
  </nav>
</header>

<main>
  <div id="page-header" style="margin-bottom:16px;">
    <div class="page-title" data-i18n="page_title">Derniers cours</div>
    <div class="page-subtitle" id="page-subtitle"></div>
  </div>

  <div class="filter-row" id="filter-row">
    <button class="filter-chip active" data-slug="all" data-i18n="filter_all">Tous les rabbins</button>
  </div>

  <div id="app">
    <div class="state loading" data-i18n="loading">Chargement…</div>
  </div>
</main>

<div id="player" class="hidden">
  <img id="player-art" src="" alt="">
  <div id="player-info">
    <div id="player-title"></div>
    <div id="player-channel"></div>
  </div>
  <audio id="player-audio" controls></audio>
  <button id="player-close" title="Fermer">✕</button>
</div>

<script>
  // ─── i18n ──────────────────────────────────────────────────────────────────
  const I18N = {
    fr: {
      nav_home:'Accueil', nav_rabbis:'Rabbins', nav_last_classes:'Derniers cours',
      nav_parasha:'Paracha', nav_themes:'Thème', nav_all_rabbis:'Tous les rabbins →',
      lang_toggle:'עברית',
      subtitle:'Cours de Torah — disponibles sur vos plateformes favorites',
      page_title:'Derniers cours',
      filter_all:'Tous les rabbins',
      listen:'Écouter', playing:'En cours…', loading:'Chargement…',
      load_more:'Voir plus',
      no_episodes:'Aucun épisode trouvé.',
    },
    he: {
      nav_home:'ראשי', nav_rabbis:'הרבנים', nav_last_classes:'שיעורים אחרונים',
      nav_parasha:'פרשה', nav_themes:'נושא', nav_all_rabbis:'כל הרבנים →',
      lang_toggle:'Français',
      subtitle:'שיעורי תורה — זמינים בפלטפורמות האהובות עליכם',
      page_title:'שיעורים אחרונים',
      filter_all:'כל הרבנים',
      listen:'האזן', playing:'מתנגן…', loading:'טוען…',
      load_more:'טען עוד',
      no_episodes:'לא נמצאו פרקים.',
    },
  };
  let lang = localStorage.getItem('lang') || 'fr';
  function t(k) { return (I18N[lang]||{})[k] || I18N.fr[k] || k; }
  function applyLang() {
    document.documentElement.lang = lang === 'he' ? 'he' : 'fr';
    document.documentElement.dir  = lang === 'he' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.dataset.i18n);
    });
  }
  function toggleLang() { localStorage.setItem('lang', lang === 'fr' ? 'he' : 'fr'); location.reload(); }
  applyLang();

  document.addEventListener('click', e => {
    if (e.target.closest('.nav-submenu')) return;
    const caret = e.target.closest('.nav-dd-caret');
    document.querySelectorAll('.nav-dropdown.open').forEach(el => {
      if (!caret || el !== caret.closest('.nav-dropdown')) el.classList.remove('open');
    });
    if (caret) caret.closest('.nav-dropdown').classList.toggle('open');
  });

  // ─── Player ────────────────────────────────────────────────────────────────
  let activeBtn = null;
  const playerEl    = document.getElementById('player');
  const playerAudio = document.getElementById('player-audio');
  const playerTitle = document.getElementById('player-title');
  const playerCh    = document.getElementById('player-channel');
  const playerArt   = document.getElementById('player-art');

  function playIcon() {
    return `<svg viewBox="0 0 10 10" fill="currentColor"><polygon points="2,1 9,5 2,9"/></svg>`;
  }
  function pauseIcon() {
    return `<svg viewBox="0 0 10 10" fill="currentColor"><rect x="1.5" y="1" width="2.5" height="8"/><rect x="6" y="1" width="2.5" height="8"/></svg>`;
  }

  function loadInPlayer(ep, chName, slug) {
    playerTitle.textContent = ep.title;
    playerCh.textContent    = chName;
    playerArt.src           = ep.thumbnail || `artwork/${slug}.png`;
    playerAudio.src         = ep.audio_url;
    playerAudio.play();
    playerEl.classList.remove('hidden');
  }

  document.addEventListener('click', e => {
    const btn = e.target.closest('.play-btn[data-ep-id]');
    if (!btn) return;
    const epId = btn.dataset.epId;
    const flat  = window._flat || [];
    const item  = flat.find(x => x.ep.video_id === epId);
    if (!item) return;

    if (btn === activeBtn) {
      if (playerAudio.paused) {
        playerAudio.play();
        btn.classList.add('playing');
        btn.innerHTML = pauseIcon() + ' ' + t('playing');
      } else {
        playerAudio.pause();
        btn.classList.remove('playing');
        btn.innerHTML = playIcon() + ' ' + t('listen');
      }
      return;
    }
    if (activeBtn) {
      activeBtn.classList.remove('playing');
      activeBtn.innerHTML = playIcon() + ' ' + t('listen');
    }
    activeBtn = btn;
    btn.classList.add('playing');
    btn.innerHTML = pauseIcon() + ' ' + t('playing');
    loadInPlayer(item.ep, item.ch.name, item.ch.slug);
  });

  document.getElementById('player-close').addEventListener('click', () => {
    playerAudio.pause();
    playerEl.classList.add('hidden');
    if (activeBtn) {
      activeBtn.classList.remove('playing');
      activeBtn.innerHTML = playIcon() + ' ' + t('listen');
      activeBtn = null;
    }
  });

  playerAudio.addEventListener('ended', () => {
    if (activeBtn) {
      activeBtn.classList.remove('playing');
      activeBtn.innerHTML = playIcon() + ' ' + t('listen');
      activeBtn = null;
    }
  });

  // ─── Helpers ───────────────────────────────────────────────────────────────
  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatDate(iso) {
    const locale = lang === 'he' ? 'he-IL' : 'fr-FR';
    return new Date(iso).toLocaleDateString(locale, { day:'numeric', month:'long', year:'numeric' });
  }

  function renderEpisodeItem(item) {
    const { ep, ch } = item;
    const thumb = ep.thumbnail
      ? `<img class="ep-thumb" src="${escapeHtml(ep.thumbnail)}" alt="" loading="lazy">`
      : `<div class="ep-thumb-ph"></div>`;
    const desc = ep.description
      ? `<p class="ep-desc">${escapeHtml(ep.description.slice(0, 200))}</p>`
      : '';
    const playBtn = ep.audio_url
      ? `<button class="play-btn" data-ep-id="${escapeHtml(ep.video_id)}">${playIcon()} ${t('listen')}</button>`
      : '';
    return `
      <li class="episode-item" data-slug="${escapeHtml(ch.slug)}">
        ${thumb}
        <div class="ep-body">
          <div class="ep-channel">
            <img class="ep-channel-art" src="artwork/${escapeHtml(ch.slug)}.png" alt="" loading="lazy">
            <a class="ep-channel-name" href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.name)}</a>
          </div>
          <a class="ep-title" href="${escapeHtml(ch.slug)}.html">${escapeHtml(ep.title)}</a>
          <div class="ep-date">${formatDate(ep.published)}</div>
          ${desc}${playBtn}
        </div>
      </li>`;
  }

  // ─── Main ──────────────────────────────────────────────────────────────────
  const PAGE_SIZE = 30;
  let visibleCount = PAGE_SIZE;
  let activeFilter = 'all';

  function filteredFlat() {
    const flat = window._flat || [];
    if (activeFilter === 'all') return flat;
    return flat.filter(x => x.ch.slug === activeFilter);
  }

  function renderList() {
    const app = document.getElementById('app');
    const items = filteredFlat();
    const slice = items.slice(0, visibleCount);

    if (!slice.length) {
      app.innerHTML = `<div class="state">${t('no_episodes')}</div>`;
      return;
    }

    const listHtml = slice.map(renderEpisodeItem).join('');
    const hasMore  = items.length > visibleCount;
    const moreHtml = hasMore
      ? `<div class="load-more-wrap"><button class="load-more-btn" id="load-more-btn">${t('load_more')} (${items.length - visibleCount})</button></div>`
      : '';

    app.innerHTML = `<ul class="episode-list">${listHtml}</ul>${moreHtml}`;

    const loadBtn = document.getElementById('load-more-btn');
    if (loadBtn) {
      loadBtn.addEventListener('click', () => {
        visibleCount += PAGE_SIZE;
        renderList();
      });
    }
  }

  (async () => {
    const app = document.getElementById('app');
    let channels = [];
    try {
      const res = await fetch('channels.json');
      if (res.ok) {
        channels = (await res.json())
          .filter(ch => ch.enabled)
          .map(ch => ({ slug: ch.slug, name: ch.podcast_author, platforms: ch.platforms || {} }));
      }
    } catch (_) {}

    if (!channels.length) {
      app.innerHTML = `<div class="state">${t('no_episodes')}</div>`;
      return;
    }

    // Populate nav submenu
    const sub = document.getElementById('nav-rabbis-submenu');
    if (sub) sub.innerHTML = channels.map(ch =>
      `<a href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.name)}</a>`
    ).join('');

    // Load all episodes
    const allData = await Promise.all(channels.map(async ch => {
      try {
        const r = await fetch(`feeds/${ch.slug}.entries.json`);
        const entries = r.ok ? await r.json() : [];
        return { ch, entries };
      } catch (_) { return { ch, entries: [] }; }
    }));

    // Flatten and sort by date desc
    const flat = [];
    for (const { ch, entries } of allData) {
      for (const ep of entries) flat.push({ ep, ch });
    }
    flat.sort((a, b) => new Date(b.ep.published) - new Date(a.ep.published));
    window._flat = flat;

    const totalEp = flat.length;
    document.getElementById('page-subtitle').textContent = lang === 'he'
      ? `${totalEp} שיעורים מכל הרבנים, לפי סדר פרסום`
      : `${totalEp} cours de tous les rabbins, par ordre de publication`;

    // Build channel filter chips
    const filterRow = document.getElementById('filter-row');
    const existingAll = filterRow.querySelector('[data-slug="all"]');
    for (const { ch } of allData) {
      if (!ch) continue;
      const btn = document.createElement('button');
      btn.className = 'filter-chip';
      btn.dataset.slug = ch.slug;
      btn.innerHTML = `<img src="artwork/${escapeHtml(ch.slug)}.png" alt=""> ${escapeHtml(ch.name)}`;
      filterRow.appendChild(btn);
    }

    filterRow.addEventListener('click', e => {
      const chip = e.target.closest('.filter-chip');
      if (!chip) return;
      activeFilter = chip.dataset.slug;
      visibleCount = PAGE_SIZE;
      filterRow.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c === chip));
      renderList();
    });

    renderList();
  })();
</script>

</body>
</html>
