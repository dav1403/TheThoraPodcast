<script>
  // ─── i18n ──────────────────────────────────────────────────────────────────
  const I18N = {
    fr: {
      nav_home:'Accueil', nav_rabbis:'Rabbins', nav_last_classes:'Derniers cours',
      nav_daf_hayomi:'Daf Hayomi', nav_limud:'Limud Yomi', nav_hitat:'Hitat Yomi', nav_hayomyom:'Hayom Yom', nav_paracha:'Paracha', nav_themes:'Thème', nav_all_rabbis:'Tous les rabbins →',
      lang_toggle:'עברית',
      subtitle:'Cours de Torah — disponibles sur vos plateformes favorites',
      page_title:'Derniers cours',
      filter_all:'Tous les rabbins',
      dur_all:'Tous', dur_short:'< 5 min', dur_medium:'5–20 min', dur_long:'> 20 min',
      search_ph:'Rechercher un épisode ou un rav…',
      listen:'Écouter', playing:'En cours…', loading:'Chargement…',
      load_more:'Voir plus',
      no_episodes:'Aucun épisode trouvé.',
    },
    he: {
      nav_home:'ראשי', nav_rabbis:'הרבנים', nav_last_classes:'שיעורים אחרונים',
      nav_daf_hayomi:'דף היומי', nav_limud:'לימוד יומי', nav_hitat:'חת"ת', nav_hayomyom:'היום יום', nav_paracha:'פרשה', nav_themes:'נושא', nav_all_rabbis:'כל הרבנים →',
      lang_toggle:'Français',
      subtitle:'שיעורי תורה — זמינים בפלטפורמות האהובות עליכם',
      page_title:'שיעורים אחרונים',
      filter_all:'כל הרבנים',
      search_ph:'חיפוש שיעור או רב…',
      listen:'האזן', playing:'מתנגן…', loading:'טוען…',
      load_more:'טען עוד',
      no_episodes:'לא נמצאו פרקים.',
    },
  };
  let lang = localStorage.getItem('lang') || 'fr';
  function t(k) { return (I18N[lang]||{})[k] || I18N.fr[k] || k; }
  function applyLang() {
    document.documentElement.lang = lang === 'he' ? 'he' : 'fr';
    document.documentElement.dir  = lang === 'he' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (key.startsWith('|')) { el.placeholder = t(key.slice(1)); }
      else { el.textContent = t(key); }
    });
  }
  function toggleLang() { localStorage.setItem('lang', lang === 'fr' ? 'he' : 'fr'); location.reload(); }
  applyLang();

  document.addEventListener('click', e => {
    if (e.target.closest('.nav-submenu')) return;
    const caret = e.target.closest('.nav-dd-caret');
    document.querySelectorAll('.nav-dropdown.open').forEach(el => {
      if (!caret || el !== caret.closest('.nav-dropdown')) el.classList.remove('open');
    });
    if (caret) caret.closest('.nav-dropdown').classList.toggle('open');
  });

  // ─── Player ────────────────────────────────────────────────────────────────
  let activeBtn = null;
  const playerEl    = document.getElementById('player');
  const playerAudio = document.getElementById('player-audio');
  const playerTitle = document.getElementById('player-title');
  const playerCh    = document.getElementById('player-channel');
  const playerArt   = document.getElementById('player-art');







  function loadInPlayer(ep, chName, slug) {
    playerTitle.textContent = ep.title;
    playerCh.textContent    = chName;
    playerArt.src           = ep.thumbnail || `artwork/${slug}.png`;
    playerAudio.src         = ep.audio_url;
    playerAudio.play();
    playerEl.classList.remove('hidden');
  }

  document.addEventListener('click', e => {
    const btn = e.target.closest('.play-btn[data-ep-id]');
    if (!btn) return;
    const epId = btn.dataset.epId;
    const flat  = window._flat || [];
    const item  = flat.find(x => x.ep.video_id === epId);
    if (!item) return;

    if (btn === activeBtn) {
      if (playerAudio.paused) {
        playerAudio.play();
        btn.classList.add('playing');
        btn.innerHTML = pauseIcon() + ' ' + t('playing');
      } else {
        playerAudio.pause();
        btn.classList.remove('playing');
        btn.innerHTML = playIcon() + ' ' + t('listen');
      }
      return;
    }
    if (activeBtn) {
      activeBtn.classList.remove('playing');
      activeBtn.innerHTML = playIcon() + ' ' + t('listen');
    }
    activeBtn = btn;
    btn.classList.add('playing');
    btn.innerHTML = pauseIcon() + ' ' + t('playing');
    loadInPlayer(item.ep, item.ch.name, item.ch.slug);
  });

  document.getElementById('player-close').addEventListener('click', () => {
    playerAudio.pause();
    playerEl.classList.add('hidden');
    if (activeBtn) {
      activeBtn.classList.remove('playing');
      activeBtn.innerHTML = playIcon() + ' ' + t('listen');
      activeBtn = null;
    }
  });

  playerAudio.addEventListener('ended', () => {
    if (activeBtn) {
      activeBtn.classList.remove('playing');
      activeBtn.innerHTML = playIcon() + ' ' + t('listen');
      activeBtn = null;
    }
  });

  // ─── Helpers ───────────────────────────────────────────────────────────────




  function renderEpisodeItem(item) {
    const { ep, ch } = item;
    const thumb = ep.thumbnail
      ? `<a href="${epUrl(ep, ch.slug)}"><img class="ep-thumb" src="${escapeHtml(ep.thumbnail)}" alt="" loading="lazy"></a>`
      : `<div class="ep-thumb-ph"></div>`;
    const desc = ep.description
      ? `<p class="ep-desc">${escapeHtml(ep.description.slice(0, 200))}</p>`
      : '';
    const playBtn = ep.audio_url
      ? `<button class="play-btn" data-ep-id="${escapeHtml(ep.video_id)}">${playIcon()} ${t('listen')}</button>`
      : '';
    return `
      <li class="episode-item" data-slug="${escapeHtml(ch.slug)}" data-dur="${ep.duration_secs || 0}" data-ep-dur="${ep.duration_secs || 0}">
        ${thumb}
        <div class="ep-body">
          <div class="ep-channel">
            <img class="ep-channel-art" src="artwork/${escapeHtml(ch.slug)}.png" alt="" loading="lazy">
            <a class="ep-channel-name" href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.name)}</a>
          </div>
          <a class="ep-title" href="${epUrl(ep, ch.slug)}">${escapeHtml(ep.title)}</a>
          <div class="ep-date">${formatDate(ep.published)}${ep.duration_secs > 0 ? " - " + formatDuration(ep.duration_secs) : ""}</div>
          ${desc}${playBtn}
        </div>
      </li>`;
  }

  // ─── Main ──────────────────────────────────────────────────────────────────
  const PAGE_SIZE = 30;
  let visibleCount = PAGE_SIZE;
  let activeFilter = 'all';
  let searchQuery  = '';

  let activeDurFilter = 'all';
  function filterDurDC(btn) {
    document.querySelectorAll('#dur-filter-row .filter-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeDurFilter = btn.dataset.dur;
    visibleCount = PAGE_SIZE;
    renderList();
  }
  function filteredFlat() {
    let flat = window._flat || [];
    if (activeFilter !== 'all') flat = flat.filter(x => x.ch.slug === activeFilter || (x.speakers && x.speakers.includes(activeFilter)));
    if (activeDurFilter !== 'all') {
      flat = flat.filter(x => {
        const d = x.ep.duration_secs || 0;
        if (activeDurFilter === 'short')  return d > 0 && d < 300;
        if (activeDurFilter === 'medium') return d >= 300 && d <= 1200;
        if (activeDurFilter === 'long')   return d > 1200;
        return true;
      });
    }
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      flat = flat.filter(x =>
        x.ep.title.toLowerCase().includes(q) ||
        x.ch.name.toLowerCase().includes(q) ||
        (x.ep.description || '').toLowerCase().includes(q)
      );
    }
    return flat;
  }

  function renderList() {
    const app = document.getElementById('app');
    const items = filteredFlat();
    const slice = items.slice(0, visibleCount);

    if (!slice.length) {
      app.innerHTML = `<div class="state">${t('no_episodes')}</div>`;
      return;
    }

    const listHtml = slice.map(renderEpisodeItem).join('');
    const hasMore  = items.length > visibleCount;
    const moreHtml = hasMore
      ? `<div class="load-more-wrap"><button class="load-more-btn" id="load-more-btn">${t('load_more')} (${items.length - visibleCount})</button></div>`
      : '';

    app.innerHTML = `<div class="episode-card"><ul class="episode-list">${listHtml}</ul></div>${moreHtml}`;

    const loadBtn = document.getElementById('load-more-btn');
    if (loadBtn) {
      loadBtn.addEventListener('click', () => {
        visibleCount += PAGE_SIZE;
        renderList();
      });
    }
  }

  (async () => {
    const app = document.getElementById('app');
    let channels = [];
    try {
      const res = await fetch('channels.json');
      if (res.ok) {
        channels = (await res.json())
          .filter(ch => ch.enabled)
          .map(ch => ({ slug: ch.slug, name: ch.podcast_author, platforms: ch.platforms || {} }));
      }
    } catch (_) {}

    // Manually-added rabbis (extracted from aggregator channels like lev / rav-shimshone-attali)
    let speakers = [];
    try {
      const sres = await fetch('speakers.json');
      if (sres.ok) speakers = await sres.json();
    } catch (_) {}

    if (!channels.length) {
      app.innerHTML = `<div class="state">${t('no_episodes')}</div>`;
      return;
    }

    // Populate nav submenu
    const sub = document.getElementById('nav-rabbis-submenu');
    if (sub) {
      sub.innerHTML = channels.map(ch =>
        `<a href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.name)}</a>`
      ).join('') + `<a href="rabbins.html" class="nav-submenu-all">${t('nav_all_rabbis')}</a>`;
    }

    // Load all episodes
    const allData = await Promise.all(channels.map(async ch => {
      try {
        const r = await fetch(`feeds/${ch.slug}.entries.json`);
        const entries = r.ok ? await r.json() : [];
        return { ch, entries };
      } catch (_) { return { ch, entries: [] }; }
    }));

    // Flatten and sort by date desc
    const flat = [];
    for (const { ch, entries } of allData) {
      // Exclude the daily "HITAT DU JOUR" shiurim — they live on hitat.html, not the chronological feed.
      for (const ep of entries) if (!/HITAT DU JOUR/i.test(ep.title || '')) flat.push({ ep, ch });
    }
    flat.sort((a, b) => new Date(b.ep.published) - new Date(a.ep.published));

    // Tag each episode with the manually-added rabbi(s) it matches, within its source channel
    const speakerMatch = (title, patterns) =>
      (patterns || []).some(p => (title || '').toLowerCase().includes(p.toLowerCase()));
    for (const x of flat) {
      x.speakers = speakers
        .filter(sp => (sp.from_channels || []).includes(x.ch.slug) && speakerMatch(x.ep.title, sp.title_patterns))
        .map(sp => sp.slug);
    }

    window._flat = flat;

    const totalEp = flat.length;
    document.getElementById('page-subtitle').textContent = lang === 'he'
      ? `${totalEp} שיעורים מכל הרבנים, לפי סדר פרסום`
      : `${totalEp} cours de tous les rabbins, par ordre de publication`;

    // Build channel filter chips
    const filterRow = document.getElementById('filter-row');
    for (const { ch } of allData) {
      if (!ch) continue;
      const btn = document.createElement('button');
      btn.className = 'filter-chip';
      btn.dataset.slug = ch.slug;
      btn.innerHTML = `<img src="artwork/${escapeHtml(ch.slug)}.png" alt=""> ${escapeHtml(ch.name)}`;
      filterRow.appendChild(btn);
    }

    // Speaker chips (manually-added rabbis) — only those with matching episodes.
    // Uses the source channel's artwork (speakers have no own artwork).
    const speakerCounts = {};
    for (const x of flat) for (const s of (x.speakers || [])) speakerCounts[s] = (speakerCounts[s] || 0) + 1;
    for (const sp of speakers) {
      if (!speakerCounts[sp.slug]) continue;
      const btn = document.createElement('button');
      btn.className = 'filter-chip';
      btn.dataset.slug = sp.slug;
      const art = `artwork/${escapeHtml((sp.from_channels || [])[0] || sp.slug)}.png`;
      btn.innerHTML = `<img src="${art}" alt="" onerror="this.style.display='none'"> ${escapeHtml(sp.name)}`;
      filterRow.appendChild(btn);
    }

    filterRow.addEventListener('click', e => {
      const chip = e.target.closest('.filter-chip');
      if (!chip) return;
      activeFilter = chip.dataset.slug;
      visibleCount = PAGE_SIZE;
      filterRow.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c === chip));
      renderList();
    });

    // Search
    const searchEl = document.getElementById('search');
    let searchTimer;
    searchEl.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchQuery  = searchEl.value.trim();
        visibleCount = PAGE_SIZE;
        renderList();
      }, 200);
    });

    renderList();
  })();
</script>
