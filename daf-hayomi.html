    @keyframes spin { to { transform:rotate(360deg); } }
    #player { position:fixed; bottom:0; left:0; right:0; background:#1a1a2e; color:#fff; display:flex; align-items:center; gap:12px; padding:10px 16px; box-shadow:0 -2px 16px rgba(0,0,0,.25); z-index:200; transform:translateY(0); transition:transform .25s ease; }
    #player.hidden { transform:translateY(100%); }
    #player-art { width:44px; height:44px; border-radius:6px; object-fit:cover; background:#333; flex-shrink:0; }

    #player-title { font-size:.82rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    #player-audio { flex:2; min-width:120px; height:32px; accent-color:#e87722; }

<script>
  const I18N = {
    fr: {
      nav_home:'Accueil', nav_rabbis:'Rabbins', nav_last_classes:'Derniers cours', nav_daf_hayomi:'Daf Hayomi',
      nav_parasha:'Paracha', nav_themes:'Thème',
      lang_toggle:'עברית',
      subtitle:'Cours de Torah — disponibles sur vos plateformes favorites',
      page_title:'Daf Hayomi',
      filter_all:'Tous les rabbins',
      listen:'Écouter', playing:'En cours…', loading:'Chargement…',
      load_more:'Voir plus',
      no_episodes:'Aucun épisode Daf Hayomi trouvé.',
      copied:'Lien copié !',
    },
    he: {
      nav_home:'ראשי', nav_rabbis:'הרבנים', nav_last_classes:'שיעורים אחרונים', nav_daf_hayomi:'דף היומי',
      nav_parasha:'פרשה', nav_themes:'נושא',
      lang_toggle:'Français',
      subtitle:'שיעורי תורה — זמינים בפלטפורמות האהובות עליכם',
      page_title:'דף היומי',
      filter_all:'כל הרבנים',
      listen:'האזן', playing:'מתנגן…', loading:'טוען…',
      load_more:'טען עוד',
      no_episodes:'לא נמצאו שיעורי דף יומי.',
      copied:'הקישור הועתק!',
    },
  };
  let lang = localStorage.getItem('lang') || 'fr';
  function t(k) { return (I18N[lang]||{})[k] || I18N.fr[k] || k; }
  function applyLang() {
    document.documentElement.lang = lang === 'he' ? 'he' : 'fr';
    document.documentElement.dir  = lang === 'he' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  }
  function toggleLang() { localStorage.setItem('lang', lang === 'fr' ? 'he' : 'fr'); location.reload(); }
  applyLang();

  document.addEventListener('click', e => {
    if (e.target.closest('.nav-submenu')) return;
    const caret = e.target.closest('.nav-dd-caret');
    document.querySelectorAll('.nav-dropdown.open').forEach(el => {
      if (!caret || el !== caret.closest('.nav-dropdown')) el.classList.remove('open');
    });
    if (caret) caret.closest('.nav-dropdown').classList.toggle('open');
  });

  // ─── Player ───────────────────────────────────────────────────────────────
  let activeBtn = null, currentEpId = null;
  let currentSpeed = parseFloat(localStorage.getItem('playbackSpeed') || '1');
  const playerEl    = document.getElementById('player');
  const playerAudio = document.getElementById('player-audio');
  const playerTitle = document.getElementById('player-title');
  const playerCh    = document.getElementById('player-channel');
  const playerArt   = document.getElementById('player-art');

  function playIcon() { return `<svg viewBox="0 0 10 10" fill="currentColor"><polygon points="2,1 9,5 2,9"/></svg>`; }
  function pauseIcon() { return `<svg viewBox="0 0 10 10" fill="currentColor"><rect x="1.5" y="1" width="2.5" height="8"/><rect x="6" y="1" width="2.5" height="8"/></svg>`; }

  function setSpeed(rate) {
    currentSpeed = rate;
    localStorage.setItem('playbackSpeed', rate);
    playerAudio.playbackRate = rate;
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('active', parseFloat(b.dataset.speed) === rate));
  }
  document.querySelectorAll('.speed-btn').forEach(b => b.addEventListener('click', () => setSpeed(parseFloat(b.dataset.speed))));
  setSpeed(currentSpeed);

  function loadInPlayer(ep, chName, slug) {
    currentEpId = ep.video_id;
    playerTitle.textContent = ep.title;
    playerCh.textContent    = chName;
    playerArt.src           = ep.thumbnail || `artwork/${slug}.png`;
    playerAudio.src         = ep.audio_url;
    playerAudio.playbackRate = currentSpeed;
    const saved = parseInt(localStorage.getItem('resume_' + ep.video_id) || '0');
    if (saved > 5) {
      playerAudio.addEventListener('loadedmetadata', () => { playerAudio.currentTime = saved; }, { once: true });
    }
    playerAudio.play();
    playerEl.classList.remove('hidden');
  }

  playerAudio.addEventListener('timeupdate', () => {
    if (currentEpId && playerAudio.currentTime > 5)
      localStorage.setItem('resume_' + currentEpId, Math.floor(playerAudio.currentTime));
  });
  playerAudio.addEventListener('ended', () => {
    if (currentEpId) localStorage.removeItem('resume_' + currentEpId);
    currentEpId = null;
    if (activeBtn) { activeBtn.classList.remove('playing'); activeBtn.innerHTML = playIcon() + ' ' + t('listen'); activeBtn = null; }
  });

  document.addEventListener('click', e => {
    const btn = e.target.closest('.play-btn[data-ep-id]');
    if (btn) {
      const epId = btn.dataset.epId;
      const item = (window._flat || []).find(x => x.ep.video_id === epId);
      if (!item) return;
      if (btn === activeBtn) {
        if (playerAudio.paused) { playerAudio.play(); btn.classList.add('playing'); btn.innerHTML = pauseIcon() + ' ' + t('playing'); }
        else { playerAudio.pause(); btn.classList.remove('playing'); btn.innerHTML = playIcon() + ' ' + t('listen'); }
        return;
      }
      if (activeBtn) { activeBtn.classList.remove('playing'); activeBtn.innerHTML = playIcon() + ' ' + t('listen'); }
      activeBtn = btn; btn.classList.add('playing'); btn.innerHTML = pauseIcon() + ' ' + t('playing');
      loadInPlayer(item.ep, item.ch.name, item.ch.slug);
    }
  });

  document.getElementById('player-close').addEventListener('click', () => {
    playerAudio.pause(); playerEl.classList.add('hidden'); currentEpId = null;
    if (activeBtn) { activeBtn.classList.remove('playing'); activeBtn.innerHTML = playIcon() + ' ' + t('listen'); activeBtn = null; }
  });

  // ─── Toast & Share ────────────────────────────────────────────────────────
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.remove('show'), 2000);
  }
  document.addEventListener('click', e => {
    const btn = e.target.closest('.share-btn[data-epfile]');
    if (!btn) return;
    const url = `https://thetorahpodcast.net/${btn.dataset.epfile}`;
    if (navigator.share) navigator.share({ title: btn.dataset.title, url });
    else navigator.clipboard.writeText(url).then(() => showToast(t('copied')));
  });

  // ─── Helpers ──────────────────────────────────────────────────────────────
  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function slugify(title, maxLen = 70) {
    return title.toLowerCase().normalize('NFD')
      .replace(/\p{Mn}/gu, '')
      .replace(/[^a-z0-9א-תװ-׻]+/gu, '-')
      .replace(/^-+|-+$/g, '').replace(/-+/g, '-')
      .slice(0, maxLen).replace(/-+$/, '');
  }
  function epUrl(ep, chSlug) {
    return `${chSlug}/${slugify(ep.title || '')}-${(ep.published || '').slice(0, 10)}.html`;
  }
  function formatDate(iso) {
    return new Date(iso).toLocaleDateString(lang === 'he' ? 'he-IL' : 'fr-FR', { day:'numeric', month:'long', year:'numeric' });
  }
  function shareIcon() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="11" height="11"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>`;
  }

  function renderItem(item) {
    const { ep, ch } = item;
    const thumb = ep.thumbnail
      ? `<img class="ep-thumb" src="${escapeHtml(ep.thumbnail)}" alt="" loading="lazy">`
      : `<div class="ep-thumb-ph"></div>`;
    const desc = ep.description ? `<p class="ep-desc">${escapeHtml(ep.description.slice(0,200))}</p>` : '';
    const playBtn = ep.audio_url
      ? `<button class="play-btn" data-ep-id="${escapeHtml(ep.video_id)}">${playIcon()} ${t('listen')}</button>` : '';
    const shareBtn = ep.title && ep.published
      ? `<button class="share-btn" data-epfile="${epUrl(ep, ch.slug)}" data-title="${escapeHtml(ep.title)}">${shareIcon()} Partager</button>` : '';
    return `
      <li class="episode-item" data-slug="${escapeHtml(ch.slug)}">
        ${thumb}
        <div class="ep-body">
          <div class="ep-channel">
            <img class="ep-channel-art" src="artwork/${escapeHtml(ch.slug)}.png" alt="" loading="lazy">
            <a class="ep-channel-name" href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.name)}</a>
          </div>
          <a class="ep-title" href="${epUrl(ep, ch.slug)}">${escapeHtml(ep.title)}</a>
          <div class="ep-date">${formatDate(ep.published)}</div>
          ${desc}
          <div class="ep-actions">${playBtn}${shareBtn}</div>
        </div>
      </li>`;
  }

  // ─── Main ─────────────────────────────────────────────────────────────────
  const PAGE_SIZE = 30;
  let visibleCount = PAGE_SIZE, activeFilter = 'all';

  function filteredFlat() {
    const flat = window._flat || [];
    return activeFilter === 'all' ? flat : flat.filter(x => x.ch.slug === activeFilter);
  }

  function renderList() {
    const app = document.getElementById('app');
    const items = filteredFlat();
    const slice = items.slice(0, visibleCount);
    if (!slice.length) { app.innerHTML = `<div class="state">${t('no_episodes')}</div>`; return; }
    const hasMore = items.length > visibleCount;
    const moreHtml = hasMore
      ? `<div class="load-more-wrap"><button class="load-more-btn" id="load-more-btn">${t('load_more')} (${items.length - visibleCount})</button></div>` : '';
    app.innerHTML = `<ul class="episode-list">${slice.map(renderItem).join('')}</ul>${moreHtml}`;
    const lb = document.getElementById('load-more-btn');
    if (lb) lb.addEventListener('click', () => { visibleCount += PAGE_SIZE; renderList(); });
  }

  (async () => {
    const app = document.getElementById('app');
    let channels = [];
    try {
      const res = await fetch('channels.json');
      if (res.ok) channels = (await res.json()).filter(ch => ch.enabled).map(ch => ({ slug: ch.slug, name: ch.podcast_author }));
    } catch(_) {}
    if (!channels.length) { app.innerHTML = `<div class="state">${t('no_episodes')}</div>`; return; }

    const sub = document.getElementById('nav-rabbis-submenu');
    if (sub) sub.innerHTML = channels.map(ch => `<a href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.name)}</a>`).join('');

    const allData = await Promise.all(channels.map(async ch => {
      try { const r = await fetch(`feeds/${ch.slug}.entries.json`); return { ch, entries: r.ok ? await r.json() : [] }; }
      catch(_) { return { ch, entries: [] }; }
    }));

    // Flatten, filter Daf Hayomi, sort by date
    const flat = [];
    for (const { ch, entries } of allData) {
      for (const ep of entries) {
        if (ep.tags && ep.tags.includes('Daf Hayomi')) flat.push({ ep, ch });
      }
    }
    flat.sort((a, b) => new Date(b.ep.published) - new Date(a.ep.published));
    window._flat = flat;

    document.getElementById('page-subtitle').textContent = lang === 'he'
      ? `${flat.length} שיעורי דף יומי`
      : `${flat.length} cours de Daf Hayomi`;

    // Build channel filter chips (only channels that have Daf Hayomi episodes)
    const filterRow = document.getElementById('filter-row');
    const seen = new Set();
    for (const { ch } of flat) {
      if (seen.has(ch.slug)) continue;
      seen.add(ch.slug);
      const btn = document.createElement('button');
      btn.className = 'filter-chip';
      btn.dataset.slug = ch.slug;
      btn.innerHTML = `<img src="artwork/${escapeHtml(ch.slug)}.png" alt=""> ${escapeHtml(ch.name)}`;
      filterRow.appendChild(btn);
    }
    filterRow.addEventListener('click', e => {
      const chip = e.target.closest('.filter-chip');
      if (!chip) return;
      activeFilter = chip.dataset.slug;
      visibleCount = PAGE_SIZE;
      filterRow.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c === chip));
      renderList();
    });

    renderList();
  })();
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
