    apple: {

      cls:   'btn-apple',
      icon:  `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm0 4.3a7.7 7.7 0 0 1 5.44 13.14c-.37.37-.79.69-1.25.94-.1-.76-.28-1.63-.58-2.35.52-.48.87-1.15.87-1.9 0-1.43-1.16-2.59-2.59-2.59s-2.59 1.16-2.59 2.59c0 .75.32 1.42.83 1.9-.3.72-.48 1.59-.58 2.35a7.68 7.68 0 0 1-1.25-.94A7.7 7.7 0 0 1 12 4.3zm0 2.1a5.6 5.6 0 0 0-3.96 9.56c.18-.83.46-1.74.9-2.45a4.15 4.15 0 0 1-.54-2.03A3.6 3.6 0 0 1 12 7.9a3.6 3.6 0 0 1 3.6 3.58 4.15 4.15 0 0 1-.54 2.03c.44.71.72 1.62.9 2.45A5.6 5.6 0 0 0 12 6.4zm0 3.1a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm0 5.6c1.05 0 1.82.28 2.3.55-.26 1.18-.38 2.28-.32 3.03a7.65 7.65 0 0 1-1.98.26 7.65 7.65 0 0 1-1.98-.26c.06-.75-.06-1.85-.32-3.03.48-.27 1.25-.55 2.3-.55z"/></svg>`,
    },
    deezer: {
      label: 'Deezer',
      cls:   'btn-deezer',
      icon:  `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.944 17.369h4.512v1.601h-4.512zm0-3.075h4.512v1.6h-4.512zm0-3.074h4.512v1.601h-4.512zm-5.944 6.15h4.512v1.6H13zm0-3.075h4.512v1.6H13zm0-3.074h4.512v1.601H13zm-5.944 6.149h4.512v1.6H7.056zm0-3.075h4.512v1.6H7.056zM1.112 17.37h4.512v1.6H1.112z"/></svg>`,
    },
    rss: {
      label: 'RSS',
      cls:   'btn-rss',
      icon:  `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.18 15.64a2.18 2.18 0 0 1 2.18 2.18C8.36 19.01 7.38 20 6.18 20C4.98 20 4 19.01 4 17.82a2.18 2.18 0 0 1 2.18-2.18M4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27V4.44m0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93V10.1z"/></svg>`,
    },
  };

  function copyRss(btn, url) {
    navigator.clipboard.writeText(url).then(() => {
      btn.classList.add('copied');
      btn.textContent = t('copied');
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> ${t('copy_rss')}`;
      }, 2000);
    });
  }

  function latestEpisode(entries) {
    if (!entries.length) return null;
    return entries.reduce((best, ep) =>
      new Date(ep.published) > new Date(best.published) ? ep : best
    );
  }

  // ─── Bubble grid ───────────────────────────────────────────────────────────
  let allData     = [];
  let dataBySlug  = {};
  let currentSort = 'latest';

  function bubbleHtml({ ch, entries }) {
    const latest = latestEpisode(entries);
    const recent = latest && (Date.now() - new Date(latest.published).getTime()) <= 30 * 86400000;
    return `
      <button class="bubble" onclick="openRabbi('${escapeHtml(ch.slug)}')" title="${escapeHtml(ch.podcast_author)}">
        <span class="bubble-img-wrap">
          <img class="bubble-img" src="${ch.img ? escapeHtml(ch.img) : 'artwork/' + escapeHtml(ch.slug) + '.png'}" alt="${escapeHtml(ch.podcast_author)}"
               loading="lazy" onerror="this.style.background='#cfcfd6';this.removeAttribute('src')">
          ${recent ? '<span class="bubble-dot"></span>' : ''}
          ${favStarHtml(ch.slug, 'on-bubble')}
        </span>
        <span class="bubble-name">${escapeHtml(ch.podcast_author)}</span>
      </button>`;
  }

  function getSorted(sort) {
    const data = [...allData];
    if (sort === 'alpha') {
      data.sort((a, b) => a.ch.podcast_author.localeCompare(b.ch.podcast_author, 'fr'));
    } else {
      data.sort((a, b) => {
        const la = latestEpisode(a.entries);
        const lb = latestEpisode(b.entries);
        if (!la && !lb) return 0;
        if (!la) return 1;
        if (!lb) return -1;
        return new Date(lb.published) - new Date(la.published);
      });
    }
    return data;
  }

  let searchQuery = '';
  let favOnly = false;

  function toggleFavView(btn) {
    favOnly = !favOnly;
    btn.classList.toggle('active', favOnly);
    btn.setAttribute('aria-pressed', favOnly);
    render();
  }
  // When a star is toggled while the favorites filter is active, keep the grid in sync.
  document.addEventListener('favchange', () => { if (favOnly) render(); });

  // Keyword rule: match the rabbi NAME first (rank 0), then a course TITLE (rank 1).
  function matchRank(d, q) {
    const name = (d.ch.podcast_author || '').toLowerCase();
    if (name.includes(q)) return 0;
    if (d.entries.some(ep => ep.title && ep.title.toLowerCase().includes(q))) return 1;
    return -1;
  }

  function render() {
    let list = getSorted(currentSort);
    if (favOnly) {
      const favs = getFavoriteRavs();
      list = list.filter(d => favs.indexOf(d.ch.slug) !== -1);
    }
    if (searchQuery) {
      list = list
        .map(d => ({ d, r: matchRank(d, searchQuery) }))
        .filter(x => x.r >= 0)
        .sort((a, b) => a.r - b.r)   // stable: name matches before title-only matches
        .map(x => x.d);
    }
    document.getElementById('app').innerHTML = list.map(bubbleHtml).join('');
    const noRes = document.getElementById('no-results');
    if (noRes) {
      noRes.hidden = list.length > 0;
      noRes.textContent = (favOnly && !searchQuery) ? t('no_favs') : t('no_results');
    }
  }

  function setSort(sort) {
    currentSort = sort;
    document.getElementById('sort-latest').classList.toggle('active', sort === 'latest');
    document.getElementById('sort-alpha').classList.toggle('active', sort === 'alpha');
    render();
  }

  // ─── Detail modal ──────────────────────────────────────────────────────────
  function modalInner({ ch, entries }) {
    const platforms   = ch.platforms || {};
    const activeLinks = Object.entries(platforms).filter(([, url]) => url && url.trim());

    const rssUrl = `https://thetorahpodcast.net/feeds/${ch.slug}.xml`;
    const copyBtn = `<button class="copy-rss" onclick="copyRss(this,'${escapeHtml(rssUrl)}')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      ${t('copy_rss')}</button>`;

    const badges = activeLinks.map(([key, url]) => {
      const meta = PLATFORM_META[key];
      if (!meta) return '';
      return `<a class="platform-btn ${meta.cls}" href="${escapeHtml(url)}" target="_blank" rel="noopener">${meta.icon}${meta.label}</a>`;
    }).join('');

    const count  = entries.length;
    const latest = latestEpisode(entries);
    const epWord = count > 1 ? t('ep_plural') : t('ep_singular');
    const sub = count
      ? `${count} ${epWord}${latest ? `&nbsp;·&nbsp;${formatDate(latest.published)}` : ''}`
      : '';

    return `
      <div class="modal" onclick="event.stopPropagation()" role="dialog" aria-modal="true" aria-label="${escapeHtml(ch.podcast_author)}">
        <button class="modal-close" onclick="closeModal()" aria-label="Fermer">✕</button>
        <div class="modal-head">
          <img class="modal-art" src="${ch.img ? escapeHtml(ch.img) : 'artwork/' + escapeHtml(ch.slug) + '.png'}" alt=""
               onerror="this.style.background='#cfcfd6';this.removeAttribute('src')">
          <div>
            <div class="modal-name">${escapeHtml(ch.podcast_author)}${favStarHtml(ch.slug, 'on-channel')}</div>
            ${sub ? `<div class="modal-sub">${sub}</div>` : ''}
          </div>
        </div>
        <div class="platform-links">${badges}${copyBtn}</div>
        ${latest ? `<div class="modal-latest">${t('last')} ${escapeHtml(latest.title)}</div>` : ''}
        <a class="modal-all" href="${escapeHtml(ch.slug)}.html">${t('all_courses')}</a>
      </div>`;
  }

  function openRabbi(slug) {
    const d = dataBySlug[slug];
    if (!d) return;
    const ov = document.getElementById('modal-overlay');
    ov.innerHTML = modalInner(d);
    ov.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    const ov = document.getElementById('modal-overlay');
    ov.classList.remove('open');
    ov.innerHTML = '';
    document.body.style.overflow = '';
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  (async () => {
    const app = document.getElementById('app');

    let channels = [], speakers = [];
    try {
      const [chRes, spRes] = await Promise.all([fetch('channels.json'), fetch('speakers.json')]);
      if (chRes.ok) channels = (await chRes.json()).filter(ch => ch.enabled);
      if (spRes.ok) speakers = await spRes.json();
    } catch (_) {}

    if (!channels.length) {
      app.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:#aaa;padding:40px">${t('no_channels')}</p>`;
      document.getElementById('header-stats').textContent = '';
      return;
    }

    const channelData = await Promise.all(channels.map(async ch => {
      try {
        const r = await fetch(`feeds/${ch.slug}.entries.json`);
        const entries = r.ok ? await r.json() : [];
        return { ch, entries };
      } catch (_) {
        return { ch, entries: [] };
      }
    }));

    // Build speaker pseudo-channels by filtering source channel entries
    const entriesCache = Object.fromEntries(channelData.map(({ ch, entries }) => [ch.slug, entries]));
    const speakerData = speakers.map(sp => {
      const entries = sp.from_channels.flatMap(slug =>
        (entriesCache[slug] || []).filter(ep =>
          sp.title_patterns.some(p => ep.title && ep.title.toLowerCase().includes(p.toLowerCase()))
        )
      ).sort((a, b) => new Date(b.published) - new Date(a.published));
      // Speakers have no dedicated artwork/<slug>.png — represent them with the
      // thumbnail of their most recent episode (entries are sorted newest-first),
      // matching the header image used on their dedicated page (generate_channel_pages.py).
      const repImg = (entries.find(e => e.thumbnail) || {}).thumbnail || '';
      return {
        ch: { slug: sp.slug, podcast_author: sp.name, platforms: {}, language: sp.language, img: repImg },
        entries
      };
    });

    allData    = [...channelData, ...speakerData];
    dataBySlug = Object.fromEntries(allData.map(d => [d.ch.slug, d]));

    const totalEpisodes = channelData.reduce((sum, { entries }) => sum + entries.length, 0);
    const approxH = Math.round(totalEpisodes * 0.75);
    const nRabbis = channels.length + speakers.length;
    document.getElementById('header-stats').textContent =
      lang === 'he'
        ? `${nRabbis} ערוצים · ${totalEpisodes} שיעורים · ~${approxH} שעות`
        : `${nRabbis} rabbins · ${totalEpisodes} cours · ~${approxH}h de Torah`;

    setSort(currentSort);

    // Reusable homepage-style carousel: latest courses across all rabbanim.
    (function buildRabbiCarousel() {
      const flat = [];
      allData.forEach(({ ch, entries }) => (entries || []).forEach(ep => {
        if (!/HITAT DU JOUR/i.test(ep.title || ''))
          flat.push({ ep, ch: { slug: ch.slug, name: ch.podcast_author } });
      }));
      flat.sort((a, b) => new Date(b.ep.published) - new Date(a.ep.published));
      const car = buildCarousel(lang === 'he' ? 'שיעורים אחרונים' : 'Derniers cours', flat.slice(0, 15));
      const mount = document.getElementById('rabbi-carousel');
      if (car && mount) mount.appendChild(car);
    })();

    const searchInput = document.getElementById('rabbi-search');
    if (searchInput) searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value.toLowerCase().trim();
      render();
    });

    const sub = document.getElementById('nav-rabbis-submenu');
    if (sub) sub.innerHTML = [
      ...channels.map(ch => `<a href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.podcast_author)}</a>`),
      ...speakers.map(sp => `<a href="${escapeHtml(sp.slug)}.html">${escapeHtml(sp.name)}</a>`)
    ].join('') + `<a class="nav-submenu-all" href="rabbins.html">Tous les rabbins →</a>`;

    document.addEventListener('click', e => {
      if (e.target.closest('.nav-submenu')) return;
      const caret = e.target.closest('.nav-dd-caret');
      document.querySelectorAll('.nav-dropdown.open').forEach(el => {
        if (!caret || el !== caret.closest('.nav-dropdown')) el.classList.remove('open');
      });
      if (caret) caret.closest('.nav-dropdown').classList.toggle('open');
    });
  })();
</script>
