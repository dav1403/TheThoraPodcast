  <style>

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f0;
      color: #222;
      line-height: 1.5;

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 28px 20px;

    header p  { color: #aab; font-size: 0.95rem; margin-bottom: 14px; }
    .header-nav {
      display: flex;
      justify-content: center;

      gap: 6px;
      padding: 0 16px 20px;
    }
    .header-nav a {
      color: rgba(255,255,255,.65);
      text-decoration: none;
      font-size: 0.8rem;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.2);
      transition: background .15s, color .15s, border-color .15s;
    }
    .header-nav a:hover { color: #fff; border-color: rgba(255,255,255,.5); background: rgba(255,255,255,.1); }
    .header-nav a.active { color: #1a1a2e; background: #fff; border-color: #fff; font-weight: 600; }
    .nav-dropdown { position: relative; display: inline-flex; }
    .nav-dd-link { color: rgba(255,255,255,.65); text-decoration: none; font-size: .8rem; padding: 5px 4px 5px 14px; border-radius: 20px 0 0 20px; border: 1px solid rgba(255,255,255,.2); border-right: none; transition: background .15s, color .15s; }
    .nav-dd-link:hover { color: #fff; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.5); }
    .nav-dd-caret { color: rgba(255,255,255,.65); font-size: .8rem; padding: 5px 10px 5px 6px; border-radius: 0 20px 20px 0; border: 1px solid rgba(255,255,255,.2); border-left: none; background: none; cursor: pointer; font-family: inherit; transition: background .15s, color .15s; }
    .nav-dd-caret:hover, .nav-dropdown.open .nav-dd-caret { color: #fff; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.5); }
    .nav-dd-link.active { color: #1a1a2e; background: #fff; border-color: #fff; font-weight: 600; }
    .nav-dd-link.active + .nav-dd-caret { color: #1a1a2e; background: #fff; border-color: #fff; }
    .nav-submenu { display: none; position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: #252545; border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 10px; z-index: 300; box-shadow: 0 8px 28px rgba(0,0,0,.5); flex-wrap: wrap; gap: 4px; min-width: 340px; max-width: 92vw; }
    .nav-dropdown.open .nav-submenu { display: flex; }
    .nav-submenu a { color: rgba(255,255,255,.78); text-decoration: none; padding: 6px 12px; border-radius: 20px; font-size: .78rem; white-space: nowrap; border: 1px solid rgba(255,255,255,.15); transition: background .12s, color .12s; }
    .nav-submenu a:hover { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.35); }
    .nav-submenu .nav-submenu-all { color: rgba(255,255,255,.5); border-style: dashed; font-size: .74rem; margin-top: 4px; width: 100%; text-align: center; }
    .header-stats { font-size: 0.88rem; color: #9ab; min-height: 1.3em; margin-bottom: 12px; }
    .lang-btn { color: rgba(255,255,255,.65); font-size: 0.8rem; padding: 5px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,.2); background: none; cursor: pointer; font-family: inherit; transition: background .15s, color .15s; }
    .lang-btn:hover { color: #fff; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.5); }

    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 40px; }

    /* Theme grid */
    #theme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 36px;
    }
    .theme-btn {
      background: #fff;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      transition: border-color .15s, box-shadow .15s, transform .12s;
    }
    .theme-btn:hover { border-color: #1a1a2e; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    .theme-btn.active { border-color: #e87722; background: #fff8f3; }
    .theme-btn .theme-name { font-size: 0.88rem; font-weight: 600; color: #222; }
    .theme-btn .theme-count { font-size: 0.72rem; color: #aaa; margin-top: 3px; }

    /* Episodes panel */
    #episodes-panel { display: none; }
    #episodes-panel.visible { display: block; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }
    .panel-title { font-size: 1.25rem; font-weight: 700; }
    .panel-close {
      background: none;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.8rem;
      color: #666;
      cursor: pointer;
    }
    .panel-close:hover { background: #eee; }

    .episode-list { list-style: none; }
    .ep-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      margin-bottom: 10px;
      display: flex;
      gap: 14px;
      padding: 13px 16px;
      align-items: flex-start;
    }
    .ep-thumb {
      width: 80px; height: 54px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
      background: #ddd;
    }
    .ep-thumb-ph {
      width: 80px; height: 54px;
      border-radius: 6px;
      flex-shrink: 0;
      background: #e8e8e8;
    }
    .ep-body { flex: 1; min-width: 0; }
    .ep-ch {
      font-size: 0.68rem;
      color: #e87722;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
      text-decoration: none;
    }
    .ep-ch:hover { text-decoration: underline; }
    .ep-title {
      font-weight: 600;
      font-size: 0.88rem;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-date { font-size: 0.73rem; color: #888; margin-bottom: 6px; }
    .ep-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .ep-tag {
      font-size: 0.65rem;
      background: #f0f0f0;
      color: #555;
      border-radius: 10px;
      padding: 2px 8px;
    }
    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 5px 13px;
      font-size: 0.76rem;
      cursor: pointer;
      transition: background .15s;
    }
    .play-btn:hover { background: #2d2d50; }
    .play-btn.playing { background: #e87722; }
    .play-btn svg { width: 10px; height: 10px; flex-shrink: 0; }

    .state {
      padding: 28px 20px;
      text-align: center;
      color: #888;
      font-size: 0.9rem;
    }
    .state.loading::before {
      content: '';
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #ccc;
      border-top-color: #555;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Persistent player */
    #player {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      box-shadow: 0 -2px 16px rgba(0,0,0,.25);
      z-index: 200;
      transform: translateY(0);
      transition: transform .25s ease;
    }
    #player.hidden { transform: translateY(100%); }
    #player-art {
      width: 44px; height: 44px;
      border-radius: 6px;
      object-fit: cover;
      background: #333;
      flex-shrink: 0;
    }
    #player-info { min-width: 0; flex: 1; }
    #player-title {
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #player-channel { font-size: 0.68rem; color: #99a; }
    #player-audio {
      flex: 2;
      min-width: 120px;
      height: 32px;
      accent-color: #e87722;
    }
    #player-close {
      background: none;
      border: none;
      color: #778;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 6px;
      flex-shrink: 0;
      line-height: 1;
    }
    #player-close:hover { color: #fff; }

    @media (max-width: 500px) {
      .ep-thumb, .ep-thumb-ph { display: none; }
      #player-art { display: none; }
      #theme-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>

<script>
  // ─── i18n ─────────────────────────────────────────────────────────────────
  const I18N = {
    fr: {
      nav_home:'Accueil', nav_rabbis:'Rabbins', nav_last_classes:'Derniers cours', nav_daf_hayomi:'Daf Hayomi', nav_parasha:'Paracha', nav_themes:'Thème',
      lang_toggle:'עברית',
      subtitle_themes:'Cours de Torah par thème',
      listen:'Écouter', playing:'En cours…', loading:'Chargement…',
      close:'Fermer ✕', no_ep:'Aucun épisode pour ce thème.',
      ep_singular:'épisode', ep_plural:'épisodes',
    },
    he: {
      nav_home:'ראשי', nav_rabbis:'הרבנים', nav_last_classes:'שיעורים אחרונים', nav_daf_hayomi:'דף היומי', nav_parasha:'פרשה', nav_themes:'נושא',
      lang_toggle:'Français',
      subtitle_themes:'שיעורי תורה לפי נושא',
      listen:'האזן', playing:'מתנגן…', loading:'טוען…',
      close:'סגור ✕', no_ep:'אין פרקים בנושא זה.',
      ep_singular:'פרק', ep_plural:'פרקים',
    },
  };
  const THEME_HE = {
    'Chabbat':'שבת', 'Tefila':'תפילה', 'Téchouva':'תשובה', 'Emouna':'אמונה',
    'Etude de Torah':'לימוד תורה', 'Moussar':'מוסר', 'Halakha':'הלכה',
    'Kabbala & Spiritualité':'קבלה ורוחניות', 'Mariage & Famille':'נישואין ומשפחה',
    'Daf Hayomi':'דף היומי', 'Likoutei Moharan':'ליקוטי מוהר"ן',
    'Roch Hachana & Yom Kippour':'ראש השנה ויום כיפור',
    "Souccot & Sim'hat Torah":'סוכות ושמחת תורה',
    'Hanoucca':'חנוכה', 'Pourim':'פורים', "Pessa'h":'פסח',
    'Chavouot':'שבועות', 'Paracha':'פרשה', 'Histoire juive':'היסטוריה יהודית',
    'Am Israël & Actualité':'עם ישראל ועדכונים', 'Santé & Réfoua':'בריאות ורפואה',
    'Parnassa':'פרנסה',
  };
  let lang = localStorage.getItem('lang') || 'fr';
  function t(k) { return (I18N[lang]||{})[k] || I18N.fr[k] || k; }
  function themeName(frKey) { return lang === 'he' && THEME_HE[frKey] ? THEME_HE[frKey] : frKey; }
  function applyLang() {
    document.documentElement.lang = lang === 'he' ? 'he' : 'fr';
    document.documentElement.dir  = lang === 'he' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.dataset.i18n;
      if (k.startsWith('|')) el.placeholder = t(k.slice(1));
      else el.textContent = t(k);
    });
  }
  function toggleLang() { localStorage.setItem('lang', lang === 'fr' ? 'he' : 'fr'); location.reload(); }
  function renderStats(nCh, nEp) {
    const el = document.getElementById('header-stats');
    if (!el) return;
    el.textContent = lang === 'he'
      ? `${nCh} ערוצים · ${nEp} שיעורים פורסמו`
      : `Déjà ${nCh} chaînes · ${nEp} cours publiés`;
  }
  applyLang();

  const THEMES = [
    "Chabbat","Tefila","Téchouva","Emouna","Etude de Torah","Moussar",
    "Halakha","Kabbala & Spiritualité","Mariage & Famille",
    "Daf Hayomi","Likoutei Moharan",
    "Roch Hachana & Yom Kippour","Souccot & Sim'hat Torah","Hanoucca",
    "Pourim","Pessa'h","Chavouot","Paracha","Histoire juive",
    "Am Israël & Actualité","Santé & Réfoua","Parnassa"
  ];

  const CHANNELS = [
    { slug: "rabbin-jonas",         name: "Rabbin Jonas" },
    { slug: "rav-barak-ben-nissan", name: "Rav Barak Ben Nissan" },
    { slug: "rav-itshak-cohen",     name: "Rav Itshak Cohen" },
    { slug: "rav-liran-ishai",      name: "Rav Liran Ishaï" },
    { slug: "rav-meir-david-shmueli", name: "Rav Meir David Shmueli" },
    { slug: "rav-menahem-sakhoun",  name: "Rav Menahem Sakhoun" },
    { slug: "rav-ruben-attal",      name: "Rav Ruben Attal" },
    { slug: "rav-yaakov-sitruk",    name: "Rav Yaakov Sitruk" },
    { slug: "rav-yonathan-mergui",  name: "Rav Yonathan Mergui" },
  ];

  let allData = [];        // [{ ch, entries }]
  let themeIndex = {};     // theme -> [{ep, ch, globalIdx}]
  let activeBtn  = null;
  let currentTheme = null;

  const playerEl    = document.getElementById('player');
  const playerAudio = document.getElementById('player-audio');
  const playerTitle = document.getElementById('player-title');
  const playerCh    = document.getElementById('player-channel');
  const playerArt   = document.getElementById('player-art');

  function playIcon()  { return `<svg viewBox="0 0 10 10" fill="currentColor"><polygon points="2,1 9,5 2,9"/></svg>`; }
  function pauseIcon() { return `<svg viewBox="0 0 10 10" fill="currentColor"><rect x="1.5" y="1" width="2.5" height="8"/><rect x="6" y="1" width="2.5" height="8"/></svg>`; }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function formatDate(iso) {
    const locale = lang === 'he' ? 'he-IL' : 'fr-FR';
    return new Date(iso).toLocaleDateString(locale, { day:'numeric', month:'long', year:'numeric' });
  }

  function loadInPlayer(ep, chName, slug) {
    playerTitle.textContent = ep.title;
    playerCh.textContent    = chName;
    playerArt.src           = ep.thumbnail || `artwork/${slug}.png`;
    playerAudio.src         = ep.audio_url;
    playerAudio.play();
    playerEl.classList.remove('hidden');
  }

  // Global click delegation
  document.addEventListener('click', e => {
    const btn = e.target.closest('.play-btn[data-gidx]');
    if (btn) {
      const gidx = +btn.dataset.gidx;
      const item = allEpisodes[gidx];
      if (!item) return;
      if (btn === activeBtn) {
        if (playerAudio.paused) {
          playerAudio.play();
          btn.classList.add('playing');
          btn.innerHTML = pauseIcon() + ' ' + t('playing');
        } else {
          playerAudio.pause();
          btn.classList.remove('playing');
          btn.innerHTML = playIcon() + ' ' + t('listen');
        }
        return;
      }
      if (activeBtn) {
        activeBtn.classList.remove('playing');
        activeBtn.innerHTML = playIcon() + ' Écouter';
      }
      activeBtn = btn;
      btn.classList.add('playing');
      btn.innerHTML = pauseIcon() + ' En cours…';
      loadInPlayer(item.ep, item.ch.name, item.ch.slug);
    }
  });

  document.getElementById('player-close').addEventListener('click', () => {
    playerAudio.pause();
    playerEl.classList.add('hidden');
    if (activeBtn) {
      activeBtn.classList.remove('playing');
      activeBtn.innerHTML = playIcon() + ' Écouter';
      activeBtn = null;
    }
  });

  playerAudio.addEventListener('ended', () => {
    if (activeBtn) {
      activeBtn.classList.remove('playing');
      activeBtn.innerHTML = playIcon() + ' Écouter';
      activeBtn = null;
    }
  });

  document.getElementById('panel-close').addEventListener('click', () => {
    document.getElementById('episodes-panel').classList.remove('visible');
    document.querySelectorAll('.theme-btn.active').forEach(b => b.classList.remove('active'));
    currentTheme = null;
    window.location.hash = '';
  });

  let allEpisodes = []; // flat array for gidx lookup

  async function loadAll() {
    const results = await Promise.allSettled(
      CHANNELS.map(ch =>
        fetch(`feeds/${ch.slug}.entries.json`)
          .then(r => r.ok ? r.json() : [])
          .then(entries => ({ ch, entries }))
      )
    );
    allData = results
      .filter(r => r.status === 'fulfilled')
      .map(r => r.value);

    // Build flat array and theme index
    THEMES.forEach(t => themeIndex[t] = []);
    allData.forEach(({ ch, entries }) => {
      entries.forEach(ep => {
        const gidx = allEpisodes.length;
        allEpisodes.push({ ep, ch, gidx });
        (ep.tags || []).forEach(tag => {
          if (themeIndex[tag]) themeIndex[tag].push({ ep, ch, gidx });
        });
      });
    });

    // Sort each theme by date desc
    Object.values(themeIndex).forEach(arr =>
      arr.sort((a, b) => new Date(b.ep.published) - new Date(a.ep.published))
    );

    const totalEp = allEpisodes.length;
    renderStats(allData.length, totalEp);

    renderGrid();

    const sub = document.getElementById('nav-rabbis-submenu');
    if (sub) sub.innerHTML = allData.map(({ ch }) =>
      `<a href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.name)}</a>`
    ).join('') + `<a class="nav-submenu-all" href="links.html">Tous les rabbins →</a>`;

    document.addEventListener('click', e => {
      if (e.target.closest('.nav-submenu')) return;
      const caret = e.target.closest('.nav-dd-caret');
      document.querySelectorAll('.nav-dropdown.open').forEach(el => {
        if (!caret || el !== caret.closest('.nav-dropdown')) el.classList.remove('open');
      });
      if (caret) caret.closest('.nav-dropdown').classList.toggle('open');
    });

    const hash = window.location.hash.replace('#', '');
    if (hash) openTheme(decodeURIComponent(hash));
  }

  function renderGrid() {
    const grid = document.getElementById('theme-grid');
    grid.innerHTML = THEMES.map(t => {
      const count = themeIndex[t] ? themeIndex[t].length : 0;
      const epWord = count !== 1 ? I18N[lang].ep_plural : I18N[lang].ep_singular;
      return `<button class="theme-btn" data-theme="${escapeHtml(t)}">
        <div class="theme-name">${escapeHtml(themeName(t))}</div>
        <div class="theme-count">${count} ${epWord}</div>
      </button>`;
    }).join('');

    grid.addEventListener('click', e => {
      const btn = e.target.closest('.theme-btn');
      if (!btn) return;
      const theme = btn.dataset.theme;
      if (currentTheme === theme) {
        document.getElementById('episodes-panel').classList.remove('visible');
        btn.classList.remove('active');
        currentTheme = null;
        window.location.hash = '';
        return;
      }
      document.querySelectorAll('.theme-btn.active').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      openTheme(theme);
    });
  }

  function openTheme(theme) {
    currentTheme = theme;
    window.location.hash = encodeURIComponent(theme);

    const panel = document.getElementById('episodes-panel');
    document.getElementById('panel-title').textContent = themeName(theme);
    const list = document.getElementById('episode-list');
    const items = themeIndex[theme] || [];

    if (items.length === 0) {
      list.innerHTML = `<li class="state">${t('no_ep')}</li>`;
    } else {
      list.innerHTML = items.map(({ ep, ch, gidx }) => {
        const thumb = ep.thumbnail
          ? `<img class="ep-thumb" src="${escapeHtml(ep.thumbnail)}" alt="" loading="lazy">`
          : `<div class="ep-thumb-ph"></div>`;
        const otherTags = (ep.tags || []).filter(tag => tag !== theme);
        const tagPills  = otherTags.length
          ? `<div class="ep-tags">${otherTags.map(tag => `<span class="ep-tag">${escapeHtml(themeName(tag))}</span>`).join('')}</div>`
          : '';
        const playBtn = ep.audio_url
          ? `<button class="play-btn" data-gidx="${gidx}">${playIcon()} ${t('listen')}</button>`
          : '';
        return `<li class="ep-card">
          ${thumb}
          <div class="ep-body">
            <a class="ep-ch" href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.name)}</a>
            <div class="ep-title" title="${escapeHtml(ep.title)}">${escapeHtml(ep.title)}</div>
            <div class="ep-date">${formatDate(ep.published)}</div>
            ${tagPills}${playBtn}
          </div>
        </li>`;
      }).join('');
    }

    panel.classList.add('visible');
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });

    // Sync active button highlight
    document.querySelectorAll('.theme-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.theme === theme);
    });
  }

  loadAll();
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
