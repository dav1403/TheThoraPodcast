    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .nav-dropdown { position: relative; display: inline-flex; }
    .nav-dd-link { color: var(--color-on-inverse-muted); text-decoration: none; font-size: .8rem; padding: 5px 4px 5px 14px; border-radius: 20px 0 0 20px; border: 1px solid var(--color-inverse-border); border-right: none; transition: background .15s, color .15s; }

    .nav-dd-caret { color: var(--color-on-inverse-muted); font-size: .8rem; padding: 5px 10px 5px 6px; border-radius: 0 20px 20px 0; border: 1px solid var(--color-inverse-border); border-left: none; background: none; cursor: pointer; font-family: inherit; transition: background .15s, color .15s; }
    .nav-dd-caret:hover, .nav-dropdown.open .nav-dd-caret { color: var(--color-on-inverse); background: var(--color-inverse-hover); border-color: var(--color-inverse-scrim); }
    .nav-dd-link.active { color: var(--color-inverse-bg); background: var(--color-on-inverse); border-color: var(--color-on-inverse); font-weight: 600; }

    .nav-submenu { display: none; position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--color-inverse-surface); border: 1px solid var(--color-inverse-border-faint); border-radius: 12px; padding: 10px; z-index: 300; box-shadow: 0 8px 28px var(--shadow-overlay); flex-wrap: wrap; gap: 4px; min-width: 340px; max-width: 92vw; }

    .lang-opt:hover { color: var(--color-on-inverse); }
    .lang-opt.active { background: var(--color-accent); color: var(--color-on-accent); }


    /* Sticky search bar */
    .sticky-bar { position: sticky; top: 0; z-index: 100; background: var(--color-inverse-bg); padding: 10px 16px 12px; }
    .sticky-inner { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .search-wrap-global { position: relative; }
    .search-icon-global { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,.4); pointer-events: none; }

    .search-input-global::placeholder { color: rgba(255,255,255,.4); }
    .search-input-global:focus { background: rgba(255,255,255,.18); }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 40px; }

    /* Theme grid */
    #theme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 36px;
    }
    .theme-btn {
      background: var(--color-surface);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 1px 4px var(--shadow-card);
      transition: border-color .15s, box-shadow .15s, transform .12s;
    }
    .theme-btn:hover { border-color: var(--color-primary); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    .theme-btn.active { border-color: var(--color-accent); background: var(--color-surface-accent-soft); }
    .theme-btn .theme-name { font-size: 0.88rem; font-weight: 600; color: var(--color-text); }
    .theme-btn .theme-count { font-size: 0.72rem; color: var(--color-text-disabled); margin-top: 3px; }

    /* Episodes panel */
    #episodes-panel { display: none; }
    #episodes-panel.visible { display: block; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }
    .panel-title { font-size: 1.25rem; font-weight: 700; }
    .panel-close {
      background: none;
      border: 1px solid var(--color-border-strong);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.8rem;
      color: var(--color-text-muted);
      cursor: pointer;
    }
    .panel-close:hover { background: var(--color-surface-alt); }

    .filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .filter-chip { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 20px; padding: 5px 13px; font-size: .78rem; color: var(--color-text-tertiary); cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 6px; transition: background .12s, border-color .12s, color .12s; }
    .filter-chip:hover { background: var(--color-surface-hover); border-color: var(--color-border-hover); color: var(--color-text); }
    .filter-chip.active { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-inverse); }
    .filter-chip img { width: 18px; height: 18px; border-radius: 4px; object-fit: cover; }

    .episode-list { list-style: none; }
    [data-ep-dur][hidden] { display: none !important; }
    .episode-item[hidden] { display: none !important; }
    .ep-card[hidden] { display: none !important; }
    .episode[hidden] { display: none !important; }
    .ep-card {
      background: var(--color-surface);
      border-radius: 10px;
      box-shadow: 0 1px 4px var(--shadow-card);
      margin-bottom: 10px;
      display: flex;
      gap: 14px;
      padding: 13px 16px;
      align-items: flex-start;
    }
    .dur-filter { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px; }
    .dur-btn { background:var(--color-surface); border:1px solid var(--color-border); border-radius:16px; padding:4px 13px; font-size:.76rem; cursor:pointer; color:var(--color-text-tertiary); transition:all .15s; font-family:inherit; }
    .dur-btn:hover { border-color:var(--color-text-disabled); color:var(--color-text-secondary); }
    .dur-btn.active { background:var(--color-primary); color:var(--color-on-inverse); border-color:var(--color-primary); }
    .ep-thumb {
      width: 80px; height: 54px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
      background: var(--color-border);
    }
    .ep-thumb-ph {
      width: 80px; height: 54px;
      border-radius: 6px;
      flex-shrink: 0;
      background: var(--color-skeleton);
    }
    .ep-body { flex: 1; min-width: 0; }
    .ep-ch {
      font-size: 0.68rem;
      color: var(--color-accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
      text-decoration: none;
    }
    .ep-ch:hover { text-decoration: underline; }
    .ep-title {
      font-weight: 600;
      font-size: 0.88rem;
      margin-bottom: 2px;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    }
    .ep-date { font-size: 0.73rem; color: var(--color-text-subtle); margin-bottom: 6px; }
    .ep-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
    .ep-tag {
      font-size: 0.65rem;
      background: var(--color-surface-muted);
      color: var(--color-text-tertiary);
      border-radius: 10px;
      padding: 2px 8px;
    }
    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--color-primary);
      color: var(--color-on-inverse);
      border: none;
      border-radius: 20px;
      padding: 5px 13px;
      font-size: 0.76rem;
      cursor: pointer;
      transition: background .15s;
    }
    .play-btn:hover { background: var(--color-primary-hover); }
    .play-btn.playing { background: var(--color-accent); }
    .play-btn svg { width: 10px; height: 10px; flex-shrink: 0; }

    .state {
      padding: 28px 20px;
      text-align: center;
      color: var(--color-text-subtle);
      font-size: 0.9rem;
    }
    .state.loading::before {
      content: '';
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--color-border-strong);
      border-top-color: var(--color-text-tertiary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Persistent player */
    #player {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--color-inverse-bg);
      color: var(--color-on-inverse);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      box-shadow: 0 -2px 16px rgba(0,0,0,.25);
      z-index: 200;
      transform: translateY(0);
      transition: transform .25s ease;
    }
    #player.hidden { transform: translateY(100%); }
    #player-art {
      width: 44px; height: 44px;
      border-radius: 6px;
      object-fit: cover;
      background: #333;
      flex-shrink: 0;
    }
    #player-info { min-width: 0; flex: 1; }
    #player-title {
      font-size: 0.82rem;
      font-weight: 600;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    }
    #player-channel { font-size: 0.68rem; color: #99a; }
    #player-audio {
      flex: 2;
      min-width: 120px;
      height: 32px;
      accent-color: var(--color-accent);
    }
    #player-close {
      background: none;
      border: none;
      color: #778;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 6px;
      flex-shrink: 0;
      line-height: 1;
    }
    #player-close:hover { color: var(--color-on-inverse); }
    #speed-cycle-btn { background:none; border:1px solid var(--color-inverse-border); color:var(--color-inverse-scrim); border-radius:4px; padding:3px 9px; font-size:.68rem; cursor:pointer; font-family:inherit; white-space:nowrap; flex-shrink:0; transition:background .12s,color .12s; }
    #speed-cycle-btn:hover { background:rgba(255,255,255,.15); color:var(--color-on-inverse); border-color:rgba(255,255,255,.4); }
    #speed-cycle-btn.active { color:var(--color-accent); border-color:var(--color-accent); }

    @media (max-width: 500px) {
      .ep-thumb, .ep-thumb-ph { display: none; }
      #player-art { display: none; }
      #theme-grid { grid-template-columns: repeat(2, 1fr); }
    }
  
    .site-footer { background: var(--color-inverse-bg); color: var(--color-inverse-scrim); text-align: center; padding: 20px 16px; font-size: .78rem; margin-top: 40px; }
    .site-footer a { color: var(--color-on-inverse-muted); text-decoration: none; margin: 0 8px; }
    .site-footer a:hover { color: var(--color-on-inverse); }
    /* Mobile: keep dropdown submenus centered under the nav and within the viewport (fixes off-screen/unclickable items on phones) */
    @media (max-width: 600px) {
      .header-nav { position: relative; }
      .nav-dropdown { position: static; }
      .nav-submenu { left: 50%; right: auto; transform: translateX(-50%); min-width: 0; max-width: calc(100vw - 24px); width: max-content; }
    }
  </style>
</head>
<body>

<header>
  <h1><a href="./" style="color:inherit;text-decoration:none">The Torah Podcast</a></h1>
  <p data-i18n="subtitle_themes">Cours de Torah par thème</p>
  <div class="header-stats" id="header-stats"></div>
  <nav class="header-nav">
    <a href="./" data-i18n="nav_home">Accueil</a>
    <div class="nav-dropdown" id="nav-dropdown">
      <a class="nav-dd-link" href="rabbins.html" data-i18n="nav_rabbis">Rabbins</a><button class="nav-dd-caret" aria-label="Voir la liste">▾</button>
      <div class="nav-submenu" id="nav-rabbis-submenu"><a class="nav-submenu-all" href="rabbins.html">Tous les rabbins →</a></div>
    </div>
    <a href="derniers-cours.html" data-i18n="nav_last_classes">Derniers cours</a>
    <div class="nav-dropdown">
      <a class="nav-dd-link" href="daf-hayomi.html" data-i18n="nav_limud">Limud Yomi</a><button class="nav-dd-caret" aria-label="Limud Yomi">▾</button>
      <div class="nav-submenu" style="min-width:170px;flex-direction:column;">
        <a href="daf-hayomi.html" data-i18n="nav_daf_hayomi">Daf Hayomi</a>
        <a href="hitat.html" data-i18n="nav_hitat">Hitat Yomi</a>
        <a href="hayom-yom.html" data-i18n="nav_hayomyom">Hayom Yom</a>

      </div>
    </div>
    <a href="paracha.html" data-i18n="nav_paracha">Paracha</a>
    <a href="themes.html" class="active" data-i18n="nav_themes">Thème</a>
  </nav>
  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" class="lang-opt" data-lang="fr" onclick="setLang('fr')">FR</button>
    <button type="button" class="lang-opt" data-lang="en" onclick="setLang('en')">EN</button>

  </div>
</header>

<div class="sticky-bar">
  <div class="sticky-inner">
    <div class="search-wrap-global">
      <svg class="search-icon-global" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input-global" id="global-search" type="search" placeholder="Rechercher un thème ou un épisode…" autocomplete="off">
    </div>
  </div>
</div>
<main>
  <div class="dur-filter" id="dur-filter">
    <button class="dur-btn active" data-dur="all" onclick="filterDurAll(this)">Tous</button>
    <button class="dur-btn" data-dur="short" onclick="filterDurAll(this)">&lt; 5 min</button>
    <button class="dur-btn" data-dur="medium" onclick="filterDurAll(this)">5–20 min</button>
    <button class="dur-btn" data-dur="long" onclick="filterDurAll(this)">&gt; 20 min</button>
  </div>
  <div id="theme-grid"><div class="state loading" data-i18n="loading">Chargement…</div></div>

  <div id="episodes-panel">
    <div class="panel-header">
      <div class="panel-title" id="panel-title"></div>
      <button class="panel-close" id="panel-close" data-i18n="close">Fermer ✕</button>
    </div>
    <div id="theme-carousel"></div>
    <div class="filter-row" id="rabbi-filter-row"></div>
    <ul class="episode-list" id="episode-list"></ul>
  </div>
</main>

<div id="player" class="hidden">
  <img id="player-art" src="" alt="">
  <div id="player-info">
    <div id="player-title"></div>
    <div id="player-channel"></div>
  </div>
  <audio id="player-audio" controls></audio>
  <button id="speed-cycle-btn" title="Vitesse de lecture">1×</button>
  <button id="player-close" title="Fermer">✕</button>
</div>

<script src="js/utils.js"></script>
<script>
  // ─── i18n ─────────────────────────────────────────────────────────────────
  const I18N = {
    fr: {
      nav_home:'Accueil', nav_rabbis:'Rabbins', nav_last_classes:'Derniers cours', nav_daf_hayomi:'Daf Hayomi', nav_limud:'Limud Yomi', nav_hitat:'Hitat Yomi', nav_hayomyom:'Hayom Yom', nav_paracha:'Paracha', nav_themes:'Thème',
      lang_toggle:'English',
      subtitle_themes:'Cours de Torah par thème',
      listen:'Écouter', playing:'En cours…', loading:'Chargement…',
      close:'Fermer ✕', no_ep:'Aucun épisode pour ce thème.',
      ep_singular:'épisode', ep_plural:'épisodes',
      filter_all:'Tous les rabbins',
    },
    en: {
      nav_home:'Home', nav_rabbis:'Rabbis', nav_last_classes:'Latest classes', nav_daf_hayomi:'Daf Hayomi', nav_limud:'Limud Yomi', nav_hitat:'Hitat Yomi', nav_hayomyom:'Hayom Yom', nav_paracha:'Parasha', nav_themes:'Topics',
      lang_toggle:'עברית',
      subtitle_themes:'Torah classes by topic',
      listen:'Listen', playing:'Playing…', loading:'Loading…',
      close:'Close ✕', no_ep:'No episodes for this topic.',
      ep_singular:'episode', ep_plural:'episodes',
      filter_all:'All rabbis',
    },
    he: {
      nav_home:'ראשי', nav_rabbis:'הרבנים', nav_last_classes:'שיעורים אחרונים', nav_daf_hayomi:'דף היומי', nav_limud:'לימוד יומי', nav_hitat:'חת"ת', nav_hayomyom:'היום יום', nav_paracha:'פרשה', nav_themes:'נושא',
      lang_toggle:'Français',
      subtitle_themes:'שיעורי תורה לפי נושא',
      listen:'האזן', playing:'מתנגן…', loading:'טוען…',
      close:'סגור ✕', no_ep:'אין פרקים בנושא זה.',
      ep_singular:'פרק', ep_plural:'פרקים',
      filter_all:'כל הרבנים',
    },
  };
  const THEME_HE = {
    'Chabbat':'שבת', 'Tefila':'תפילה', 'Téchouva':'תשובה', 'Emouna':'אמונה',
    'Etude de Torah':'לימוד תורה', 'Moussar':'מוסר', 'Halakha':'הלכה',
    'Kabbala & Spiritualité':'קבלה ורוחניות', 'Mariage & Famille':'נישואין ומשפחה',
    'Daf Hayomi':'דף היומי', 'Likoutei Moharan':'ליקוטי מוהר"ן',
    'Roch Hachana & Yom Kippour':'ראש השנה ויום כיפור',
    "Souccot & Sim'hat Torah":'סוכות ושמחת תורה',
    'Hanoucca':'חנוכה', 'Pourim':'פורים', "Pessa'h":'פסח',
    'Chavouot':'שבועות', 'Paracha':'פרשה', 'Histoire juive':'היסטוריה יהודית',
    'Am Israël & Actualité':'עם ישראל ועדכונים', 'Santé & Réfoua':'בריאות ורפואה',
    'Parnassa':'פרנסה',
  };
  const THEME_EN = {
    'Chabbat':'Shabbat', 'Tefila':'Prayer', 'Téchouva':'Repentance', 'Emouna':'Faith',
    'Etude de Torah':'Torah study', 'Moussar':'Mussar', 'Halakha':'Halakha',
    'Kabbala & Spiritualité':'Kabbalah & Spirituality', 'Mariage & Famille':'Marriage & Family',
    'Daf Hayomi':'Daf Hayomi', 'Likoutei Moharan':'Likutei Moharan',
    'Roch Hachana & Yom Kippour':'Rosh Hashana & Yom Kippur',
    "Souccot & Sim'hat Torah":"Sukkot & Simchat Torah",
    'Hanoucca':'Chanukah', 'Pourim':'Purim', "Pessa'h":'Passover',
    'Chavouot':'Shavuot', 'Paracha':'Parasha', 'Histoire juive':'Jewish history',
    'Am Israël & Actualité':'People of Israel & Current events', 'Santé & Réfoua':'Health & Refua',
    'Parnassa':'Livelihood',
  };
  let lang = localStorage.getItem('lang') || 'fr';
  function t(k) { return (I18N[lang]||{})[k] || I18N.fr[k] || k; }
  function themeName(frKey) { return lang === 'he' && THEME_HE[frKey] ? THEME_HE[frKey] : (lang === 'en' && THEME_EN[frKey] ? THEME_EN[frKey] : frKey); }
  function applyLang() {
    document.querySelectorAll('.lang-opt').forEach(function(b){ b.classList.toggle('active', b.dataset.lang === lang); });
    document.documentElement.lang = lang;
    document.documentElement.dir  = lang === 'he' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.dataset.i18n;
      if (k.startsWith('|')) el.placeholder = t(k.slice(1));
      else el.textContent = t(k);
    });
  }
  function setLang(l) { if (l === lang) return; localStorage.setItem('lang', l); location.reload(); }
  function renderStats(nCh, nEp) {
    const el = document.getElementById('header-stats');
    if (!el) return;
    const approxH = Math.round(nEp * 0.75);
    el.textContent = lang === 'he'
      ? `${nCh} ערוצים · ${nEp} שיעורים · ~${approxH} שעות`
      : (lang === 'en'
        ? `${nCh} rabbis · ${nEp} classes · ~${approxH}h of Torah`
        : `${nCh} rabbins · ${nEp} cours · ~${approxH}h de Torah`);
  }
  applyLang();

  const THEMES = [
    "Chabbat","Tefila","Téchouva","Emouna","Etude de Torah","Moussar",
    "Halakha","Kabbala & Spiritualité","Mariage & Famille",
    "Daf Hayomi","Likoutei Moharan",
    "Roch Hachana & Yom Kippour","Souccot & Sim'hat Torah","Hanoucca",
    "Pourim","Pessa'h","Chavouot","Paracha","Histoire juive",
    "Am Israël & Actualité","Santé & Réfoua","Parnassa"
  ];

  let CHANNELS = [];

  let allData = [];          // [{ ch, entries }]
  let themeIndex = {};       // theme -> [{ep, ch, globalIdx}]
  let activeBtn  = null;
  let currentTheme = null;
  let activeRabbiFilter = 'all';

  const playerEl    = document.getElementById('player');
  const playerAudio = document.getElementById('player-audio');
  const playerTitle = document.getElementById('player-title');
  const playerCh    = document.getElementById('player-channel');
  const playerArt   = document.getElementById('player-art');

  const SPEEDS = [1, 1.25, 1.5, 2];
  let currentSpeed = parseFloat(localStorage.getItem('playbackSpeed') || '1');
  const speedCycleBtn = document.getElementById('speed-cycle-btn');
  function updateSpeedBtn() {
    speedCycleBtn.textContent = currentSpeed + '×';
    speedCycleBtn.classList.toggle('active', currentSpeed !== 1);
  }
  updateSpeedBtn();
  speedCycleBtn.addEventListener('click', () => {
    const idx = SPEEDS.indexOf(currentSpeed);
    currentSpeed = SPEEDS[idx === -1 ? 1 : (idx + 1) % SPEEDS.length];
    localStorage.setItem('playbackSpeed', currentSpeed);
    if (playerAudio) playerAudio.playbackRate = currentSpeed;
    updateSpeedBtn();
  });



  function loadInPlayer(ep, chName, slug) {
    playerTitle.textContent = ep.title;
    playerCh.textContent    = chName;
    // 44 px slot — the thumbnail, never the 3000 px master.
    playerArt.onerror       = () => { playerArt.onerror = null; playerArt.src = `artwork/${slug}.png`; };
    playerArt.src           = ep.thumbnail || `artwork/thumb/${slug}.webp`;
    playerAudio.src         = ep.audio_url;
    playerAudio.playbackRate = currentSpeed;
    playerAudio.play();
    playerEl.classList.remove('hidden');
  }

  // Global click delegation
  document.addEventListener('click', e => {
    const btn = e.target.closest('.play-btn[data-gidx]');
    if (btn) {
      const gidx = +btn.dataset.gidx;
      const item = allEpisodes[gidx];
      if (!item) return;
      if (btn === activeBtn) {
        if (playerAudio.paused) {
          playerAudio.play();
          btn.classList.add('playing');
          btn.innerHTML = pauseIcon() + ' ' + t('playing');
        } else {
          playerAudio.pause();
          btn.classList.remove('playing');
          btn.innerHTML = playIcon() + ' ' + t('listen');
        }
        return;
      }
      if (activeBtn) {
        activeBtn.classList.remove('playing');
        activeBtn.innerHTML = playIcon() + ' ' + t('listen');
      }
      activeBtn = btn;
      btn.classList.add('playing');
      btn.innerHTML = pauseIcon() + ' ' + t('playing');
      loadInPlayer(item.ep, item.ch.name, item.ch.slug);
    }
  });

  document.getElementById('player-close').addEventListener('click', () => {
    playerAudio.pause();
    playerEl.classList.add('hidden');
    if (activeBtn) {
      activeBtn.classList.remove('playing');
      activeBtn.innerHTML = playIcon() + ' ' + t('listen');
      activeBtn = null;
    }
  });

  playerAudio.addEventListener('ended', () => {
    if (activeBtn) {
      activeBtn.classList.remove('playing');
      activeBtn.innerHTML = playIcon() + ' ' + t('listen');
      activeBtn = null;
    }
  });

  document.getElementById('panel-close').addEventListener('click', () => {
    document.getElementById('episodes-panel').classList.remove('visible');
    document.querySelectorAll('.theme-btn.active').forEach(b => b.classList.remove('active'));
    currentTheme = null;
    window.location.hash = '';
  });

  let allEpisodes = []; // flat array for gidx lookup

  async function loadAll() {
    try {
      const res = await fetch('channels.json');
      if (res.ok) CHANNELS = (await res.json()).filter(ch => ch.enabled).map(ch => ({ slug: ch.slug, name: ch.podcast_author, podcast_language: ch.podcast_language }));
    } catch(_) {}

    let speakerCount = 0;
    try {
      const sres = await fetch('speakers.json');
      if (sres.ok) speakerCount = (await sres.json()).length;
    } catch(_) {}

    const results = await Promise.allSettled(
      // fetchChannelEntries (js/utils.js) applies the course-language filter,
      // so every per-theme count below is already the count for that language.
      CHANNELS.map(ch => fetchChannelEntries(ch).then(entries => ({ ch, entries })))
    );
    allData = results
      .filter(r => r.status === 'fulfilled')
      .map(r => r.value);

    // Build flat array and theme index
    THEMES.forEach(t => themeIndex[t] = []);
    allData.forEach(({ ch, entries }) => {
      entries.forEach(ep => {
        const gidx = allEpisodes.length;
        allEpisodes.push({ ep, ch, gidx });
        (ep.tags || []).forEach(tag => {
          if (themeIndex[tag]) themeIndex[tag].push({ ep, ch, gidx });
        });
      });
    });

    // Sort each theme by date desc
    Object.values(themeIndex).forEach(arr =>
      arr.sort((a, b) => new Date(b.ep.published) - new Date(a.ep.published))
    );

    const totalEp = allEpisodes.length;
    const nCh = allData.filter(d => d.entries.length).length;
    // This page never loads the speakers' episodes, so under a filter it can
    // only vouch for the channels — count those alone rather than claim ravs
    // that may have nothing left in the selected language.
    renderStats(nCh + (courseLangFiltering() ? 0 : speakerCount), totalEp);

    renderGrid();

    const sub = document.getElementById('nav-rabbis-submenu');
    if (sub) sub.innerHTML = allData.map(({ ch }) =>
      `<a href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.name)}</a>`
    ).join('') + `<a class="nav-submenu-all" href="rabbins.html">Tous les rabbins →</a>`;

    document.addEventListener('click', e => {
      if (e.target.closest('.nav-submenu')) return;
      const caret = e.target.closest('.nav-dd-caret');
      document.querySelectorAll('.nav-dropdown.open').forEach(el => {
        if (!caret || el !== caret.closest('.nav-dropdown')) el.classList.remove('open');
      });
      if (caret) caret.closest('.nav-dropdown').classList.toggle('open');
    });

    const hash = window.location.hash.replace('#', '');
    if (hash) openTheme(decodeURIComponent(hash));
  }

  function renderGrid() {
    const grid = document.getElementById('theme-grid');
    grid.innerHTML = THEMES.map(t => {
      const count = themeIndex[t] ? themeIndex[t].length : 0;
      const epWord = count !== 1 ? I18N[lang].ep_plural : I18N[lang].ep_singular;
      return `<button class="theme-btn" data-theme="${escapeHtml(t)}">
        <div class="theme-name">${escapeHtml(themeName(t))}</div>
        <div class="theme-count">${count} ${epWord}</div>
      </button>`;
    }).join('');
    if (!allEpisodes.length && courseLangFiltering()) {
      grid.innerHTML = courseLangEmptyHtml();
      return;
    }

    grid.addEventListener('click', e => {
      const btn = e.target.closest('.theme-btn');
      if (!btn) return;
      const theme = btn.dataset.theme;
      if (currentTheme === theme) {
        document.getElementById('episodes-panel').classList.remove('visible');
        btn.classList.remove('active');
        currentTheme = null;
        window.location.hash = '';
        return;
      }
      document.querySelectorAll('.theme-btn.active').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      openTheme(theme);
    });
  }

  function renderEpisodeList(items, theme) {
    const list = document.getElementById('episode-list');
    const visible = activeRabbiFilter === 'all'
      ? items
      : items.filter(x => x.ch.slug === activeRabbiFilter);

    if (visible.length === 0) {
      list.innerHTML = courseLangFiltering() && activeRabbiFilter === 'all'
        ? `<li>${courseLangEmptyHtml()}</li>`
        : `<li class="state">${t('no_ep')}</li>`;
      return;
    }
    list.innerHTML = visible.map(({ ep, ch, gidx }) => {
      const thumb = ep.thumbnail
        ? `<a href="${epUrl(ep, ch.slug)}"><img class="ep-thumb" src="${escapeHtml(ep.thumbnail)}" alt="" loading="lazy"></a>`
        : `<div class="ep-thumb-ph"></div>`;
      const otherTags = (ep.tags || []).filter(tag => tag !== theme);
      const tagPills  = otherTags.length
        ? `<div class="ep-tags">${otherTags.map(tag => `<span class="ep-tag">${escapeHtml(themeName(tag))}</span>`).join('')}</div>`
        : '';
      const playBtn = ep.audio_url
        ? `<button class="play-btn" data-gidx="${gidx}">${playIcon()} ${t('listen')}</button>`
        : '';
      return `<li class="ep-card" data-ep-dur="${ep.duration_secs || 0}">
        ${thumb}
        <div class="ep-body">
          <a class="ep-ch" href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.name)}</a>
          <a class="ep-title" href="${epUrl(ep, ch.slug)}" style="color:inherit;text-decoration:none;display:block" title="${escapeHtml(ep.title)}">${escapeHtml(ep.title)}</a>
          <div class="ep-date">${formatDate(ep.published)}${ep.duration_secs > 0 ? " - " + formatDuration(ep.duration_secs) : ""}</div>
          ${tagPills}${playBtn}
        </div>
      </li>`;
    }).join('');
  }

  function renderRabbiFilter(items, theme) {
    const row = document.getElementById('rabbi-filter-row');

    // Collect unique channels that have episodes in this theme, in order
    const seen = new Set();
    const channels = [];
    for (const { ch } of items) {
      if (!seen.has(ch.slug)) { seen.add(ch.slug); channels.push(ch); }
    }

    // Only show filter row when there are multiple rabbis
    if (channels.length < 2) { row.innerHTML = ''; return; }

    row.innerHTML = [
      `<button class="filter-chip${activeRabbiFilter === 'all' ? ' active' : ''}" data-slug="all">${escapeHtml(t('filter_all'))}</button>`,
      ...channels.map(ch =>
        `<button class="filter-chip${activeRabbiFilter === ch.slug ? ' active' : ''}" data-slug="${escapeHtml(ch.slug)}">` +
        `<img src="artwork/thumb/${escapeHtml(ch.slug)}.webp" alt="" onerror="if(this.dataset.fb){this.onerror=null;this.style.display='none'}else{this.dataset.fb='1';this.src='artwork/${escapeHtml(ch.slug)}.png'}">` +
        `${escapeHtml(ch.name)}</button>`
      ),
    ].join('');

    row.onclick = e => {
      const chip = e.target.closest('.filter-chip');
      if (!chip) return;
      activeRabbiFilter = chip.dataset.slug;
      row.querySelectorAll('.filter-chip').forEach(c =>
        c.classList.toggle('active', c.dataset.slug === activeRabbiFilter)
      );
      renderEpisodeList(items, theme);
    };
  }

  function openTheme(theme) {
    currentTheme = theme;
    activeRabbiFilter = 'all';
    window.location.hash = encodeURIComponent(theme);

    const panel = document.getElementById('episodes-panel');
    document.getElementById('panel-title').textContent = themeName(theme);
    const items = themeIndex[theme] || [];

    renderRabbiFilter(items, theme);
    renderEpisodeList(items, theme);

    // Reusable homepage-style carousel: most recent courses for this theme.
    const _mount = document.getElementById('theme-carousel');
    if (_mount) {
      _mount.innerHTML = '';
      const _flat = [...items].sort((a, b) => new Date(b.ep.published) - new Date(a.ep.published));
      const _label = (lang === 'he' ? 'שיעורים אחרונים · ' : (lang === 'en' ? 'Latest classes · ' : 'Derniers cours · ')) + themeName(theme);
      const _car = buildCarousel(_label, _flat.slice(0, 20).map(x => ({ ep: x.ep, ch: x.ch })));
      if (_car) _mount.appendChild(_car);
    }

    panel.classList.add('visible');
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });

    document.querySelectorAll('.theme-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.theme === theme);
    });
  }


  // Global search on themes
  document.getElementById('global-search').addEventListener('input', function() {
    var q = this.value.toLowerCase().trim();
    if (!q) {
      document.querySelectorAll('.theme-btn').forEach(function(b) { b.hidden = false; });
      return;
    }
    document.querySelectorAll('.theme-btn').forEach(function(b) {
      b.hidden = !b.dataset.theme.toLowerCase().includes(q);
    });
  });
  loadAll();
</script>
