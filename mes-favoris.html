  <style>

      --color-surface: #fff;
      --color-surface-alt: #eee;
      --color-text: #222;
      --color-text-secondary: #333;
      --color-text-tertiary: #555;
      --color-text-muted: #666;
      --color-text-subtle: #888;
      --color-text-faint: #999;
      --color-text-disabled: #aaa;
      --color-border: #ddd;
      --color-border-soft: #e0e0e0;
      /* Accent */
      --color-accent: #e87722;
      --color-on-accent: #fff;
      /* Inverse surfaces (dark header, footer, menus) */
      --color-inverse-bg: #1a1a2e;
      --color-inverse-surface: #252545;
      --color-inverse-heading: #aab;
      --color-on-inverse: #fff;
      --color-on-inverse-soft: rgba(255,255,255,.78);
      --color-on-inverse-muted: rgba(255,255,255,.65);
      --color-on-inverse-dim: rgba(255,255,255,.6);
      --color-inverse-border: rgba(255,255,255,.2);
      --color-inverse-border-strong: rgba(255,255,255,.35);
      --color-inverse-border-soft: rgba(255,255,255,.15);
      --color-inverse-border-faint: rgba(255,255,255,.12);
      --color-inverse-hover: rgba(255,255,255,.1);
      --color-inverse-hover-soft: rgba(255,255,255,.12);
      --color-inverse-tint: rgba(255,255,255,.05);
      --color-inverse-scrim: rgba(255,255,255,.5);
      /* Elevation */
      --shadow-card: rgba(0,0,0,.08);
      --shadow-card-soft: rgba(0,0,0,.06);
      --shadow-overlay: rgba(0,0,0,.5);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--color-bg); color: var(--color-text); line-height: 1.5; padding-bottom: 80px; }
    header { background: var(--color-inverse-bg); color: var(--color-on-inverse); padding: 28px 20px 0; text-align: center; }
    header h1 { font-size: 2rem; margin-bottom: 6px; }
    header p { color: var(--color-inverse-heading); font-size: 0.95rem; margin-bottom: 14px; }
    .header-nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; padding: 0 16px 20px; }
    .header-nav a { color: var(--color-on-inverse-muted); text-decoration: none; font-size: 0.8rem; padding: 5px 14px; border-radius: 20px; border: 1px solid var(--color-inverse-border); transition: background .15s, color .15s, border-color .15s; }
    .header-nav a:hover { color: var(--color-on-inverse); border-color: var(--color-inverse-scrim); background: var(--color-inverse-hover); }
    .header-nav a.active { color: var(--color-inverse-bg); background: var(--color-on-inverse); border-color: var(--color-on-inverse); font-weight: 600; }
    .nav-dropdown { position: relative; display: inline-flex; }
    .nav-dd-link { color: var(--color-on-inverse-muted); text-decoration: none; font-size: .8rem; padding: 5px 4px 5px 14px; border-radius: 20px 0 0 20px; border: 1px solid var(--color-inverse-border); border-right: none; transition: background .15s, color .15s; }
    .nav-dd-link:hover { color: var(--color-on-inverse); background: var(--color-inverse-hover); border-color: var(--color-inverse-scrim); }
    .nav-dd-caret { color: var(--color-on-inverse-muted); font-size: .8rem; padding: 5px 10px 5px 6px; border-radius: 0 20px 20px 0; border: 1px solid var(--color-inverse-border); border-left: none; background: none; cursor: pointer; font-family: inherit; transition: background .15s, color .15s; }
    .nav-dd-caret:hover, .nav-dropdown.open .nav-dd-caret { color: var(--color-on-inverse); background: var(--color-inverse-hover); border-color: var(--color-inverse-scrim); }
    .nav-submenu { display: none; position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: var(--color-inverse-surface); border: 1px solid var(--color-inverse-border-faint); border-radius: 12px; padding: 10px; z-index: 300; box-shadow: 0 8px 28px var(--shadow-overlay); flex-direction: column; gap: 4px; min-width: 170px; max-width: 92vw; }
    .nav-dropdown.open .nav-submenu { display: flex; }
    .nav-submenu a { color: var(--color-on-inverse-soft); text-decoration: none; padding: 6px 12px; border-radius: 20px; font-size: .78rem; white-space: nowrap; border: 1px solid var(--color-inverse-border-soft); transition: background .12s, color .12s; }
    .nav-submenu a:hover { background: var(--color-inverse-border-faint); color: var(--color-on-inverse); border-color: var(--color-inverse-border-strong); }
        .lang-switch { display: inline-flex; gap: 2px; margin: 6px auto 14px; padding: 2px; border: 1px solid var(--color-inverse-border); border-radius: 20px; background: var(--color-inverse-tint); }
    .lang-opt { color: var(--color-on-inverse-dim); font-size: .75rem; font-weight: 600; padding: 4px 11px; border-radius: 16px; border: none; background: none; cursor: pointer; font-family: inherit; letter-spacing: .02em; transition: background .15s, color .15s; }
    .lang-opt:hover { color: var(--color-on-inverse); }
    .lang-opt.active { background: var(--color-accent); color: var(--color-on-accent); }

    main { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
    .section-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--color-text-faint); font-weight: 600; margin: 28px 0 12px; }
    .section-label:first-child { margin-top: 0; }
    .fav-list { display: flex; flex-direction: column; gap: 10px; }
    .fav-card { display: flex; gap: 12px; align-items: center; background: var(--color-surface); border-radius: 12px; box-shadow: 0 1px 4px var(--shadow-card); padding: 10px 12px; }
    .fav-card img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: var(--color-surface-alt); }
    .fav-card-body { min-width: 0; flex: 1; }
    .fav-card-ch { font-size: .68rem; color: var(--color-accent); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 2px; }
    .fav-card-title { font-size: .9rem; font-weight: 600; color: var(--color-inverse-bg); text-decoration: none; line-height: 1.3; display: block; }
    .fav-card-title:hover { text-decoration: underline; }
    .fav-card-meta { font-size: .72rem; color: var(--color-text-faint); margin-top: 3px; }
    .fav-card-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .fav-card .fav-star { width: 1.7em; height: 1.7em; }
    .empty { color: var(--color-text-subtle); font-size: .9rem; background: var(--color-surface); border-radius: 12px; padding: 22px; text-align: center; box-shadow: 0 1px 4px var(--shadow-card-soft); }
    .empty a { color: var(--color-accent); font-weight: 600; }
    .intro { color: var(--color-text-muted); font-size: .85rem; margin-bottom: 4px; }
    @media (max-width: 520px) { .fav-card img { width: 56px; height: 56px; } }

<body>
<header>
  <h1><a href="./" style="color:inherit;text-decoration:none">The Torah Podcast</a></h1>
  <p data-i18n="subtitle">Cours de Torah — disponibles sur vos plateformes favorites</p>
  <nav class="header-nav">
    <a href="./" data-i18n="nav_home">Accueil</a>
    <div class="nav-dropdown" id="nav-dropdown">
      <a class="nav-dd-link" href="rabbins.html" data-i18n="nav_rabbis">Rabbins</a><button class="nav-dd-caret" aria-label="Voir la liste">▾</button>
      <div class="nav-submenu" id="nav-rabbis-submenu"></div>
    </div>
    <a href="derniers-cours.html" data-i18n="nav_last_classes">Derniers cours</a>
    <div class="nav-dropdown">
      <a class="nav-dd-link" href="daf-hayomi.html" data-i18n="nav_limud">Limud Yomi</a><button class="nav-dd-caret" aria-label="Limud Yomi">▾</button>
      <div class="nav-submenu" style="min-width:170px;">
        <a href="daf-hayomi.html" data-i18n="nav_daf_hayomi">Daf Hayomi</a>
        <a href="hitat.html" data-i18n="nav_hitat">Hitat Yomi</a>

      </div>
    </div>
    <a href="paracha.html" data-i18n="nav_paracha">Paracha</a>
    <a href="themes.html" data-i18n="nav_themes">Thème</a>
    <a href="mes-favoris.html" class="active" data-i18n="nav_favorites">Mes favoris</a>
  </nav>
  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" class="lang-opt" data-lang="fr" onclick="setLang('fr')">FR</button>
    <button type="button" class="lang-opt" data-lang="en" onclick="setLang('en')">EN</button>
    <button type="button" class="lang-opt" data-lang="he" onclick="setLang('he')">עב</button>
  </div>
</header>

<main>
  <p class="intro" data-i18n="intro">Vos favoris et votre écoute en cours sont enregistrés sur cet appareil, sans compte.</p>
  <div id="resume-section"></div>
  <div id="favorites-section"></div>
</main>

<script>
  window.lang = localStorage.getItem('lang') || 'fr';
  var lang = window.lang;
  const I18N = {
    fr: {
      nav_home:'Accueil', nav_rabbis:'Rabbins', nav_last_classes:'Derniers cours',
      nav_daf_hayomi:'Daf Hayomi', nav_limud:'Limud Yomi', nav_hitat:'Hitat Yomi', nav_hayomyom:'Hayom Yom', nav_paracha:'Paracha', nav_themes:'Thème', nav_favorites:'Mes favoris',
      lang_toggle:'English',
      subtitle:'Cours de Torah — disponibles sur vos plateformes favorites',
      intro:'Vos favoris et votre écoute en cours sont enregistrés sur cet appareil, sans compte.',
      resume_title:'Reprendre l’écoute',
      favorites_title:'Mes cours favoris',
      resume_at:'Reprendre à ',
      no_favorites:'Aucun favori pour le moment. Ajoutez un cours à vos favoris avec l’étoile ★ sur sa page.',
      no_resume:'Aucune écoute en cours.',
      browse:'Parcourir les cours',
    },
    en: {
      nav_home:'Home', nav_rabbis:'Rabbis', nav_last_classes:'Latest classes',
      nav_daf_hayomi:'Daf Hayomi', nav_limud:'Limud Yomi', nav_hitat:'Hitat Yomi', nav_hayomyom:'Hayom Yom', nav_paracha:'Parasha', nav_themes:'Topics', nav_favorites:'My favorites',
      lang_toggle:'עברית',
      subtitle:'Torah classes — available on your favorite platforms',
      intro:'Your favorites and your current listening are saved on this device, no account needed.',
      resume_title:'Resume listening',
      favorites_title:'My favorite classes',
      resume_at:'Resume at ',
      no_favorites:'No favorites yet. Add a class to your favorites with the ★ star on its page.',
      no_resume:'No listening in progress.',
      browse:'Browse classes',
    },
    he: {
      nav_home:'ראשי', nav_rabbis:'הרבנים', nav_last_classes:'שיעורים אחרונים',
      nav_daf_hayomi:'דף היומי', nav_limud:'לימוד יומי', nav_hitat:'חת"ת', nav_hayomyom:'היום יום', nav_paracha:'פרשה', nav_themes:'נושא', nav_favorites:'המועדפים שלי',
      lang_toggle:'Français',
      subtitle:'שיעורי תורה — זמינים בפלטפורמות האהובות עליכם',
      intro:'המועדפים וההאזנה הנוכחית שלכם נשמרים במכשיר זה, ללא חשבון.',
      resume_title:'המשך האזנה',
      favorites_title:'השיעורים המועדפים שלי',
      resume_at:'המשך מ-',
      no_favorites:'אין עדיין מועדפים. הוסיפו שיעור למועדפים בעזרת הכוכב ★ שבעמוד השיעור.',
      no_resume:'אין האזנה פעילה.',
      browse:'עיון בשיעורים',
    },
  };
  function t(k) { return (I18N[lang]||{})[k] || I18N.fr[k] || k; }
  function applyLang() {
    document.querySelectorAll('.lang-opt').forEach(function(b){ b.classList.toggle('active', b.dataset.lang === lang); });
    document.documentElement.lang = lang;
    document.documentElement.dir  = lang === 'he' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  }
  function setLang(l) { if (l === lang) return; localStorage.setItem('lang', l); location.reload(); }
  window.setLang = setLang;
  applyLang();

  document.addEventListener('click', e => {
    if (e.target.closest('.nav-submenu')) return;
    const caret = e.target.closest('.nav-dd-caret');
    document.querySelectorAll('.nav-dropdown.open').forEach(el => {
      if (!caret || el !== caret.closest('.nav-dropdown')) el.classList.remove('open');
    });
    if (caret) caret.closest('.nav-dropdown').classList.toggle('open');
  });

  // Populate the "Rabbins" submenu from the shared home.json (best-effort).
  fetch('home.json').then(r => r.ok ? r.json() : null).then(home => {
    if (!home) return;
    const sub = document.getElementById('nav-rabbis-submenu');
    if (!sub) return;
    const items = [].concat(home.channels || [], home.speakers || [])
      .map(c => `<a href="${escapeHtml(c.slug)}.html">${escapeHtml(c.name)}</a>`).join('');
    sub.innerHTML = items + `<a href="rabbins.html" style="opacity:.6">${lang==='he'?'כל הרבנים →':(lang==='en'?'All rabbis →':'Tous les rabbins →')}</a>`;
  }).catch(()=>{});

  function favCardHtml(ep) {
    const img = ep.thumb ? escapeHtml(ep.thumb) : '';
    const meta = { title: ep.title, ch: ep.ch, url: ep.url, thumb: ep.thumb, date: ep.date };
    return `<div class="fav-card" data-ep="${escapeHtml(ep.id||'')}">
        <a href="${escapeHtml(ep.url)}">${img?`<img src="${img}" alt="" loading="lazy">`:'<span class="fav-card-img"></span>'}</a>
        <div class="fav-card-body">
          ${ep.ch?`<div class="fav-card-ch">${escapeHtml(ep.ch)}</div>`:''}
          <a class="fav-card-title" href="${escapeHtml(ep.url)}">${escapeHtml(ep.title||ep.url)}</a>
          ${ep.date?`<div class="fav-card-meta">${formatDate(ep.date)}</div>`:''}
        </div>
        <div class="fav-card-actions">${favEpStarHtml(ep.id||'', meta)}</div>
      </div>`;
  }

  function renderFavorites() {
    const host = document.getElementById('favorites-section');
    const favs = getFavoriteEpisodes();
    let html = `<div class="section-label">${t('favorites_title')}</div>`;
    if (!favs.length) {
      html += `<div class="empty">${t('no_favorites')}<br><br><a href="derniers-cours.html">${t('browse')}</a></div>`;
    } else {
      html += `<div class="fav-list">${favs.map(favCardHtml).join('')}</div>`;
    }
    host.innerHTML = html;
  }

  // "Reprendre l'écoute": scan resume_* keys and match them against known
  // episodes from the favorites list + the search index (for titles/URLs).
  async function renderResume() {
    const host = document.getElementById('resume-section');
    const positions = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf('resume_') === 0) {
        const secs = parseInt(localStorage.getItem(k) || '0', 10);
        if (secs > 5) positions[k.slice('resume_'.length)] = secs;
      }
    }
    const ids = Object.keys(positions);
    if (!ids.length) return; // nothing in progress — hide the whole section

    // Resolve id -> {title, ch, url, thumb} using favorites first, then video_id in search-index.
    const byId = {};
    getFavoriteEpisodes().forEach(e => { if (e && e.id) byId[e.id] = e; });
    const unresolved = ids.filter(id => !byId[id]);
    if (unresolved.length) {
      try {
        const idx = await fetch('search-index.json').then(r => r.ok ? r.json() : []);
        // search-index entries carry no video_id, but the episode URL ends with the
        // slug+date; we can only resolve favorites reliably. Unresolved ids get a
        // minimal card linking nowhere is useless, so we keep only resolvable ones.
      } catch (_) {}
    }
    const items = ids.filter(id => byId[id]).map(id => Object.assign({}, byId[id], { _pos: positions[id] }));
    if (!items.length) return;
    items.sort((a,b) => (b.date||'').localeCompare(a.date||''));

    let html = `<div class="section-label">${t('resume_title')}</div><div class="fav-list">`;
    html += items.map(ep => {
      const img = ep.thumb ? escapeHtml(ep.thumb) : '';
      return `<div class="fav-card">
          <a href="${escapeHtml(ep.url)}">${img?`<img src="${img}" alt="" loading="lazy">`:''}</a>
          <div class="fav-card-body">
            ${ep.ch?`<div class="fav-card-ch">${escapeHtml(ep.ch)}</div>`:''}
            <a class="fav-card-title" href="${escapeHtml(ep.url)}">${escapeHtml(ep.title||ep.url)}</a>
            <div class="fav-card-meta">${t('resume_at')}${formatMmSs(ep._pos)}</div>
          </div>
        </div>`;
    }).join('');
    html += '</div>';
    host.innerHTML = html;
  }

  renderResume();
  renderFavorites();
  // Keep the list live when a star is toggled from this page.
  document.addEventListener('favepchange', renderFavorites);
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
