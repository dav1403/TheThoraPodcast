<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirection — The Torah Podcast</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f5f0; color: #555; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    p { font-size: 1rem; }
    a { color: #e87722; }
  </style>
</head>
<body>
<p>Redirection en cours… <a href="./">Accueil</a></p>
<script>
  (function() {
    var params = new URLSearchParams(location.search);
    var vid = params.get('v');
    var ch  = params.get('ch');
    if (!vid) { location.replace('./'); return; }

    function slugify(title, maxLen) {
      maxLen = maxLen || 70;
      return title.toLowerCase().normalize('NFD')
        .replace(/\p{Mn}/gu, '')
        .replace(/[^a-z0-9א-תװ-״]+/gu, '-')
        .replace(/^-+|-+$/g, '').replace(/-+/g, '-')
        .slice(0, maxLen).replace(/-+$/, '');
    }
    function epUrl(ep, slug) {
      var s = slugify(ep.title || '');
      var prefix = slug + '-';
      if (s.startsWith(prefix)) s = s.slice(prefix.length) || (ep.video_id || 'episode');
      return 'episodes/' + slug + '/' + s + '-' + (ep.published || '').slice(0, 10) + '.html';
    }
    function tryFeed(slug, callback) {
      fetch('feeds/' + slug + '.entries.json')
        .then(function(r) { return r.ok ? r.json() : []; })
        .then(function(entries) {
          var ep = entries.find(function(e) { return e.video_id === vid; });
          callback(ep ? { ep: ep, slug: slug } : null);
        })
        .catch(function() { callback(null); });
    }

    if (ch) {
      tryFeed(ch, function(res) {
        if (res) { location.replace(epUrl(res.ep, res.slug)); }
        else { location.replace('./'); }
      });
    } else {
      fetch('channels.json')
        .then(function(r) { return r.json(); })
        .then(function(channels) {
          var slugs = channels.filter(function(c) { return c.enabled; }).map(function(c) { return c.slug; });
          var i = 0;
          function next() {
            if (i >= slugs.length) { location.replace('./'); return; }
            tryFeed(slugs[i++], function(res) {
              if (res) { location.replace(epUrl(res.ep, res.slug)); } else { next(); }
            });
          }
          next();
        })
        .catch(function() { location.replace('./'); });
    }
  })();
</script>
</body>
</html>
