<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Épisode — The Torah Podcast</title>
  <meta name="description" content="Écoutez ce cours de Torah sur The Torah Podcast.">
  <link rel="canonical" href="https://thetorahpodcast.net/episode.html">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/artwork/rav-itshak-cohen.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Torah Podcast">
  <meta property="og:image" content="https://thetorahpodcast.net/artwork/rav-itshak-cohen.png">
  <meta name="twitter:card" content="summary_large_image">

  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-7Z2QEN865Y');</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f0; color: #222; line-height: 1.5; }
    header { background: #1a1a2e; color: #fff; padding: 28px 20px 0; text-align: center; }
    header h1 { font-size: 2rem; margin-bottom: 6px; }
    header p { color: #aab; font-size: .95rem; margin-bottom: 14px; }
    .header-nav { display:flex; justify-content:center; flex-wrap:wrap; gap:6px; padding:0 16px 20px; }
    .header-nav a { color:rgba(255,255,255,.65); text-decoration:none; font-size:.8rem; padding:5px 14px; border-radius:20px; border:1px solid rgba(255,255,255,.2); transition:background .15s,color .15s; }
    .header-nav a:hover { color:#fff; border-color:rgba(255,255,255,.5); background:rgba(255,255,255,.1); }
    .header-nav a.active { color:#1a1a2e; background:#fff; border-color:#fff; font-weight:600; }
    .nav-dropdown { position:relative; display:inline-flex; }
    .nav-dd-link { color:rgba(255,255,255,.65); text-decoration:none; font-size:.8rem; padding:5px 4px 5px 14px; border-radius:20px 0 0 20px; border:1px solid rgba(255,255,255,.2); border-right:none; transition:background .15s,color .15s; }
    .nav-dd-link:hover { color:#fff; background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.5); }
    .nav-dd-caret { color:rgba(255,255,255,.65); font-size:.8rem; padding:5px 10px 5px 6px; border-radius:0 20px 20px 0; border:1px solid rgba(255,255,255,.2); border-left:none; background:none; cursor:pointer; font-family:inherit; transition:background .15s,color .15s; }
    .nav-dd-caret:hover, .nav-dropdown.open .nav-dd-caret { color:#fff; background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.5); }
    .nav-submenu { display:none; position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); background:#252545; border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:10px; z-index:300; box-shadow:0 8px 28px rgba(0,0,0,.5); flex-wrap:wrap; gap:4px; min-width:340px; max-width:92vw; }
    .nav-dropdown.open .nav-submenu { display:flex; }
    .nav-submenu a { color:rgba(255,255,255,.78); text-decoration:none; padding:6px 12px; border-radius:20px; font-size:.78rem; white-space:nowrap; border:1px solid rgba(255,255,255,.15); transition:background .12s,color .12s; }
    .nav-submenu a:hover { background:rgba(255,255,255,.12); color:#fff; border-color:rgba(255,255,255,.35); }
    .lang-btn { color:rgba(255,255,255,.65); font-size:.8rem; padding:5px 14px; border-radius:20px; border:1px solid rgba(255,255,255,.2); background:none; cursor:pointer; font-family:inherit; transition:background .15s,color .15s; }
    .lang-btn:hover { color:#fff; background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.5); }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 60px; }
    .breadcrumb { font-size:.78rem; color:#aaa; margin-bottom:24px; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
    .breadcrumb a { color:#888; text-decoration:none; } .breadcrumb a:hover { color:#1a1a2e; text-decoration:underline; }
    .breadcrumb span { color:#ccc; }
    .ep-card { background:#fff; border-radius:16px; box-shadow:0 2px 12px rgba(0,0,0,.09); overflow:hidden; margin-bottom:32px; }
    .ep-hero { position:relative; }
    .ep-hero img { width:100%; max-height:320px; object-fit:cover; display:block; background:#e0e0e0; }
    .ep-hero-ph { width:100%; height:180px; background:linear-gradient(135deg,#1a1a2e,#2d2d60); }
    .ep-content { padding:24px; }
    .ep-channel-row { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
    .ep-ch-art { width:36px; height:36px; border-radius:8px; object-fit:cover; background:#e0e0e0; flex-shrink:0; }
    .ep-ch-name { font-size:.85rem; color:#555; text-decoration:none; font-weight:600; }
    .ep-ch-name:hover { color:#1a1a2e; }
    .ep-title { font-size:1.35rem; font-weight:700; line-height:1.3; margin-bottom:8px; color:#1a1a2e; }
    .ep-date { font-size:.78rem; color:#aaa; margin-bottom:20px; }
    .ep-tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
    .ep-tag { background:#f0f0ea; border-radius:20px; padding:3px 10px; font-size:.72rem; color:#666; }
    .ep-player-wrap { background:#f8f8f4; border-radius:12px; padding:16px; margin-bottom:20px; }
    .ep-player-label { font-size:.72rem; color:#aaa; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
    audio.ep-audio { width:100%; height:36px; accent-color:#e87722; }
    .speed-bar { display:flex; align-items:center; gap:6px; margin-top:10px; font-size:.75rem; color:#888; }
    .speed-btn { background:none; border:1px solid #ddd; color:#777; border-radius:4px; padding:3px 9px; font-size:.72rem; cursor:pointer; font-family:inherit; transition:background .12s,color .12s,border-color .12s; }
    .speed-btn:hover, .speed-btn.active { background:#1a1a2e; color:#fff; border-color:#1a1a2e; }
    .ep-desc { font-size:.9rem; color:#555; line-height:1.7; margin-bottom:20px; white-space:pre-wrap; }
    .ep-actions { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
    .btn-channel { display:inline-flex; align-items:center; gap:7px; background:#1a1a2e; color:#fff; text-decoration:none; border-radius:20px; padding:8px 18px; font-size:.82rem; font-weight:600; transition:background .15s; }
    .btn-channel:hover { background:#2d2d50; }
    .share-btn { display:inline-flex; align-items:center; gap:7px; background:none; border:1px solid #ccc; border-radius:20px; padding:8px 18px; font-size:.82rem; color:#555; cursor:pointer; font-family:inherit; transition:background .12s,border-color .12s,color .12s; }
    .share-btn:hover { background:#f5f5f0; border-color:#aaa; color:#222; }
    .related-section { margin-top:32px; }
    .section-label { font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#999; margin-bottom:12px; }
    .related-list { list-style:none; background:#fff; border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.07); overflow:hidden; }
    .related-item { display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid #f0f0f0; align-items:flex-start; text-decoration:none; color:inherit; transition:background .12s; }
    .related-item:last-child { border-bottom:none; }
    .related-item:hover { background:#f8f8f4; }
    .rel-thumb { width:72px; height:48px; object-fit:cover; border-radius:6px; flex-shrink:0; background:#ddd; }
    .rel-thumb-ph { width:72px; height:48px; border-radius:6px; flex-shrink:0; background:#e8e8e8; }
    .rel-title { font-size:.82rem; font-weight:600; color:#222; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:3px; }
    .rel-date { font-size:.7rem; color:#aaa; }
    .state { padding:60px 20px; text-align:center; color:#888; font-size:.9rem; }
    .state.loading::before { content:''; display:inline-block; width:16px; height:16px; border:2px solid #ccc; border-top-color:#555; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:8px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1a1a2e; color:#fff; padding:8px 18px; border-radius:20px; font-size:.82rem; z-index:500; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; box-shadow:0 4px 14px rgba(0,0,0,.3); }
    .toast.show { opacity:1; }
    @media (max-width:500px) { .ep-title { font-size:1.1rem; } }
  </style>
</head>
<body>

<header>
  <h1>The Torah Podcast</h1>
  <p data-i18n="subtitle">Cours de Torah — disponibles sur vos plateformes favorites</p>
  <nav class="header-nav">
    <a href="./" data-i18n="nav_home">Accueil</a>
    <div class="nav-dropdown" id="nav-dropdown">
      <a class="nav-dd-link" href="links.html" data-i18n="nav_rabbis">Rabbins</a><button class="nav-dd-caret" aria-label="Voir la liste">▾</button>
      <div class="nav-submenu" id="nav-rabbis-submenu"></div>
    </div>
    <a href="derniers-cours.html" data-i18n="nav_last_classes">Derniers cours</a>
    <a href="daf-hayomi.html" data-i18n="nav_daf_hayomi">Daf Hayomi</a>
    <a href="parasha.html" data-i18n="nav_parasha">Paracha</a>
    <a href="themes.html" data-i18n="nav_themes">Thème</a>
    <button class="lang-btn" onclick="toggleLang()" data-i18n="lang_toggle">עברית</button>
  </nav>
</header>

<main id="main">
  <div class="state loading" id="loading-state">Chargement…</div>
</main>

<div class="toast" id="toast"></div>

<script>
  const I18N = {
    fr: {
      nav_home:'Accueil', nav_rabbis:'Rabbins', nav_last_classes:'Derniers cours', nav_daf_hayomi:'Daf Hayomi',
      nav_parasha:'Paracha', nav_themes:'Thème', lang_toggle:'עברית',
      subtitle:'Cours de Torah — disponibles sur vos plateformes favorites',
      back_to:'Retour à', listen:'Écouter', speed:'Vitesse :', share:'Partager',
      all_episodes:'Tous les épisodes →', related:'Autres cours', not_found:'Épisode introuvable.',
      copied:'Lien copié !',
    },
    he: {
      nav_home:'ראשי', nav_rabbis:'הרבנים', nav_last_classes:'שיעורים אחרונים', nav_daf_hayomi:'דף היומי',
      nav_parasha:'פרשה', nav_themes:'נושא', lang_toggle:'Français',
      subtitle:'שיעורי תורה — זמינים בפלטפורמות האהובות עליכם',
      back_to:'חזרה אל', listen:'האזן', speed:'מהירות:', share:'שתף',
      all_episodes:'כל הפרקים ←', related:'שיעורים נוספים', not_found:'הפרק לא נמצא.',
      copied:'הקישור הועתק!',
    },
  };
  let lang = localStorage.getItem('lang') || 'fr';
  function t(k) { return (I18N[lang]||{})[k] || I18N.fr[k] || k; }
  function applyLang() {
    document.documentElement.lang = lang === 'he' ? 'he' : 'fr';
    document.documentElement.dir  = lang === 'he' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  }
  function toggleLang() { localStorage.setItem('lang', lang === 'fr' ? 'he' : 'fr'); location.reload(); }
  applyLang();

  document.addEventListener('click', e => {
    if (e.target.closest('.nav-submenu')) return;
    const caret = e.target.closest('.nav-dd-caret');
    document.querySelectorAll('.nav-dropdown.open').forEach(el => {
      if (!caret || el !== caret.closest('.nav-dropdown')) el.classList.remove('open');
    });
    if (caret) caret.closest('.nav-dropdown').classList.toggle('open');
  });

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function formatDate(iso) {
    return new Date(iso).toLocaleDateString(lang === 'he' ? 'he-IL' : 'fr-FR', { day:'numeric', month:'long', year:'numeric' });
  }

  // Speed control
  let currentSpeed = parseFloat(localStorage.getItem('playbackSpeed') || '1');
  function initSpeed(audioEl) {
    audioEl.playbackRate = currentSpeed;
    const bar = audioEl.closest('.ep-player-wrap').querySelector('.speed-bar');
    if (!bar) return;
    bar.querySelectorAll('.speed-btn').forEach(btn => {
      btn.classList.toggle('active', parseFloat(btn.dataset.speed) === currentSpeed);
      btn.addEventListener('click', () => {
        currentSpeed = parseFloat(btn.dataset.speed);
        localStorage.setItem('playbackSpeed', currentSpeed);
        audioEl.playbackRate = currentSpeed;
        bar.querySelectorAll('.speed-btn').forEach(b => b.classList.toggle('active', b === btn));
      });
    });
  }

  // Resume
  function initResume(audioEl, videoId) {
    const saved = parseInt(localStorage.getItem('resume_' + videoId) || '0');
    if (saved > 5) audioEl.addEventListener('loadedmetadata', () => { audioEl.currentTime = saved; }, { once: true });
    audioEl.addEventListener('timeupdate', () => {
      if (audioEl.currentTime > 5) localStorage.setItem('resume_' + videoId, Math.floor(audioEl.currentTime));
    });
    audioEl.addEventListener('ended', () => { localStorage.removeItem('resume_' + videoId); });
  }

  (async () => {
    const params = new URLSearchParams(location.search);
    const videoId = params.get('v');
    const chSlug  = params.get('ch');
    const main    = document.getElementById('main');

    if (!videoId) {
      main.innerHTML = `<div class="state">${t('not_found')}</div>`;
      return;
    }

    // Load channels for nav submenu
    let channels = [];
    try {
      const r = await fetch('channels.json');
      if (r.ok) channels = (await r.json()).filter(ch => ch.enabled);
    } catch(_) {}
    const sub = document.getElementById('nav-rabbis-submenu');
    if (sub) sub.innerHTML = channels.map(ch => `<a href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.podcast_author)}</a>`).join('');

    // Find the episode
    let ep = null, chData = null;

    async function searchFeed(slug) {
      try {
        const r = await fetch(`feeds/${slug}.entries.json`);
        if (!r.ok) return null;
        const entries = await r.json();
        return entries.find(e => e.video_id === videoId) || null;
      } catch(_) { return null; }
    }

    if (chSlug) {
      ep = await searchFeed(chSlug);
      if (ep) chData = channels.find(c => c.slug === chSlug);
    }

    if (!ep) {
      for (const ch of channels) {
        ep = await searchFeed(ch.slug);
        if (ep) { chData = ch; break; }
      }
    }

    if (!ep || !chData) {
      main.innerHTML = `<div class="state">${t('not_found')}</div>`;
      return;
    }

    // Update page meta
    document.title = `${ep.title} — The Torah Podcast`;
    document.querySelector('meta[name="description"]').content = ep.description ? ep.description.slice(0, 155) : ep.title;

    // Track GA4 event
    if (typeof gtag !== 'undefined') {
      gtag('event', 'episode_view', { ep_title: ep.title, rav: chData.podcast_author });
    }

    const slug = chData.slug;
    const chName = chData.podcast_author;
    const tags = ep.tags || [];
    const tagsHtml = tags.length
      ? `<div class="ep-tags">${tags.map(t => `<span class="ep-tag">${escapeHtml(t)}</span>`).join('')}</div>` : '';

    const heroHtml = ep.thumbnail
      ? `<img src="${escapeHtml(ep.thumbnail)}" alt="${escapeHtml(ep.title)}" loading="eager">`
      : `<div class="ep-hero-ph"></div>`;

    const descHtml = ep.description
      ? `<p class="ep-desc">${escapeHtml(ep.description)}</p>` : '';

    const shareUrl = `https://thetorahpodcast.net/episode.html?v=${encodeURIComponent(videoId)}&ch=${encodeURIComponent(slug)}`;

    main.innerHTML = `
      <nav class="breadcrumb">
        <a href="./">The Torah Podcast</a>
        <span>›</span>
        <a href="${escapeHtml(slug)}.html">${escapeHtml(chName)}</a>
        <span>›</span>
        <span>${escapeHtml(ep.title.slice(0, 60))}${ep.title.length > 60 ? '…' : ''}</span>
      </nav>

      <div class="ep-card">
        <div class="ep-hero">${heroHtml}</div>
        <div class="ep-content">
          <div class="ep-channel-row">
            <img class="ep-ch-art" src="artwork/${escapeHtml(slug)}.png" alt=""
                 onerror="this.style.display='none'">
            <a class="ep-ch-name" href="${escapeHtml(slug)}.html">${escapeHtml(chName)}</a>
          </div>
          <h1 class="ep-title">${escapeHtml(ep.title)}</h1>
          <div class="ep-date">${formatDate(ep.published)}</div>
          ${tagsHtml}
          <div class="ep-player-wrap">
            <div class="ep-player-label">${t('listen')}</div>
            <audio class="ep-audio" controls src="${escapeHtml(ep.audio_url)}" preload="metadata" id="main-audio"></audio>
            <div class="speed-bar">
              <span>${t('speed')}</span>
              <button class="speed-btn" data-speed="1">1×</button>
              <button class="speed-btn" data-speed="1.25">1.25×</button>
              <button class="speed-btn" data-speed="1.5">1.5×</button>
              <button class="speed-btn" data-speed="2">2×</button>
            </div>
          </div>
          ${descHtml}
          <div class="ep-actions">
            <a class="btn-channel" href="${escapeHtml(slug)}.html">${t('all_episodes')}</a>
            <button class="share-btn" id="share-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
              ${t('share')}
            </button>
          </div>
        </div>
      </div>

      <div class="related-section" id="related"></div>`;

    // Init player
    const audioEl = document.getElementById('main-audio');
    if (audioEl) { initSpeed(audioEl); initResume(audioEl, videoId); }

    // Share button
    document.getElementById('share-btn').addEventListener('click', () => {
      if (navigator.share) navigator.share({ title: ep.title, url: shareUrl });
      else navigator.clipboard.writeText(shareUrl).then(() => showToast(t('copied')));
    });

    // Load related episodes
    try {
      const r = await fetch(`feeds/${slug}.entries.json`);
      if (r.ok) {
        const entries = (await r.json())
          .filter(e => e.video_id !== videoId)
          .sort((a, b) => new Date(b.published) - new Date(a.published))
          .slice(0, 5);
        if (entries.length) {
          document.getElementById('related').innerHTML = `
            <div class="section-label">${t('related')}</div>
            <ul class="related-list">
              ${entries.map(e => `
                <li>
                  <a class="related-item" href="episode.html?v=${escapeHtml(e.video_id)}&ch=${escapeHtml(slug)}">
                    ${e.thumbnail ? `<img class="rel-thumb" src="${escapeHtml(e.thumbnail)}" alt="" loading="lazy">` : `<div class="rel-thumb-ph"></div>`}
                    <div>
                      <div class="rel-title">${escapeHtml(e.title)}</div>
                      <div class="rel-date">${formatDate(e.published)}</div>
                    </div>
                  </a>
                </li>`).join('')}
            </ul>`;
        }
      }
    } catch(_) {}
  })();
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
