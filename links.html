  };
  let lang = localStorage.getItem('lang') || 'fr';
  function t(k) { return (I18N[lang]||{})[k] || I18N.fr[k] || k; }
  function applyLang() {
    document.documentElement.lang = lang === 'he' ? 'he' : 'fr';
    document.documentElement.dir  = lang === 'he' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.dataset.i18n;
      if (k.startsWith('|')) el.placeholder = t(k.slice(1));
      else el.textContent = t(k);
    });
  }
  function toggleLang() { localStorage.setItem('lang', lang === 'fr' ? 'he' : 'fr'); location.reload(); }
  applyLang();

  const PLATFORM_META = {
    spotify: {
      label: 'Spotify',

      icon:  `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>`,
    },
    apple: {

      cls:   'btn-apple',
      icon:  `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm0 4.3a7.7 7.7 0 0 1 5.44 13.14c-.37.37-.79.69-1.25.94-.1-.76-.28-1.63-.58-2.35.52-.48.87-1.15.87-1.9 0-1.43-1.16-2.59-2.59-2.59s-2.59 1.16-2.59 2.59c0 .75.32 1.42.83 1.9-.3.72-.48 1.59-.58 2.35a7.68 7.68 0 0 1-1.25-.94A7.7 7.7 0 0 1 12 4.3zm0 2.1a5.6 5.6 0 0 0-3.96 9.56c.18-.83.46-1.74.9-2.45a4.15 4.15 0 0 1-.54-2.03A3.6 3.6 0 0 1 12 7.9a3.6 3.6 0 0 1 3.6 3.58 4.15 4.15 0 0 1-.54 2.03c.44.71.72 1.62.9 2.45A5.6 5.6 0 0 0 12 6.4zm0 3.1a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm0 5.6c1.05 0 1.82.28 2.3.55-.26 1.18-.38 2.28-.32 3.03a7.65 7.65 0 0 1-1.98.26 7.65 7.65 0 0 1-1.98-.26c.06-.75-.06-1.85-.32-3.03.48-.27 1.25-.55 2.3-.55z"/></svg>`,
    },
    deezer: {
      label: 'Deezer',
      cls:   'btn-deezer',
      icon:  `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.944 17.369h4.512v1.601h-4.512zm0-3.075h4.512v1.6h-4.512zm0-3.074h4.512v1.601h-4.512zm-5.944 6.15h4.512v1.6H13zm0-3.075h4.512v1.6H13zm0-3.074h4.512v1.601H13zm-5.944 6.149h4.512v1.6H7.056zm0-3.075h4.512v1.6H7.056zM1.112 17.37h4.512v1.6H1.112z"/></svg>`,

    },
  };

  function copyRss(btn, url) {
    navigator.clipboard.writeText(url).then(() => {
      btn.classList.add('copied');
      btn.textContent = t('copied');
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> ${t('copy_rss')}`;
      }, 2000);
    });
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatDate(iso) {
    const locale = lang === 'he' ? 'he-IL' : 'fr-FR';
    return new Date(iso).toLocaleDateString(locale, { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function latestEpisode(entries) {
    if (!entries.length) return null;
    return entries.reduce((best, ep) =>
      new Date(ep.published) > new Date(best.published) ? ep : best
    );
  }

  function renderCard(ch, entries) {
    const platforms   = ch.platforms || {};
    const activeLinks = Object.entries(platforms).filter(([, url]) => url && url.trim());

    const rssUrl = `https://thetorahpodcast.net/feeds/${ch.slug}.xml`;
    const copyBtn = `<button class="copy-rss" onclick="copyRss(this,'${escapeHtml(rssUrl)}')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      ${t('copy_rss')}</button>`;

    const badges = activeLinks.map(([key, url]) => {
      const meta = PLATFORM_META[key];
      if (!meta) return '';
      return `<a class="platform-btn ${meta.cls}" href="${escapeHtml(url)}" target="_blank" rel="noopener">${meta.icon}${meta.label}</a>`;
    }).join('');

    const linksHtml = activeLinks.length
      ? `<div class="platform-links">${badges}${copyBtn}</div>`
      : `<div class="platform-links">${copyBtn}</div>`;

    const count  = entries.length;
    const latest = latestEpisode(entries);
    const epWord = count > 1 ? t('ep_plural') : t('ep_singular');
    const statsHtml = count > 0
      ? `<div class="card-stats">
           <strong>${count}</strong>&nbsp;${epWord}
           ${latest
             ? `&nbsp;·&nbsp;${t('last')}&nbsp;<span class="latest-title" title="${escapeHtml(latest.title)}">${escapeHtml(latest.title)}</span>&nbsp;—&nbsp;${formatDate(latest.published)}`
             : ''}
         </div>`
      : '';

    return `
      <div class="card">
        <img class="card-art" src="artwork/${escapeHtml(ch.slug)}.png" alt="${escapeHtml(ch.podcast_author)}"
             onerror="this.style.background='#e0e0e0';this.removeAttribute('src')">
        <div class="card-body">
          <div class="card-name-row">
            <a class="card-name" href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.podcast_author)}</a>
            <a class="episodes-link" href="${escapeHtml(ch.slug)}.html">${t('episodes_link')}</a>
          </div>
          ${linksHtml}
          ${statsHtml}
        </div>
      </div>`;
  }

  let allData     = [];
  let currentSort = 'latest';

  function getSorted(sort) {
    const data = [...allData];
    if (sort === 'alpha') {
      data.sort((a, b) => a.ch.podcast_author.localeCompare(b.ch.podcast_author, 'fr'));
    } else {
      data.sort((a, b) => {
        const la = latestEpisode(a.entries);
        const lb = latestEpisode(b.entries);
        if (!la && !lb) return 0;
        if (!la) return 1;
        if (!lb) return -1;
        return new Date(lb.published) - new Date(la.published);
      });
    }
    return data;
  }

  function setSort(sort) {
    currentSort = sort;
    document.getElementById('sort-latest').classList.toggle('active', sort === 'latest');
    document.getElementById('sort-alpha').classList.toggle('active', sort === 'alpha');
    document.getElementById('app').innerHTML =
      getSorted(sort).map(({ ch, entries }) => renderCard(ch, entries)).join('');
  }

  (async () => {
    const app = document.getElementById('app');

    let channels = [];
    try {
      const res = await fetch('channels.json');
      if (res.ok) channels = (await res.json()).filter(ch => ch.enabled);
    } catch (_) {}

    if (!channels.length) {
      app.innerHTML = `<p style="text-align:center;color:#aaa;padding:40px">${t('no_channels')}</p>`;
      document.getElementById('header-stats').textContent = '';
      return;
    }

    allData = await Promise.all(channels.map(async ch => {
      try {
        const r = await fetch(`feeds/${ch.slug}.entries.json`);
        const entries = r.ok ? await r.json() : [];
        return { ch, entries };
      } catch (_) {
        return { ch, entries: [] };
      }
    }));

    const totalEpisodes = allData.reduce((sum, { entries }) => sum + entries.length, 0);
    document.getElementById('header-stats').textContent =
      lang === 'he'
        ? `${channels.length} ערוצים · ${totalEpisodes} שיעורים פורסמו`
        : `Déjà ${channels.length} chaînes · ${totalEpisodes} cours publiés`;

    setSort('latest');

    const sub = document.getElementById('nav-rabbis-submenu');
    if (sub) sub.innerHTML = channels.map(ch =>
      `<a href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.podcast_author)}</a>`
    ).join('') + `<a class="nav-submenu-all" href="links.html">Tous les rabbins →</a>`;

  document.addEventListener('click', e => {
    if (e.target.closest('.nav-submenu')) return;
    const caret = e.target.closest('.nav-dd-caret');
    document.querySelectorAll('.nav-dropdown.open').forEach(el => {
      if (!caret || el !== caret.closest('.nav-dropdown')) el.classList.remove('open');
    });
    if (caret) caret.closest('.nav-dropdown').classList.toggle('open');
  });
  })();
</script>

<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
