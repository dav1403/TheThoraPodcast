// HebCal name → slug
const HEBCAL_SLUG = {};
for (const [slug, p] of Object.entries(PARASHIOT)) {
  HEBCAL_SLUG[p.hebcal.toLowerCase()] = slug;
}

// ─── Matching ────────────────────────────────────────────────────────────────
function matchesParasha(title, keywords) {
  const t = title.toLowerCase();
  return keywords.some(kw => {
    const k = kw.toLowerCase();
    if (/[֐-׿]/.test(k)) return t.includes(k);
    const escaped = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/[-']/g, '.');
    return new RegExp('(?:^|[\\s\\-_:,!?])' + escaped + '(?:[\\s\\-_:,!?]|$)', 'i').test(t);
  });
}

function findEpisodesForParasha(slug, allData) {
  const p = PARASHIOT[slug];
  if (!p) return [];
  const results = [];
  for (const { ch, entries } of allData) {
    const matching = entries.filter(ep => matchesParasha(ep.title, p.kw));
    if (matching.length) results.push({ ch, episodes: matching });
  }
  return results;
}

// ─── Player ──────────────────────────────────────────────────────────────────
const playerEl    = document.getElementById('player');
const playerAudio = document.getElementById('player-audio');
let activeBtn = null;

const SPEEDS = [1, 1.25, 1.5, 2];
let currentSpeed = parseFloat(localStorage.getItem('playbackSpeed') || '1');
const speedCycleBtn = document.getElementById('speed-cycle-btn');
function updateSpeedBtn() {
  speedCycleBtn.textContent = currentSpeed + '×';
  speedCycleBtn.classList.toggle('active', currentSpeed !== 1);
}
updateSpeedBtn();
speedCycleBtn.addEventListener('click', () => {
  const idx = SPEEDS.indexOf(currentSpeed);
  currentSpeed = SPEEDS[idx === -1 ? 1 : (idx + 1) % SPEEDS.length];
  localStorage.setItem('playbackSpeed', currentSpeed);
  if (playerAudio) playerAudio.playbackRate = currentSpeed;
  updateSpeedBtn();
});

function playIcon()  { return `<svg viewBox="0 0 10 10" fill="currentColor"><polygon points="2,1 9,5 2,9"/></svg>`; }
function pauseIcon() { return `<svg viewBox="0 0 10 10" fill="currentColor"><rect x="1.5" y="1" width="2.5" height="8"/><rect x="6" y="1" width="2.5" height="8"/></svg>`; }

document.addEventListener('click', e => {
  const btn = e.target.closest('.play-btn[data-audio]');
  if (!btn) return;
  if (btn === activeBtn) {
    if (playerAudio.paused) {
      playerAudio.play();
      btn.classList.add('playing');
      btn.innerHTML = pauseIcon() + ' ' + t('playing');
    } else {
      playerAudio.pause();
      btn.classList.remove('playing');
      btn.innerHTML = playIcon() + ' ' + t('listen');
    }
    return;
  }
  if (activeBtn && activeBtn !== btn) {
    activeBtn.classList.remove('playing');
    activeBtn.innerHTML = playIcon() + ' Écouter';
  }
  activeBtn = btn;
  btn.classList.add('playing');
  btn.innerHTML = pauseIcon() + ' En cours…';
  document.getElementById('player-title').textContent   = btn.dataset.title;
  document.getElementById('player-channel').textContent = btn.dataset.channel;
  document.getElementById('player-art').src             = btn.dataset.art || '';
  playerAudio.src = btn.dataset.audio;
  playerAudio.playbackRate = currentSpeed;
  playerAudio.play();
  playerEl.classList.remove('hidden');
});

document.getElementById('player-close').addEventListener('click', () => {
  playerAudio.pause();
  playerEl.classList.add('hidden');
  if (activeBtn) { activeBtn.classList.remove('playing'); activeBtn.innerHTML = playIcon() + ' ' + t('listen'); activeBtn = null; }
});
playerAudio.addEventListener('ended', () => {
  if (activeBtn) { activeBtn.classList.remove('playing'); activeBtn.innerHTML = playIcon() + ' ' + t('listen'); activeBtn = null; }
});

// ─── Render ──────────────────────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function slugify(title, maxLen = 70) {
  var s = title.toLowerCase().normalize('NFD')
    .replace(/\p{Mn}/gu, '').replace(/[^a-z0-9א-תװ-׻]+/gu, '-')
    .replace(/^-+|-+$/g, '').replace(/-+/g, '-').slice(0, maxLen).replace(/-+$/, '');
  return s;
}
function epUrl(ep, chSlug) {
  var s = slugify(ep.title || '');
  var prefix = chSlug + '-';
  if (s.startsWith(prefix)) s = s.slice(prefix.length) || (ep.video_id || 'episode');
  return `${chSlug}/${s}-${(ep.published || '').slice(0, 10)}.html`;
}
function formatDate(iso) {
  const locale = lang === 'he' ? 'he-IL' : 'fr-FR';
  return new Date(iso).toLocaleDateString(locale, { day:'numeric', month:'long', year:'numeric' });
}

function renderResults(slug, allData) {
  const p = PARASHIOT[slug];
  const groups = findEpisodesForParasha(slug, allData);
  const total = groups.reduce((s, g) => s + g.episodes.length, 0);

  document.getElementById('results-title').textContent = lang === 'he' ? p.he : p.fr;
  document.getElementById('results-he').textContent    = lang === 'he' ? '' : p.he;
  const epWord = total > 1 ? t('ep_plural') : t('ep_singular');
  document.getElementById('results-count').textContent = total ? `${total} ${epWord}` : '';

  const body = document.getElementById('results-body');

  if (!groups.length) {
    body.innerHTML = `<div class="no-results">${t('no_ep_found')}<br>${t('no_ep_hint')}</div>`;
    document.getElementById('results').hidden = false;
    document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }

  body.innerHTML = groups.map(({ ch, episodes }) => `
    <div class="result-channel">
      <div class="result-channel-header">
        <img class="result-channel-art" src="artwork/${escapeHtml(ch.slug)}.png" alt="" onerror="this.style.display='none'">
        <a class="result-channel-name" href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.name)}</a>
        <div class="result-channel-count">${episodes.length} ${episodes.length > 1 ? t('ep_plural') : t('ep_singular')}</div>
      </div>
      <ul class="episode-list">
        ${episodes.map(ep => `
          <li class="episode">
            ${ep.thumbnail
              ? `<img class="episode-thumb" src="${escapeHtml(ep.thumbnail)}" alt="" loading="lazy">`
              : `<div class="episode-thumb-ph"></div>`}
            <div class="episode-body">
              <a class="episode-title" href="${epUrl(ep, ch.slug)}" style="color:inherit;text-decoration:none;display:block">${escapeHtml(ep.title)}</a>
              <div class="episode-date">${formatDate(ep.published)}</div>
              ${ep.audio_url ? `
                <button class="play-btn"
                  data-audio="${escapeHtml(ep.audio_url)}"
                  data-title="${escapeHtml(ep.title)}"
                  data-channel="${escapeHtml(ch.name)}"
                  data-art="${escapeHtml(ep.thumbnail || `artwork/${ch.slug}.png`)}">
                  ${playIcon()} ${t('listen')}
                </button>` : ''}
            </div>
          </li>`).join('')}
      </ul>
    </div>`).join('');

  document.getElementById('results').hidden = false;
  document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function buildBooks(allData) {
  // Pre-compute counts
  const counts = {};
  for (const slug of Object.keys(PARASHIOT)) {
    counts[slug] = findEpisodesForParasha(slug, allData)
      .reduce((s, g) => s + g.episodes.length, 0);
  }

  return BOOKS.map(book => `
    <div class="book-section">
      <div class="book-title">${lang === 'he' ? (BOOK_HE[book.name] || book.name) : book.name}</div>
      <div class="chips">
        ${book.parashiot.map(slug => {
          const p = PARASHIOT[slug];
          const c = counts[slug] || 0;
          return `<button class="chip ${c > 0 ? 'has-episodes' : ''}"
            data-slug="${slug}" onclick="selectParasha('${slug}')">
            ${lang === 'he' ? p.he : p.fr}
            <span class="chip-count">${c}</span>
          </button>`;
        }).join('')}
      </div>
    </div>`).join('');
}

// ─── Current parasha ─────────────────────────────────────────────────────────
function extractSlugFromHebcal(data) {
  const item = data.items && data.items.find(i => i.category === 'parashat');
  if (!item) return null;
  const name = item.title.replace(/^Parashat\s+/i, '').toLowerCase();
  return HEBCAL_SLUG[name] || HEBCAL_SLUG[name.split('-')[0]] || null;
}

async function fetchCurrentParashot() {
  try {
    const [dataIL, diaDia] = await Promise.all([
      fetch('https://www.hebcal.com/shabbat?cfg=json&geonameid=293397&M=on').then(r => r.json()),
      fetch('https://www.hebcal.com/shabbat?cfg=json&geonameid=2988507&M=on').then(r => r.json()),
    ]);
    return { il: extractSlugFromHebcal(dataIL), dia: extractSlugFromHebcal(diaDia) };
  } catch (_) { return { il: null, dia: null }; }
}

let selectedSlug = null;
let globalAllData = null;

function selectParasha(slug) {
  if (!PARASHIOT[slug]) return;
  selectedSlug = slug;
  location.hash = slug;

  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.dataset.slug === slug);
  });

  if (globalAllData) renderResults(slug, globalAllData);
}

// ─── Init ────────────────────────────────────────────────────────────────────
(async () => {
  const [{ il: slugIL, dia: slugDia }, channels] = await Promise.all([
    fetchCurrentParashot(),
    fetch('channels.json').then(r => r.ok ? r.json() : []).catch(() => []),
  ]);

  const hasSplit = slugIL && slugDia && slugIL !== slugDia;
  const banner = document.getElementById('current-banner');
  banner.classList.remove('loading');

  if (hasSplit) {
    // Show cycle toggle — remember user's preference
    const savedCycle = localStorage.getItem('paracha_cycle') || 'dia';
    let activeCycle = savedCycle;
    let currentSlug = activeCycle === 'il' ? slugIL : slugDia;

    banner.classList.add('has-split');
    const pIL  = PARASHIOT[slugIL];
    const pDia = PARASHIOT[slugDia];

    banner.innerHTML = `
      <div>
        <div class="banner-label">${t('banner_label_split')}</div>
      </div>
      <div class="cycle-toggle">
        <button class="cycle-btn${activeCycle === 'il'  ? ' active' : ''}" data-cycle="il">
          ${t('cycle_il')} — ${lang === 'he' ? pIL.he : pIL.fr}
        </button>
        <button class="cycle-btn${activeCycle === 'dia' ? ' active' : ''}" data-cycle="dia">
          ${t('cycle_dia')} — ${lang === 'he' ? pDia.he : pDia.fr}
        </button>
      </div>`;

    banner.querySelectorAll('.cycle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const cycle = btn.dataset.cycle;
        localStorage.setItem('paracha_cycle', cycle);
        banner.querySelectorAll('.cycle-btn').forEach(b => b.classList.toggle('active', b.dataset.cycle === cycle));
        selectParasha(cycle === 'il' ? slugIL : slugDia);
      });
    });

    selectParasha(currentSlug);
  } else {
    // Normal single-paracha display
    const currentSlug = slugIL || slugDia;
    if (currentSlug) {
      const p = PARASHIOT[currentSlug];
      document.getElementById('banner-name').textContent = lang === 'he' ? p.he : p.fr;
      document.getElementById('banner-he').textContent   = p.he;
      banner.onclick = () => selectParasha(currentSlug);
    } else {
      document.getElementById('banner-name').textContent = t('no_parasha');
      banner.style.cursor = 'default';
      banner.onclick = null;
    }
  }

  // Load all episodes
  const enabled = channels.filter(ch => ch.enabled).map(ch => ({ slug: ch.slug, name: ch.podcast_author }));
  globalAllData = await Promise.all(enabled.map(async ch => {
    try {
      const r = await fetch(`feeds/${ch.slug}.entries.json`);
      const entries = r.ok ? await r.json() : [];
      entries.sort((a, b) => new Date(b.published) - new Date(a.published));
      return { ch, entries };
    } catch (_) { return { ch, entries: [] }; }
  }));

  const totalEp = globalAllData.reduce((s, {entries}) => s + entries.length, 0);
  renderStats(globalAllData.length, totalEp);

  const sub = document.getElementById('nav-rabbis-submenu');
  if (sub) sub.innerHTML = enabled.map(ch =>
    `<a href="${escapeHtml(ch.slug)}.html">${escapeHtml(ch.name)}</a>`
  ).join('') + `<a class="nav-submenu-all" href="links.html">Tous les rabbins →</a>`;

  document.addEventListener('click', e => {
    if (e.target.closest('.nav-submenu')) return;
    const caret = e.target.closest('.nav-dd-caret');
    document.querySelectorAll('.nav-dropdown.open').forEach(el => {
      if (!caret || el !== caret.closest('.nav-dropdown')) el.classList.remove('open');
    });
    if (caret) caret.closest('.nav-dropdown').classList.toggle('open');
  });

  // Render book chips
  document.getElementById('books-container').innerHTML = buildBooks(globalAllData);

  // Auto-select from hash; if no hash, hasSplit already called selectParasha above
  const hash = location.hash.replace('#', '');
  if (hash && PARASHIOT[hash]) {
    selectParasha(hash);
  } else if (!hasSplit) {
    const fallback = slugIL || slugDia;
    if (fallback) selectParasha(fallback);
  }
})();
</script>
